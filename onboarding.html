<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#F8FAFC" />
<title>Omega — Welcome</title>

<script>
  (function () {
    try {
      var lang = localStorage.getItem('omega_lang') || 'en';
      var html = document.documentElement;
      html.lang = lang;
      html.dir  = lang === 'ar' ? 'rtl' : 'ltr';
    } catch (e) {}
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --c-primary:       #0E9487;
  --c-primary-light: #2EC4B6;
  --c-blue:          #3B82F6;
  --c-purple:        #8B5CF6;
  --c-navy:          #0F172A;
  --c-slate:         #64748B;
  --c-bg:            #F8FAFC;
  --c-border:        #E2E8F0;

  --g-brand: linear-gradient(135deg, #0E9487 0%, #2EC4B6 45%, #3B82F6 100%);
  --g-text:  linear-gradient(135deg, #0E9487 0%, #3B82F6 55%, #8B5CF6 100%);

  --r-md: 14px;
  --r-pill: 999px;

  --f-en: 'Poppins', system-ui, sans-serif;
  --f-ar: 'Cairo', system-ui, sans-serif;

  --phone-w: 375px;
  --phone-h: 812px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--f-en);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  background: #E2E8F0;
  overflow: hidden;
}

html[lang="ar"] body { font-family: var(--f-ar); }

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

button:focus-visible {
  outline: 3px solid var(--c-primary);
  outline-offset: 3px;
  border-radius: var(--r-md);
}

/* PHONE FRAME */
.stage {
  width: 100vw; height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background:
    radial-gradient(circle at 20% 20%, rgba(139, 92, 246, 0.12), transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(14, 148, 135, 0.10), transparent 50%),
    #E2E8F0;
}

.phone {
  position: relative;
  width: var(--phone-w); height: var(--phone-h);
  max-height: calc(100vh - 40px);
  background: var(--c-bg);
  border-radius: 44px;
  overflow: hidden;
  box-shadow:
    0 0 0 10px #1a1a1a,
    0 0 0 12px #2a2a2a,
    0 40px 80px rgba(0, 0, 0, 0.35),
    0 20px 40px rgba(0, 0, 0, 0.15);
}

.phone::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 130px; height: 26px;
  background: #1a1a1a;
  border-radius: 0 0 18px 18px;
  z-index: 100;
}

@media (max-width: 480px) {
  body { background: var(--c-bg); }
  .stage { padding: 0; background: var(--c-bg); }
  .phone { width: 100vw; height: 100vh; max-height: 100vh; border-radius: 0; box-shadow: none; }
  .phone::before { display: none; }
}

/* SCREEN */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--c-bg);
  overflow: hidden;
}

.screen::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 25% 15%, rgba(139, 92, 246, 0.07), transparent 45%),
    radial-gradient(circle at 80% 85%, rgba(14, 148, 135, 0.06), transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* TOP BAR */
.topbar {
  position: relative;
  z-index: 10;
  display: flex;
  justify-content: flex-end;
  padding: 52px 22px 0;
  flex-shrink: 0;
}

@media (max-width: 480px) {
  .topbar { padding-top: 20px; padding-inline: 18px; }
}

.lang-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 14px;
  min-height: 44px;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(14, 148, 135, 0.15);
  border-radius: var(--r-pill);
  font-size: 13px;
  font-weight: 600;
  color: var(--c-navy);
  letter-spacing: 0.3px;
  transition: all 0.25s ease;
  box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
}

.lang-toggle:hover {
  background: #fff;
  border-color: rgba(14, 148, 135, 0.35);
  transform: translateY(-1px);
}

.lang-toggle .lang-globe {
  width: 15px; height: 15px;
  stroke: var(--c-primary);
  stroke-width: 2.2;
  fill: none;
}
.lang-toggle .lang-label { color: var(--c-primary); }
.lang-toggle .divider { color: var(--c-border); font-weight: 300; }
.lang-toggle .lang-inactive { color: var(--c-slate); font-weight: 500; }

/* CONTENT */
.content {
  position: relative;
  z-index: 5;
  flex: 1;
  padding: 16px 28px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 32px;
  overflow-y: auto;
  scrollbar-width: none;
  min-height: 0;
}
.content::-webkit-scrollbar { display: none; }

@media (max-width: 480px) {
  .content { padding: 12px 22px 20px; gap: 26px; }
}
@media (max-height: 720px) {
  .content { gap: 20px; padding-top: 8px; }
}

/* HERO — Large avatar circle */
.hero-wrap {
  position: relative;
  width: 300px;
  height: 300px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  opacity: 0;
  transform: scale(0.85);
  animation: heroIn 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s forwards;
}

@keyframes heroIn {
  to { opacity: 1; transform: scale(1); }
}

.hero-wrap::before {
  content: '';
  position: absolute;
  inset: -30px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(14, 148, 135, 0.25) 0%, rgba(139, 92, 246, 0.15) 45%, transparent 70%);
  filter: blur(36px);
  z-index: 0;
  animation: heroGlow 4s ease-in-out infinite;
}

@keyframes heroGlow {
  0%, 100% { opacity: 0.6; transform: scale(1); }
  50%      { opacity: 1; transform: scale(1.08); }
}

.hero-ring {
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 2px dashed rgba(14, 148, 135, 0.30);
  animation: ringRotate 20s linear infinite;
  z-index: 1;
}

.hero-ring-2 {
  position: absolute;
  inset: 14px;
  border-radius: 50%;
  border: 1.5px dashed rgba(139, 92, 246, 0.28);
  animation: ringRotate 14s linear infinite reverse;
  z-index: 1;
}

@keyframes ringRotate {
  to { transform: rotate(360deg); }
}

.hero-dot {
  position: absolute;
  border-radius: 50%;
  z-index: 2;
}
.hero-dot.d1 { width: 12px; height: 12px; background: var(--c-primary-light); top: 6%; left: 6%; animation: floatDot 3s ease-in-out infinite; }
.hero-dot.d2 { width: 10px; height: 10px; background: var(--c-purple); top: 16%; right: 4%; animation: floatDot 3.5s ease-in-out infinite 0.5s; }
.hero-dot.d3 { width: 14px; height: 14px; background: var(--c-blue); bottom: 8%; left: 10%; animation: floatDot 4s ease-in-out infinite 1s; }
.hero-dot.d4 { width: 9px; height: 9px; background: var(--c-primary); bottom: 16%; right: 8%; animation: floatDot 3.2s ease-in-out infinite 1.4s; }

@keyframes floatDot {
  0%, 100% { transform: translateY(0); opacity: 0.7; }
  50%      { transform: translateY(-9px); opacity: 1; }
}

.hero-circle {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: linear-gradient(135deg, #E7F9F7 0%, #EEF2FF 100%);
  border: 4px solid #fff;
  box-shadow:
    0 24px 60px rgba(14, 148, 135, 0.20),
    0 10px 24px rgba(139, 92, 246, 0.14),
    inset 0 0 0 1px rgba(14, 148, 135, 0.08);
  overflow: hidden;
  z-index: 3;
  display: flex;
  align-items: center;
  justify-content: center;
}

.hero-circle img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
}

.hero-circle::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid rgba(14, 148, 135, 0.35);
  animation: circlePulse 2.8s ease-out infinite;
  pointer-events: none;
}

@keyframes circlePulse {
  0%   { transform: scale(1); opacity: 0.7; }
  100% { transform: scale(1.15); opacity: 0; }
}

@media (max-width: 480px) {
  .hero-wrap { width: 260px; height: 260px; }
}
@media (max-width: 360px) {
  .hero-wrap { width: 230px; height: 230px; }
}
@media (max-height: 720px) {
  .hero-wrap { width: 240px; height: 240px; }
}

/* TEXT */
.text-wrap {
  display: flex;
  flex-direction: column;
  gap: 12px;
  text-align: center;
  max-width: 320px;
  opacity: 0;
  transform: translateY(14px);
  animation: fadeUp 0.7s ease 0.5s forwards;
}

@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}

.heading {
  font-size: 28px;
  font-weight: 700;
  color: var(--c-navy);
  line-height: 1.2;
  letter-spacing: -0.5px;
}

html[lang="ar"] .heading {
  font-family: var(--f-ar);
  font-size: 27px;
  letter-spacing: 0;
}

.heading .accent {
  background: var(--g-text);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}

.subheading {
  font-size: 14.5px;
  color: var(--c-slate);
  line-height: 1.65;
  font-weight: 400;
}

html[lang="ar"] .subheading {
  font-family: var(--f-ar);
  font-size: 15.5px;
}

/* BOTTOM CTA */
.bottom {
  position: relative;
  z-index: 10;
  padding: 20px 28px 44px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  flex-shrink: 0;
  background: linear-gradient(to top, var(--c-bg) 70%, rgba(248,250,252,0));
}

@media (max-width: 480px) {
  .bottom { padding: 16px 22px 32px; }
}

.btn-primary {
  position: relative;
  width: 100%;
  min-height: 54px;
  padding: 17px 24px;
  background: var(--g-brand);
  color: #fff;
  font-size: 15.5px;
  font-weight: 600;
  letter-spacing: 0.4px;
  border-radius: var(--r-md);
  overflow: hidden;
  box-shadow: 0 12px 28px rgba(14, 148, 135, 0.30);
  transition: transform 0.2s ease, box-shadow 0.25s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn-primary::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
  transition: left 0.7s ease;
}

.btn-primary:hover::before { left: 100%; }

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 18px 38px rgba(14, 148, 135, 0.38);
}

.btn-primary:active { transform: scale(0.97); }

.btn-primary .arrow {
  width: 17px; height: 17px;
  stroke: #fff;
  stroke-width: 2.4;
  fill: none;
  transition: transform 0.3s ease;
}
html[dir="rtl"] .btn-primary .arrow { transform: scaleX(-1); }
.btn-primary:hover .arrow { transform: translateX(4px); }
html[dir="rtl"] .btn-primary:hover .arrow { transform: scaleX(-1) translateX(4px); }

html[lang="ar"] .btn-primary { font-family: var(--f-ar); font-size: 16.5px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

<body>

<div class="stage">
  <div class="phone">
    <div class="screen">

      <!-- Top Bar -->
      <div class="topbar">
        <button class="lang-toggle" id="langToggle" type="button" aria-label="Switch to Arabic">
          <svg class="lang-globe" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span class="lang-label" id="langCurrent">EN</span>
          <span class="divider" aria-hidden="true">|</span>
          <span class="lang-inactive" id="langOther">ع</span>
        </button>
      </div>

      <!-- Content -->
      <div class="content">

        <!-- Hero Circle with real image -->
        <div class="hero-wrap">
          <div class="hero-ring" aria-hidden="true"></div>
          <div class="hero-ring-2" aria-hidden="true"></div>
          <span class="hero-dot d1" aria-hidden="true"></span>
          <span class="hero-dot d2" aria-hidden="true"></span>
          <span class="hero-dot d3" aria-hidden="true"></span>
          <span class="hero-dot d4" aria-hidden="true"></span>

          <div class="hero-circle">
            <img src="onboarding.jpg" alt="Omega avatars welcoming you" />
          </div>
        </div>

        <!-- Text -->
        <div class="text-wrap">
          <h1 class="heading">
            <span id="headingPart1">Welcome to</span>
            <span class="accent">Omega</span>
          </h1>
          <p class="subheading" id="subheadingText">
            A friendly place to train your mind and keep your memories close.
          </p>
        </div>

      </div>

      <!-- Bottom CTA -->
      <div class="bottom">
        <button class="btn-primary" id="startBtn" type="button">
          <span id="startLabel">Get Started</span>
          <svg class="arrow" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>

    </div>
  </div>
</div>

<script>
const I18N = {
  en: {
    headingPart1: 'Welcome to',
    subheading: 'A friendly place to train your mind and keep your memories close.',
    start: 'Get Started',
    switchLangAria: 'Switch to Arabic'
  },
  ar: {
    headingPart1: 'أهلاً بيك في',
    subheading: 'مكان ودود تدرّب فيه عقلك وتحتفظ بذكرياتك قريبة منك.',
    start: 'هيا نبدأ',
    switchLangAria: 'التبديل إلى الإنجليزية'
  }
};

const STORAGE_KEY = 'omega_lang';
let currentLang = localStorage.getItem(STORAGE_KEY) || 'en';

const htmlEl      = document.documentElement;
const langCurrEl  = document.getElementById('langCurrent');
const langOtherEl = document.getElementById('langOther');
const langToggle  = document.getElementById('langToggle');

function applyLanguage(lang) {
  currentLang = lang;
  localStorage.setItem(STORAGE_KEY, lang);
  htmlEl.lang = lang;
  htmlEl.dir  = lang === 'ar' ? 'rtl' : 'ltr';

  langCurrEl.textContent  = lang === 'en' ? 'EN' : 'ع';
  langOtherEl.textContent = lang === 'en' ? 'ع'  : 'EN';
  langToggle.setAttribute('aria-label', I18N[lang].switchLangAria);

  const t = I18N[lang];
  document.getElementById('headingPart1').textContent   = t.headingPart1;
  document.getElementById('subheadingText').textContent = t.subheading;
  document.getElementById('startLabel').textContent     = t.start;
}

langToggle.addEventListener('click', () => {
  applyLanguage(currentLang === 'en' ? 'ar' : 'en');
});

document.getElementById('startBtn').addEventListener('click', () => {
  window.location.href = 'signup.html';
});

applyLanguage(currentLang);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#F8FAFC" />
<title>Omega — Splash</title>

<!-- سكريبت اللغة لمنع الوميض -->
<script>
  (function () {
    try {
      var lang = localStorage.getItem('omega_lang') || 'en';
      document.documentElement.lang = lang;
      document.documentElement.dir  = lang === 'ar' ? 'rtl' : 'ltr';
    } catch (e) {}
  })();
</script>

<!-- الخطوط -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --c-primary: #0E9487;
  --c-slate: #64748B;
  --c-navy: #0F172A;
  --c-bg: #F8FAFC;
  --g-brand: linear-gradient(135deg, #0E9487 0%, #2EC4B6 45%, #3B82F6 100%);
  --g-text:  linear-gradient(135deg, #0E9487 0%, #3B82F6 55%, #8B5CF6 100%);
  --f-en: 'Poppins', sans-serif;
  --f-ar: 'Cairo', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  background: var(--c-bg);
  font-family: var(--f-en);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
html[lang="ar"] body { font-family: var(--f-ar); }

/* الحاوية الرئيسية - بتاخد الشاشة كلها بدون مشاكل */
#app {
  height: 100vh;
  height: 100dvh; /* للموبايلات الحديثة */
  width: 100vw;
  display: flex;
  flex-direction: column;
  position: relative;
  background:
    radial-gradient(circle at 20% 20%, rgba(139, 92, 246, 0.08), transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(14, 148, 135, 0.08), transparent 50%),
    var(--c-bg);
}

/* زرار اللغة */
.topbar {
  position: absolute;
  top: max(20px, env(safe-area-inset-top));
  right: 20px;
  z-index: 10;
}
html[dir="rtl"] .topbar { right: auto; left: 20px; }

.lang-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  background: rgba(255, 255, 255, 0.8);
  border: 1px solid rgba(14, 148, 135, 0.2);
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  color: var(--c-navy);
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
}
.lang-toggle svg { width: 14px; height: 14px; stroke: var(--c-primary); fill: none; stroke-width: 2.2; }
.lang-toggle .lang-label { color: var(--c-primary); }
.lang-toggle .divider { color: #CBD5E1; }
.lang-toggle .lang-inactive { color: var(--c-slate); }

/* المحتوى الرئيسي */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  text-align: center;
}

/* اللوجو */
.logo-wrap {
  width: 150px;
  height: 150px;
  margin-bottom: 24px;
  position: relative;
  animation: scaleIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  opacity: 0;
  transform: scale(0.6);
}

@keyframes scaleIn {
  to { opacity: 1; transform: scale(1); }
}

.logo-svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}

/* العلامة المائية */
.wordmark {
  font-size: 42px;
  font-weight: 800;
  letter-spacing: -1.5px;
  background: var(--g-text);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 10px;
  animation: fadeUp 0.6s ease 0.4s forwards;
  opacity: 0;
  transform: translateY(10px);
}
html[lang="ar"] .wordmark { font-family: var(--f-ar); font-size: 38px; letter-spacing: 0; }

.tagline {
  font-size: 14px;
  font-weight: 500;
  color: var(--c-slate);
  max-width: 280px;
  line-height: 1.5;
  animation: fadeUp 0.6s ease 0.6s forwards;
  opacity: 0;
  transform: translateY(10px);
}
html[lang="ar"] .tagline { font-family: var(--f-ar); font-size: 15px; }

@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}

/* الجزء السفلي وشريط التحميل */
.bottom {
  padding: 0 40px max(40px, env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  animation: fadeUp 0.6s ease 0.8s forwards;
  opacity: 0;
  transform: translateY(10px);
}

.loading-bar {
  width: 180px;
  height: 4px;
  background: rgba(14, 148, 135, 0.1);
  border-radius: 4px;
  overflow: hidden;
  position: relative;
}

.loading-bar::after {
  content: '';
  position: absolute;
  top: 0; left: 0; bottom: 0;
  width: 0%;
  background: var(--g-brand);
  border-radius: 4px;
  animation: load 3.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}

@keyframes load {
  0% { width: 0%; }
  50% { width: 70%; }
  100% { width: 100%; }
}

.loading-text {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  color: var(--c-slate);
  text-transform: uppercase;
}
html[lang="ar"] .loading-text { font-family: var(--f-ar); letter-spacing: 0; text-transform: none; font-size: 12px; }

/* تأثير التلاشي عند الخروج */
.fade-out { transition: opacity 0.4s ease; opacity: 0 !important; }

/* شاشات الكمبيوتر - نظهر إطار الموبايل */
@media (min-width: 481px) {
  body { background: #E2E8F0; display: flex; align-items: center; justify-content: center; }
  #app {
    width: 375px;
    height: 812px;
    max-height: calc(100vh - 40px);
    border-radius: 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    border: 8px solid #1a1a1a;
  }
}
</style>
</head>

<body>

<div id="app">
  
  <!-- زرار اللغة -->
  <div class="topbar">
    <button class="lang-toggle" id="langToggle">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
      <span class="lang-label" id="langCurrent">EN</span>
      <span class="divider">|</span>
      <span class="lang-inactive" id="langOther">ع</span>
    </button>
  </div>

  <!-- المحتوى -->
  <div class="main">
    <div class="logo-wrap">
      <svg class="logo-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="omegaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0E9487"/>
            <stop offset="55%" stop-color="#2EC4B6"/>
            <stop offset="100%" stop-color="#3B82F6"/>
          </linearGradient>
          <linearGradient id="sproutGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#2EC4B6"/>
            <stop offset="100%" stop-color="#076B5F"/>
          </linearGradient>
        </defs>
        
        <!-- حرف الأوميجا -->
        <g>
          <path d="M 60 142 C 44 122 36 98 44 74 C 54 44 76 28 100 28 C 124 28 146 44 156 74 C 164 98 156 122 140 142" fill="none" stroke="url(#omegaGrad)" stroke-width="21" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 60 142 Q 52 150 42 152" fill="none" stroke="url(#omegaGrad)" stroke-width="21" stroke-linecap="round"/>
          <path d="M 140 142 Q 148 150 158 152" fill="none" stroke="url(#omegaGrad)" stroke-width="21" stroke-linecap="round"/>
        </g>
        
        <!-- النبتة -->
        <g>
          <path d="M 100 78 L 100 118" stroke="url(#sproutGrad)" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M 100 108 Q 84 104 76 86 Q 92 84 100 100 Z" fill="url(#sproutGrad)"/>
          <path d="M 100 100 Q 116 96 124 78 Q 108 76 100 92 Z" fill="url(#sproutGrad)"/>
        </g>
      </svg>
    </div>
    
    <div class="wordmark">Omega</div>
    <div class="tagline" id="taglineText">Train Your Mind. Support Your Memories.</div>
  </div>

  <!-- الجزء السفلي -->
  <div class="bottom">
    <div class="loading-bar"></div>
    <div class="loading-text" id="loadingText">Loading your experience...</div>
  </div>

</div>

<script>
const I18N = {
  en: { tagline: 'Train Your Mind. Support Your Memories.', loading: 'Loading your experience...' },
  ar: { tagline: 'درّب عقلك. ادعم ذاكرتك.', loading: 'جاري تجهيز التجربة...' }
};

let currentLang = localStorage.getItem('omega_lang') || 'en';

const langCurrEl = document.getElementById('langCurrent');
const langOtherEl = document.getElementById('langOther');
const taglineEl = document.getElementById('taglineText');
const loadingEl = document.getElementById('loadingText');

function applyLanguage(lang) {
  currentLang = lang;
  localStorage.setItem('omega_lang', lang);
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

  langCurrEl.textContent = lang === 'en' ? 'EN' : 'ع';
  langOtherEl.textContent = lang === 'en' ? 'ع' : 'EN';
  
  taglineEl.textContent = I18N[lang].tagline;
  loadingEl.textContent = I18N[lang].loading;
}

document.getElementById('langToggle').addEventListener('click', () => {
  applyLanguage(currentLang === 'en' ? 'ar' : 'en');
});

// التوجيه التلقائي بعد 3.8 ثانية
const appEl = document.getElementById('app');
setTimeout(() => {
  appEl.classList.add('fade-out');
  setTimeout(() => {
    // لو صفحة الـ onboarding مش موجودة، هيظهر خطأ 404، بس الصفحة الحالية هتكون ظهرت الأول
    window.location.href = 'onboarding.html';
  }, 400);
}, 3500);

// تشغيل اللغة فوراً
applyLanguage(currentLang);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#F8FAFC" />
<title>Omega — Settings</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ============================================
   DESIGN TOKENS — Omega
============================================ */
:root {
  --c-primary:       #0E9487;
  --c-primary-light: #2EC4B6;
  --c-primary-dark:  #076B5F;
  --c-blue:          #3B82F6;
  --c-purple:        #8B5CF6;

  --c-success: #22C55E;
  --c-warning: #FBBF24;
  --c-error:   #EF4444;

  --c-navy:   #0F172A;
  --c-slate:  #64748B;
  --c-bg:     #F8FAFC;
  --c-card:   #FFFFFF;
  --c-border: #E2E8F0;

  --g-brand: linear-gradient(135deg, #0E9487 0%, #2EC4B6 45%, #3B82F6 100%);
  --g-text:  linear-gradient(135deg, #0E9487 0%, #3B82F6 55%, #8B5CF6 100%);
  --g-child: linear-gradient(135deg, #8B5CF6 0%, #3B82F6 50%, #0E9487 100%);
  --g-danger: linear-gradient(135deg, #EF4444, #F87171);

  --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --r-xl: 24px; --r-pill: 999px;

  --sh-soft: 0 8px 30px rgba(15, 23, 42, 0.06);

  --f-en: 'Poppins', system-ui, sans-serif;
  --f-ar: 'Cairo', system-ui, sans-serif;

  --phone-w: 375px;
  --phone-h: 812px;

  /* Font scaling */
  --fs-base: 14px;
}

html[data-font-size="small"]  { --fs-base: 12.5px; }
html[data-font-size="medium"] { --fs-base: 14px; }
html[data-font-size="large"]  { --fs-base: 16px; }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--f-en);
  font-size: var(--fs-base);
  -webkit-font-smoothing: antialiased;
  background: #E2E8F0;
  overflow: hidden;
  transition: font-size 0.25s ease;
}

html[lang="ar"] body { font-family: var(--f-ar); }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input { font-family: inherit; }

/* ============ PHONE FRAME ============ */
.stage {
  width: 100vw; height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background:
    radial-gradient(circle at 20% 20%, rgba(139, 92, 246, 0.12), transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(14, 148, 135, 0.10), transparent 50%),
    #E2E8F0;
}

.phone {
  position: relative;
  width: var(--phone-w); height: var(--phone-h);
  max-height: calc(100vh - 40px);
  background: var(--c-bg);
  border-radius: 44px;
  overflow: hidden;
  box-shadow: 0 0 0 10px #1a1a1a, 0 0 0 12px #2a2a2a,
    0 40px 80px rgba(0, 0, 0, 0.35), 0 20px 40px rgba(0, 0, 0, 0.15);
}

.phone::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 130px; height: 26px;
  background: #1a1a1a;
  border-radius: 0 0 18px 18px;
  z-index: 100;
}

@media (max-width: 480px) {
  body { background: var(--c-bg); }
  .stage { padding: 0; background: var(--c-bg); }
  .phone { width: 100vw; height: 100vh; max-height: 100vh; border-radius: 0; box-shadow: none; }
  .phone::before { display: none; }
}

/* ============ SCREEN ============ */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--c-bg);
  overflow: hidden;
}

.screen::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 20% 10%, rgba(139, 92, 246, 0.06), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(14, 148, 135, 0.05), transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* ============ TOP BAR ============ */
.topbar {
  position: relative;
  z-index: 10;
  display: flex; justify-content: space-between; align-items: center;
  padding: 52px 22px 0;
  flex-shrink: 0;
}

.back-btn {
  width: 38px; height: 38px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(14, 148, 135, 0.15);
  transition: all 0.25s ease;
  box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
}

.back-btn:hover { background: #fff; border-color: rgba(14, 148, 135, 0.35); transform: translateX(-2px); }
html[dir="rtl"] .back-btn:hover { transform: translateX(2px); }

.back-btn svg { width: 16px; height: 16px; stroke: var(--c-primary); stroke-width: 2.4; fill: none; }
html[dir="rtl"] .back-btn svg { transform: scaleX(-1); }

.page-title-mini {
  font-size: 0.95em;
  font-weight: 700;
  color: var(--c-navy);
  letter-spacing: 0.2px;
}

html[lang="ar"] .page-title-mini { font-family: var(--f-ar); }

/* ============ CONTENT ============ */
.content {
  position: relative;
  z-index: 5;
  flex: 1;
  padding: 16px 24px 24px;
  display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto;
  scrollbar-width: none;
  min-height: 0;
}

.content::-webkit-scrollbar { display: none; }

@keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

/* ============ ADMIN HEADER CARD ============ */
.admin-header {
  display: flex; align-items: center; gap: 14px;
  padding: 18px 16px;
  background: #fff;
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-xl);
  position: relative;
  overflow: hidden;
  opacity: 0; transform: translateY(14px);
  animation: fadeUp 0.5s ease 0.1s forwards;
  min-height: 96px;
}

.admin-header::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 4px;
  background: var(--g-brand);
}

.admin-avatar {
  width: 62px; height: 62px;
  min-width: 62px;
  border-radius: 50%;
  background: var(--g-brand);
  display: flex; align-items: center; justify-content: center;
  color: #fff;
  font-size: 1.7em;
  font-weight: 800;
  flex-shrink: 0;
  box-shadow: 0 8px 20px rgba(14, 148, 135, 0.3);
  position: relative;
  text-transform: uppercase;
  overflow: hidden;
}

.admin-avatar img { width: 100%; height: 100%; object-fit: cover; }

.admin-info {
  flex: 1;
  display: flex; flex-direction: column; gap: 3px;
  min-width: 0;
}

.admin-name {
  font-size: 1.2em;
  font-weight: 800;
  color: var(--c-navy);
  letter-spacing: -0.3px;
  line-height: 1.15;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

html[lang="ar"] .admin-name { font-family: var(--f-ar); letter-spacing: 0; }

.admin-email {
  font-size: 0.82em;
  color: var(--c-slate);
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

html[lang="ar"] .admin-email { font-family: var(--f-ar); }

/* ============ SECTIONS ============ */
.section {
  opacity: 0; transform: translateY(14px);
  animation: fadeUp 0.5s ease forwards;
}

.section.s1 { animation-delay: 0.15s; }
.section.s2 { animation-delay: 0.25s; }
.section.s3 { animation-delay: 0.35s; }
.section.s4 { animation-delay: 0.45s; }

.section-title {
  font-size: 0.82em;
  font-weight: 700;
  color: var(--c-slate);
  letter-spacing: 0.6px;
  text-transform: uppercase;
  padding-inline-start: 6px;
  margin-bottom: 8px;
  display: flex; align-items: center; gap: 8px;
}

html[lang="ar"] .section-title {
  font-family: var(--f-ar);
  text-transform: none;
  letter-spacing: 0;
  font-size: 0.92em;
}

.section-title::before {
  content: '';
  width: 3px; height: 12px;
  background: var(--g-brand);
  border-radius: var(--r-pill);
}

.section.s2 .section-title::before { background: var(--g-child); }

/* ============ CARD GROUP ============ */
.card-group {
  background: #fff;
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-lg);
  overflow: hidden;
}

.setting-row {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px;
  transition: background 0.2s ease;
  position: relative;
}

.setting-row + .setting-row { border-top: 1px solid var(--c-border); }

.setting-row.clickable { cursor: pointer; }
.setting-row.clickable:hover { background: rgba(14, 148, 135, 0.03); }
.setting-row.clickable:active { background: rgba(14, 148, 135, 0.06); }

.setting-icon {
  width: 34px; height: 34px;
  min-width: 34px;
  border-radius: 10px;
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}

.setting-icon::before { content: ''; position: absolute; inset: 0; z-index: 1; }
.setting-icon.user::before     { background: linear-gradient(135deg, #0E9487, #2EC4B6); }
.setting-icon.email::before    { background: linear-gradient(135deg, #3B82F6, #8B5CF6); }
.setting-icon.cake::before     { background: linear-gradient(135deg, #FBBF24, #F59E0B); }
.setting-icon.globe::before    { background: linear-gradient(135deg, #3B82F6, #2EC4B6); }
.setting-icon.voice::before    { background: linear-gradient(135deg, #8B5CF6, #EC4899); }
.setting-icon.font::before     { background: linear-gradient(135deg, #0E9487, #3B82F6); }
.setting-icon.bell::before     { background: linear-gradient(135deg, #F59E0B, #EF4444); }
.setting-icon.trash::before    { background: var(--g-danger); }
.setting-icon.logout::before   { background: linear-gradient(135deg, #EF4444, #F87171); }
.setting-icon.add::before      { background: var(--g-child); }
.setting-icon.edit::before     { background: linear-gradient(135deg, #3B82F6, #0E9487); }

.setting-icon svg {
  width: 16px; height: 16px;
  stroke: #fff; stroke-width: 2.2; fill: none;
  stroke-linecap: round; stroke-linejoin: round;
  position: relative; z-index: 2;
}

.setting-body {
  flex: 1;
  display: flex; flex-direction: column; gap: 2px;
  min-width: 0;
}

.setting-label {
  font-size: 0.92em;
  font-weight: 700;
  color: var(--c-navy);
  letter-spacing: 0.1px;
  line-height: 1.2;
}

html[lang="ar"] .setting-label { font-family: var(--f-ar); letter-spacing: 0; }

.setting-value {
  font-size: 0.82em;
  color: var(--c-slate);
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

html[lang="ar"] .setting-value { font-family: var(--f-ar); }

.setting-value.primary { color: var(--c-primary); font-weight: 700; }

.setting-arrow {
  width: 16px; height: 16px;
  stroke: var(--c-slate); stroke-width: 2.4; fill: none;
  flex-shrink: 0; opacity: 0.6;
}

html[dir="rtl"] .setting-arrow { transform: scaleX(-1); }

/* ============ PERSON ROW ============ */
.person-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  transition: background 0.2s ease;
}

.person-row + .person-row { border-top: 1px solid var(--c-border); }

.person-avatar {
  width: 44px; height: 44px;
  min-width: 44px;
  border-radius: 50%;
  background: var(--g-child);
  display: inline-flex; align-items: center; justify-content: center;
  color: #fff;
  font-size: 1.15em;
  font-weight: 800;
  flex-shrink: 0;
  text-transform: uppercase;
  overflow: hidden;
  box-shadow: 0 6px 16px rgba(139, 92, 246, 0.28);
}

.person-avatar img { width: 100%; height: 100%; object-fit: cover; }

.person-info {
  flex: 1;
  display: flex; flex-direction: column; gap: 2px;
  min-width: 0;
}

.person-name {
  font-size: 0.95em;
  font-weight: 700;
  color: var(--c-navy);
  letter-spacing: -0.1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

html[lang="ar"] .person-name { font-family: var(--f-ar); letter-spacing: 0; }

.person-meta {
  font-size: 0.78em;
  color: var(--c-slate);
  font-weight: 500;
  display: flex; align-items: center; gap: 6px;
}

html[lang="ar"] .person-meta { font-family: var(--f-ar); }

.person-meta-divider {
  width: 3px; height: 3px;
  border-radius: 50%;
  background: var(--c-border);
}

.person-actions {
  display: flex; gap: 6px;
  flex-shrink: 0;
}

.person-action-btn {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: rgba(14, 148, 135, 0.08);
  display: inline-flex; align-items: center; justify-content: center;
  transition: all 0.2s ease;
}

.person-action-btn:hover { transform: scale(1.05); }
.person-action-btn:active { transform: scale(0.94); }

.person-action-btn.edit { background: rgba(14, 148, 135, 0.08); }
.person-action-btn.edit:hover { background: rgba(14, 148, 135, 0.15); }
.person-action-btn.edit svg { stroke: var(--c-primary); }

.person-action-btn.delete { background: rgba(239, 68, 68, 0.08); }
.person-action-btn.delete:hover { background: rgba(239, 68, 68, 0.15); }
.person-action-btn.delete svg { stroke: var(--c-error); }

.person-action-btn svg {
  width: 15px; height: 15px;
  stroke-width: 2.2; fill: none;
  stroke-linecap: round; stroke-linejoin: round;
}

/* Add person button (inside group) */
.add-person-row {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px;
  border-top: 1px solid var(--c-border);
  background: rgba(139, 92, 246, 0.03);
  font-size: 0.88em;
  font-weight: 700;
  color: var(--c-purple);
  transition: all 0.2s ease;
  width: 100%;
  cursor: pointer;
}

.add-person-row:hover { background: rgba(139, 92, 246, 0.08); }
.add-person-row:active { transform: scale(0.99); }

.add-person-row svg {
  width: 16px; height: 16px;
  stroke: currentColor; stroke-width: 2.5; fill: none;
  stroke-linecap: round; stroke-linejoin: round;
}

html[lang="ar"] .add-person-row { font-family: var(--f-ar); }

/* ============ TOGGLE SWITCH ============ */
.toggle {
  position: relative;
  width: 44px; height: 26px;
  min-width: 44px;
  border-radius: var(--r-pill);
  background: rgba(14, 148, 135, 0.15);
  transition: background 0.3s ease;
  flex-shrink: 0;
  cursor: pointer;
}

.toggle::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 2px 6px rgba(15, 23, 42, 0.2);
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.toggle.on { background: var(--g-brand); }
.toggle.on::after { transform: translateX(18px); }
html[dir="rtl"] .toggle.on::after { transform: translateX(-18px); }

/* ============ LANG PILLS ============ */
.lang-pills {
  display: flex;
  gap: 4px;
  background: rgba(14, 148, 135, 0.08);
  border-radius: var(--r-pill);
  padding: 3px;
  flex-shrink: 0;
}

.lang-pill {
  padding: 5px 12px;
  font-size: 0.78em;
  font-weight: 700;
  color: var(--c-slate);
  border-radius: var(--r-pill);
  transition: all 0.25s ease;
  letter-spacing: 0.3px;
  min-width: 32px;
  text-align: center;
}

.lang-pill.active {
  background: #fff;
  color: var(--c-primary);
  box-shadow: 0 2px 8px rgba(15, 23, 42, 0.1);
}

.lang-pill:hover:not(.active) { color: var(--c-primary); }

/* Font size pills */
.font-pills {
  display: flex;
  gap: 4px;
  background: rgba(14, 148, 135, 0.08);
  border-radius: var(--r-pill);
  padding: 3px;
  flex-shrink: 0;
}

.font-pill {
  padding: 5px 10px;
  font-weight: 800;
  color: var(--c-slate);
  border-radius: var(--r-pill);
  transition: all 0.25s ease;
  min-width: 30px;
  text-align: center;
  line-height: 1;
}

.font-pill[data-size="small"]  { font-size: 0.72em; }
.font-pill[data-size="medium"] { font-size: 0.92em; }
.font-pill[data-size="large"]  { font-size: 1.12em; }

.font-pill.active {
  background: #fff;
  color: var(--c-primary);
  box-shadow: 0 2px 8px rgba(15, 23, 42, 0.1);
}

.font-pill:hover:not(.active) { color: var(--c-primary); }

/* ============ DANGER ZONE ============ */
.danger-zone .setting-row { background: rgba(239, 68, 68, 0.02); }
.danger-zone .setting-label { color: var(--c-error); }

/* ============ EMPTY STATE ============ */
.empty-state {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 20px 16px;
  text-align: center;
}

.empty-state-icon { font-size: 1.8em; opacity: 0.6; }
.empty-state-text {
  font-size: 0.82em;
  color: var(--c-slate);
  line-height: 1.4;
}
html[lang="ar"] .empty-state-text { font-family: var(--f-ar); }

/* ============ MODAL ============ */
.modal-overlay {
  position: absolute;
  inset: 0;
  background: rgba(15, 23, 42, 0.4);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: none;
  align-items: center; justify-content: center;
  z-index: 200;
  padding: 30px;
  animation: fadeIn 0.25s ease;
}

.modal-overlay.show { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal {
  background: #fff;
  border-radius: var(--r-xl);
  padding: 24px 22px 20px;
  max-width: 320px;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 14px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  animation: modalPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes modalPop {
  0%   { transform: scale(0.85); opacity: 0; }
  60%  { transform: scale(1.03); opacity: 1; }
  100% { transform: scale(1); }
}

.modal-icon {
  width: 56px; height: 56px;
  border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  margin: 0 auto;
  flex-shrink: 0;
}

.modal-icon.danger { background: var(--g-danger); box-shadow: 0 8px 20px rgba(239, 68, 68, 0.35); }
.modal-icon.brand  { background: var(--g-brand); box-shadow: 0 8px 20px rgba(14, 148, 135, 0.35); }

.modal-icon svg {
  width: 26px; height: 26px;
  stroke: #fff; stroke-width: 2.4; fill: none;
  stroke-linecap: round; stroke-linejoin: round;
}

.modal-title {
  font-size: 1.15em;
  font-weight: 800;
  color: var(--c-navy);
  letter-spacing: -0.2px;
  text-align: center;
  line-height: 1.25;
}

html[lang="ar"] .modal-title { font-family: var(--f-ar); letter-spacing: 0; }

.modal-text {
  font-size: 0.85em;
  color: var(--c-slate);
  line-height: 1.55;
  font-weight: 500;
  text-align: center;
}

html[lang="ar"] .modal-text { font-family: var(--f-ar); }

.modal-input-wrap {
  display: flex; align-items: center;
  background: #F8FAFC;
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-md);
  transition: all 0.25s ease;
  overflow: hidden;
}

.modal-input-wrap:focus-within {
  border-color: var(--c-primary);
  background: #fff;
  box-shadow: 0 0 0 4px rgba(14, 148, 135, 0.12);
}

.modal-input {
  flex: 1;
  padding: 13px 14px;
  font-size: 1em;
  font-weight: 600;
  color: var(--c-navy);
  border: none; outline: none;
  background: transparent;
  letter-spacing: 0.1px;
}

.modal-input::placeholder { color: #B0B8C1; font-weight: 400; }
html[lang="ar"] .modal-input { font-family: var(--f-ar); }

.modal-actions {
  display: flex; gap: 8px;
  margin-top: 4px;
}

.modal-btn {
  flex: 1;
  padding: 12px;
  font-size: 0.9em;
  font-weight: 700;
  border-radius: var(--r-md);
  transition: all 0.2s ease;
  letter-spacing: 0.2px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}

.modal-btn.cancel {
  background: rgba(14, 148, 135, 0.08);
  color: var(--c-navy);
}
.modal-btn.cancel:hover { background: rgba(14, 148, 135, 0.15); }

.modal-btn.confirm {
  background: var(--g-brand);
  color: #fff;
  box-shadow: 0 6px 16px rgba(14, 148, 135, 0.35);
}
.modal-btn.confirm:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(14, 148, 135, 0.45); }

.modal-btn.confirm.danger {
  background: var(--g-danger);
  box-shadow: 0 6px 16px rgba(239, 68, 68, 0.35);
}
.modal-btn.confirm.danger:hover { box-shadow: 0 10px 22px rgba(239, 68, 68, 0.45); }

.modal-btn:active { transform: scale(0.97); }
html[lang="ar"] .modal-btn { font-family: var(--f-ar); }

/* ============ TOAST ============ */
.toast {
  position: absolute;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--c-navy);
  color: #fff;
  padding: 12px 20px;
  border-radius: var(--r-pill);
  font-size: 0.88em;
  font-weight: 600;
  letter-spacing: 0.2px;
  box-shadow: 0 12px 30px rgba(15, 23, 42, 0.35);
  z-index: 300;
  opacity: 0;
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  pointer-events: none;
  white-space: nowrap;
  display: flex; align-items: center; gap: 8px;
}

.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.toast svg {
  width: 14px; height: 14px;
  stroke: var(--c-success); stroke-width: 3; fill: none;
  stroke-linecap: round; stroke-linejoin: round;
  flex-shrink: 0;
}

html[lang="ar"] .toast { font-family: var(--f-ar); }

/* ============ REDUCED MOTION ============ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

<div class="stage">

</div>

<script>
/* ============================================

============================================ */
const I18N = {

/* ============================================
   HELPERS
============================================ */
function getPersons() {
  try {
    const arr = JSON.parse(localStorage.getItem('omega_care_persons') || '[]');
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}

function savePersons(persons) {
  localStorage.setItem('omega_care_persons', JSON.stringify(persons));
}

function getNotifications() {
  try {
    return JSON.parse(localStorage.getItem('omega_notifications') || '{"daily":true,"weekly":true,"streak":false}');
  } catch (e) {
    return { daily: true, weekly: true, streak: false };
  }
}

/* ============================================
   LANGUAGE
============================================ */
const STORAGE_KEY = 'omega_lang';
let currentLang = localStorage.getItem(STORAGE_KEY) || 'en';
const htmlEl = document.documentElement;

/* ============================================
   STATE
============================================ */
const state = {
  accountType: 'myself',
  admin: {
    name: '',
    email: '',
    age: null
  },
  persons: [],
  settings: {
    voiceMode: false,
    fontSize: 'medium',
    notifications: { daily: true, weekly: true, streak: false }
  }
};

/* ============================================
   LOAD DATA
============================================ */
function loadData() {
  state.accountType = localStorage.getItem('omega_account_type') || 'myself';
  state.admin.name = localStorage.getItem('omega_user_name') || 'User';
  state.admin.email = localStorage.getItem('omega_user_email') || '';
  const ageStr = localStorage.getItem('omega_age') || localStorage.getItem('omega_user_age');
  state.admin.age = ageStr ? parseInt(ageStr) : null;

  state.persons = getPersons();

  state.settings.voiceMode = localStorage.getItem('omega_voice_mode') === 'true';
  state.settings.fontSize = localStorage.getItem('omega_font_size') || 'medium';
  state.settings.notifications = getNotifications();
}

/* ============================================
   APPLY FONT SIZE
============================================ */
function applyFontSize(size) {
  document.documentElement.setAttribute('data-font-size', size);
  localStorage.setItem('omega_font_size', size);
}

/* ============================================
   APPLY LANGUAGE
============================================ */
function applyLanguage(lang) {
  currentLang = lang;
  localStorage.setItem(STORAGE_KEY, lang);
  htmlEl.lang = lang;
  htmlEl.dir = lang === 'ar' ? 'rtl' : 'ltr';
  renderAll();
}

/* ============================================
   RENDER ALL
============================================ */
function renderAll() {
  const t = I18N[currentLang];
  const content = document.getElementById('mainContent');
  const isCaregiver = state.accountType === 'caregiver';

  document.getElementById('pageTitle').textContent = t.pageTitle;

  let html = '';

  // ============ ADMIN HEADER CARD ============
  const adminInitial = (state.admin.name || 'U').charAt(0).toUpperCase();
  const adminEmailText = state.admin.email || t.notSet;

  html += `
    <div class="admin-header">
      <div class="admin-avatar">${adminInitial}</div>
      <div class="admin-info">
        <div class="admin-name">${state.admin.name}</div>
        <div class="admin-email">${adminEmailText}</div>
      </div>
    </div>
  `;

  // ============ ADMIN PROFILE ============
  html += `
    <div class="section s1">
      <div class="section-title">${t.sectionAdmin}</div>
      <div class="card-group">
        <div class="setting-row clickable" data-action="editName">
          <div class="setting-icon user">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          </div>
          <div class="setting-body">
            <div class="setting-label">${t.labelName}</div>
            <div class="setting-value">${state.admin.name}</div>
          </div>
          <svg class="setting-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </div>

        <div class="setting-row clickable" data-action="editEmail">
          <div class="setting-icon email">
            <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          </div>
          <div class="setting-body">
            <div class="setting-label">${t.labelEmail}</div>
            <div class="setting-value">${adminEmailText}</div>
          </div>
          <svg class="setting-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </div>

        <div class="setting-row clickable" data-action="editAge">
          <div class="setting-icon cake">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          </div>
          <div class="setting-body">
            <div class="setting-label">${t.labelAge}</div>
            <div class="setting-value">${state.admin.age ? state.admin.age + ' ' + t.years : t.notSet}</div>
          </div>
          <svg class="setting-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </div>
      </div>
    </div>
  `;

  // ============ PEOPLE I CARE FOR (Caregiver only) ============
  if (isCaregiver) {
    html += `
      <div class="section s2">
        <div class="section-title">${t.sectionPeople}</div>
        <div class="card-group" id="peopleGroup">
    `;

    if (state.persons.length === 0) {
      html += `
        <div class="empty-state">
          <div class="empty-state-icon">👥</div>
          <div class="empty-state-text">${t.noPeople}<br>${t.noPeopleHint}</div>
        </div>

    } else {
      state.persons.forEach(p => {
        const initial = (p.name || '?').charAt(0).toUpperCase();
        const avatarContent = p.photo
          ? `<img src="${p.photo}" alt="">`
          : initial;

        const metaParts = [];
        if (p.age) metaParts.push(p.age + ' ' + t.years);
        if (p.relationship) metaParts.push(p.relationship);

        html += `
          <div class="person-row" data-person-id="${p.id}">
            <div class="person-avatar">${avatarContent}</div>
            <div class="person-info">
              <div class="person-name">${p.name || '—'}</div>
              <div class="person-meta">${metaParts.join(' · ')}</div>
            </div>
            <div class="person-actions">
              <button class="person-action-btn edit" data-action="editPerson" data-person-id="${p.id}" aria-label="Edit">
                <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
              </button>
              <button class="person-action-btn delete" data-action="deletePerson" data-person-id="${p.id}" aria-label="Delete">
                <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg>
              </button>
            </div>
          </div>
        `;
      });
    }

    html += `
        <button class="add-person-row" id="addPersonBtn">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          <span>${t.addPersonBtn}</span>
        </button>
        </div>
      </div>
    `;
  }

  // ============ APP SETTINGS ============
  html += `
    <div class="section s3">
      <div class="section-title">${t.sectionApp}</div>
      <div class="card-group">

        <div class="setting-row">
          <div class="setting-icon globe">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
          </div>
          <div class="setting-body">
            <div class="setting-label">${t.labelLanguage}</div>
            <div class="setting-value">${currentLang === 'en' ? 'English' : 'العربية'}</div>
          </div>
          <div class="lang-pills">
            <button class="lang-pill ${currentLang === 'en' ? 'active' : ''}" data-lang="en">EN</button>
            <button class="lang-pill ${currentLang === 'ar' ? 'active' : ''}" data-lang="ar">ع</button>
          </div>
        </div>

        <div class="setting-row">
          <div class="setting-icon voice">
            <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
          </div>
          <div class="setting-body">
            <div class="setting-label">${t.labelVoice}</div>
            <div class="setting-value">${t.labelVoiceValue}</div>
          </div>
          <div class="toggle ${state.settings.voiceMode ? 'on' : ''}" data-toggle="voice"></div>
        </div>

        <div class="setting-row">
          <div class="setting-icon font">
            <svg viewBox="0 0 24 24"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>
          </div>
          <div class="setting-body">
            <div class="setting-label">${t.labelFont}</div>
            <div class="setting-value">${t.labelFontValue}</div>
          </div>
          <div class="font-pills">
            <button class="font-pill ${state.settings.fontSize === 'small' ? 'active' : ''}" data-size="small">A</button>
            <button class="font-pill ${state.settings.fontSize === 'medium' ? 'active' : ''}" data-size="medium">A</button>
            <button class="font-pill ${state.settings.fontSize === 'large' ? 'active' : ''}" data-size="large">A</button>
          </div>
        </div>

        <div class="setting-row">
          <div class="setting-icon bell">
            <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
          </div>
          <div class="setting-body">
            <div class="setting-label">${t.labelNotif}</div>
            <div class="setting-value">${t.labelNotifValue}</div>
          </div>
          <div class="toggle ${state.settings.notifications.daily ? 'on' : ''}" data-toggle="daily"></div>
        </div>

      </div>
    </div>
  `;

  // ============ ACCOUNT ============
  html += `
    <div class="section s4 danger-zone">
      <div class="section-title">${t.sectionAccount}</div>
      <div class="card-group">
        <div class="setting-row clickable" data-action="logout">
          <div class="setting-icon logout">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          </div>
          <div class="setting-body">
            <div class="setting-label">${t.labelLogout}</div>
            <div class="setting-value">${t.labelLogoutValue}</div>
          </div>
          <svg class="setting-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </div>

        <div class="setting-row clickable" data-action="deleteAccount">
          <div class="setting-icon trash">
            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg>
          </div>
          <div class="setting-body">
            <div class="setting-label">${t.labelDelete}</div>
            <div class="setting-value">${t.labelDeleteValue}</div>
          </div>
          <svg class="setting-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </div>
      </div>
    </div>
  `;

  content.innerHTML = html;

  // Bind events
  bindEvents();
}

/* ============================================
   BIND EVENTS
============================================ */
function bindEvents() {
  // Language pills
  document.querySelectorAll('.lang-pill').forEach(pill => {
    pill.addEventListener('click', () => {
      const lang = pill.dataset.lang;
      if (lang === currentLang) return;
      applyLanguage(lang);
      showToast(I18N[lang].languageChanged);
    });
  });

  // Font pills
  document.querySelectorAll('.font-pill').forEach(pill => {
    pill.addEventListener('click', () => {
      const size = pill.dataset.size;
      state.settings.fontSize = size;
      applyFontSize(size);
      document.querySelectorAll('.font-pill').forEach(p => {
        p.classList.toggle('active', p.dataset.size === size);
      });
      showToast(I18N[currentLang].saved);
    });
  });

  // Toggles
  document.querySelectorAll('.toggle').forEach(toggle => {
    toggle.addEventListener('click', () => {
      toggle.classList.toggle('on');
      const isOn = toggle.classList.contains('on');
      const key = toggle.dataset.toggle;

      if (key === 'voice') {
        state.settings.voiceMode = isOn;
        localStorage.setItem('omega_voice_mode', String(isOn));
      } else {
        state.settings.notifications[key] = isOn;
        localStorage.setItem('omega_notifications', JSON.stringify(state.settings.notifications));
      }
      showToast(I18N[currentLang].saved);
    });
  });

  // Setting rows with actions
  document.querySelectorAll('.setting-row[data-action]').forEach(row => {
    row.addEventListener('click', () => {
      handleAction(row.dataset.action);
    });
  });

  // Person edit/delete buttons
  document.querySelectorAll('[data-action="editPerson"]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      editPerson(btn.dataset.personId);
    });
  });

  document.querySelectorAll('[data-action="deletePerson"]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      confirmDeletePerson(btn.dataset.personId);
    });
  });

  // Add person
  const addBtn = document.getElementById('addPersonBtn');
  if (addBtn) {
    addBtn.addEventListener('click', () => {
      localStorage.setItem('omega_add_care_person', 'true');
      localStorage.setItem('omega_add_return', 'profile-settings');
      window.location.href = 'care-profile-setup.html';
    });
  }
}

/* ============================================
   ACTIONS
============================================ */
function handleAction(action) {
  switch (action) {
    case 'editName': return editAdminField('name');
    case 'editEmail': return editAdminField('email');
    case 'editAge': return editAdminField('age');
    case 'logout': return confirmLogout();
    case 'deleteAccount': return confirmDeleteAccount();
  }
}

function editPerson(id) {
  localStorage.setItem('omega_edit_care_person', id);
  window.location.href = 'care-profile-setup.html';
}

function confirmDeletePerson(id) {
  const t = I18N[currentLang];
  openModal({
    icon: 'danger',
    iconSvg: '<polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"></path>',
    title: t.confirmDeletePersonTitle,
    text: t.confirmDeletePersonText,
    confirmText: t.confirmDeletePersonConfirm,
    confirmDanger: true,
    onConfirm: () => {
      const persons = getPersons().filter(p => p.id !== id);
      savePersons(persons);

      // If deleted person was the current one, switch to first
      const currentId = localStorage.getItem('omega_current_person_id');
      if (currentId === id) {
        if (persons.length > 0) {
          localStorage.setItem('omega_current_person_id', persons[0].id);
        } else {
          localStorage.removeItem('omega_current_person_id');
        }
      }

      state.persons = persons;
      renderAll();
      showToast(t.personDeleted);
    }
  });
}

function editAdminField(field) {
  const t = I18N[currentLang];
  let title, text, value, type, placeholder;

  if (field === 'name') {
    title = t.editNameTitle;
    text = t.editNameText;
    value = state.admin.name;
    type = 'text';
    placeholder = 'User';
  } else if (field === 'email') {
    title = t.editEmailTitle;
    text = t.editEmailText;
    value = state.admin.email || '';
    type = 'email';
    placeholder = 'you@example.com';
  } else if (field === 'age') {
    title = t.editAgeTitle;
    text = t.editAgeText;
    value = state.admin.age || '';
    type = 'number';
    placeholder = '24';
  }

  openModal({
    icon: 'brand',
    iconSvg: '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>',
    title,
    text,
    input: { type, value, placeholder },
    confirmText: t.save,
    onConfirm: (newValue) => {
      const trimmed = String(newValue).trim();

      if (field === 'name') {
        if (trimmed.length < 2) return false;
        state.admin.name = trimmed;
        localStorage.setItem('omega_user_name', trimmed);
      } else if (field === 'email') {
        if (trimmed && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(trimmed)) {
          showToast(t.invalidEmail);
          return false;
        }
        state.admin.email = trimmed;
        localStorage.setItem('omega_user_email', trimmed);
      } else if (field === 'age') {
        const ageNum = parseInt(trimmed);
        if (isNaN(ageNum) || ageNum < 6 || ageNum > 120) {
          showToast(t.invalidAge);
          return false;
        }
        state.admin.age = ageNum;
        localStorage.setItem('omega_age', String(ageNum));
      }

      renderAll();
      showToast(t.saved);
      return true;
    }
  });
}

function confirmLogout() {
  const t = I18N[currentLang];
  openModal({
    icon: 'danger',
    iconSvg: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line>',
    title: t.confirmLogoutTitle,
    text: t.confirmLogoutText,
    confirmText: t.confirmLogoutConfirm,
    confirmDanger: true,
    onConfirm: () => {
      const keepKeys = ['omega_lang', 'omega_font_size'];
      Object.keys(localStorage).forEach(key => {
        if (key.startsWith('omega_') && !keepKeys.includes(key)) {
          localStorage.removeItem(key);
        }
      });
      window.location.href = 'signup.html';
    }
  });
}

function confirmDeleteAccount() {
  const t = I18N[currentLang];
  openModal({
    icon: 'danger',
    iconSvg: '<polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path>',
    title: t.confirmDeleteAccountTitle,
    text: t.confirmDeleteAccountText,
    confirmText: t.confirmDeleteAccountConfirm,
    confirmDanger: true,
    onConfirm: () => {
      Object.keys(localStorage).forEach(key => {
        if (key.startsWith('omega_')) localStorage.removeItem(key);
      });
      window.location.href = 'index.html';
    }
  });
}

/* ============================================
   MODAL
============================================ */
function openModal({ icon, iconSvg, title, text, input, confirmText, confirmDanger, onConfirm }) {
  const t = I18N[currentLang];
  const overlay = document.getElementById('modalOverlay');
  const box = document.getElementById('modalBox');

  let inputHtml = '';
  if (input) {
    inputHtml = `
      <div class="modal-input-wrap">
        <input
          type="${input.type}"
          class="modal-input"
          id="modalInput"
          value="${input.value || ''}"
          placeholder="${input.placeholder || ''}"
          autocomplete="off"
        />
      </div>
    `;
  }

  box.innerHTML = `
    <div class="modal-icon ${icon}">
      <svg viewBox="0 0 24 24">${iconSvg}</svg>
    </div>
    <div class="modal-title">${title}</div>
    <div class="modal-text">${text}</div>
    ${inputHtml}
    <div class="modal-actions">
      <button class="modal-btn cancel" id="modalCancel">${t.cancel}</button>
      <button class="modal-btn confirm ${confirmDanger ? 'danger' : ''}" id="modalConfirm">${confirmText}</button>
    </div>
  `;

  overlay.classList.add('show');

  const inputEl = document.getElementById('modalInput');
  if (inputEl) {
    setTimeout(() => {
      inputEl.focus();
      if (input.type === 'text' || input.type === 'email') {
        inputEl.select();
      }
    }, 100);

    // Enter key submits
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('modalConfirm').click();
      }
    });
  }

  document.getElementById('modalCancel').addEventListener('click', closeModal);

  document.getElementById('modalConfirm').addEventListener('click', () => {
    let value = inputEl ? inputEl.value : null;
    const result = onConfirm(value);
    if (result === false) return; // validation failed
    closeModal();
  });
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'modalOverlay') closeModal();
});

/* ============================================
   TOAST
============================================ */
let toastTimeout = null;

function showToast(message) {
  const toast = document.getElementById('toast');
  document.getElementById('toastText').textContent = message;
  toast.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => {
    toast.classList.remove('show');
  }, 1800);
}

/* ============================================
   NAVIGATION
============================================ */
document.getElementById('backBtn').addEventListener('click', () => {
  window.location.href = 'home.html';
});

/* ============================================
   INIT
============================================ */
function init() {
  loadData();
  applyFontSize(state.settings.fontSize);
  applyLanguage(currentLang);
}

init();
</script>

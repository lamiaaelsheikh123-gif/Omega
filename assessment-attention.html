<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Omega — Attention Assessment</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --c-primary: #0E9487; --c-light: #2EC4B6; --c-blue: #3B82F6;
  --c-success: #22C55E; --c-error: #EF4444; --c-warning: #FBBF24;
  --c-navy: #0F172A; --c-slate: #64748B; --c-bg: #F8FAFC;
  --g-brand: linear-gradient(135deg, #0E9487 0%, #2EC4B6 45%, #3B82F6 100%);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'Poppins', sans-serif; background: #E2E8F0; overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent; }
html[lang="ar"] body { font-family: 'Cairo', sans-serif; }
button { font-family: inherit; cursor: pointer; border: 0; background: none; }

/* Phone Frame */
.stage { height: 100%; display: flex; align-items: center; justify-content: center; padding: 20px; }
.phone { position: relative; width: 375px; height: 812px; max-height: calc(100vh - 40px); border-radius: 44px; overflow: hidden; background: var(--c-bg); box-shadow: 0 0 0 10px #1a1a1a, 0 0 0 12px #2a2a2a, 0 40px 80px rgba(0,0,0,.35); }
@media (max-width: 480px) { .stage { padding: 0; } .phone { width: 100vw; height: 100vh; max-height: 100vh; border-radius: 0; box-shadow: none; } }

/* Screen Layout */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: linear-gradient(180deg, #F8FAFC 0%, #E2E8F0 100%); overflow: hidden; }

/* Header */
header { position: relative; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 52px 24px 10px; flex-shrink: 0; }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; background: #fff; border: 1px solid #E2E8F0; display: flex; align-items: center; justify-content: center; color: var(--c-slate); font-weight: 700; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
.progress-bar { display: flex; gap: 6px; }
.progress-bar span { width: 24px; height: 8px; border-radius: 10px; background: #CBD5E1; transition: all 0.3s; }
.progress-bar span.active { background: var(--c-primary); width: 32px; }
.progress-bar span.done { background: var(--c-blue); }

/* Main Content */
main { position: relative; z-index: 10; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 20px 30px; min-height: 0; }

/* Text Instructions */
.instruction-box { text-align: center; margin-bottom: 15px; min-height: 50px; display: flex; align-items: center; justify-content: center; padding: 0 10px; flex-shrink: 0; }
.instruction-box h2 { font-size: clamp(16px, 5vw, 20px); font-weight: 800; color: var(--c-navy); line-height: 1.4; }

/* Buttons */
.btn { width: 100%; max-width: 300px; padding: 16px; border-radius: 16px; background: var(--g-brand); color: #fff; font-weight: 700; font-size: clamp(14px, 4vw, 16px); box-shadow: 0 10px 24px rgba(14, 148, 135, 0.3); transition: transform 0.2s; margin-top: 20px; flex-shrink: 0; }
.btn:active { transform: scale(0.96); }
.btn:disabled { background: #CBD5E1; box-shadow: none; cursor: not-allowed; }

/* Timer bar */
.timer-bar { width: 100%; height: 6px; background: #E2E8F0; border-radius: 10px; overflow: hidden; margin-bottom: 10px; flex-shrink: 0; }
.timer-bar i { display: block; height: 100%; width: 100%; background: var(--c-primary); transition: width 0.1s linear; }
.timer-bar i.warning { background: var(--c-error); }

/* ============================================
   GAME 1: FIREFLIES (ليل اليراعات)
============================================ */
.firefly-area { position: relative; width: 100%; height: 280px; background: linear-gradient(180deg, #0F172A, #1E1B4B); border-radius: 24px; overflow: hidden; box-shadow: inset 0 0 40px rgba(0,0,0,0.8); flex-shrink: 0; }
.bug { position: absolute; display: flex; align-items: center; justify-content: center; border-radius: 50%; cursor: pointer; transition: transform 0.1s; }
.bug.target { width: 40px; height: 40px; background: radial-gradient(circle, #FEF08A, #EAB308); box-shadow: 0 0 20px #FDE047, 0 0 40px #EAB308; animation: float 2s infinite ease-in-out alternate; }
.bug.distractor { width: 36px; height: 36px; background: radial-gradient(circle, #F87171, #B91C1C); box-shadow: 0 0 15px #EF4444; animation: float 1.5s infinite ease-in-out alternate-reverse; }
.bug:active { transform: scale(0.8); }

/* ============================================
   GAME 2: CONVEYOR BELT (سير المصنع)
============================================ */
.conveyor-area { position: relative; width: 100%; height: 280px; background: #475569; border-radius: 24px; overflow: hidden; box-shadow: inset 0 4px 10px rgba(0,0,0,0.3); flex-shrink: 0; display: flex; flex-direction: column; }
.belt { position: absolute; top: 50%; left: 0; right: 0; height: 60px; background: repeating-linear-gradient(90deg, #334155, #334155 20px, #1E293B 20px, #1E293B 40px); border-top: 3px solid #94A3B8; border-bottom: 3px solid #94A3B8; transform: translateY(-50%); animation: beltMove 1s linear infinite; }
.conveyor-item { position: absolute; top: 50%; transform: translateY(-50%); width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 36px; cursor: pointer; animation: slideLeft 2.5s linear forwards; z-index: 2; }
.conveyor-item:active { transform: translateY(-50%) scale(0.8); }
@keyframes beltMove { to { background-position: 40px 0; } }
@keyframes slideLeft { from { left: 100%; } to { left: -20%; } }

/* ============================================
   GAME 3: COLOR MATCH (مطابقة الألوان)
============================================ */
.stroop-container { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; gap: 30px; }
.stroop-word { font-size: 48px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; padding: 20px; background: #fff; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); min-width: 200px; text-align: center; }
.color-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; width: 100%; max-width: 280px; }
.color-btn { aspect-ratio: 1; border-radius: 50%; box-shadow: 0 8px 0 rgba(0,0,0,0.2), 0 10px 20px rgba(0,0,0,0.1); transition: all 0.1s; }
.color-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 rgba(0,0,0,0.2); }

/* 🟢 INTERSTITIAL (Transition) */
.interstitial { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 20px; width: 100%; animation: fadeUp 0.5s; padding: 0 10px; }
.avatar-circle { width: clamp(160px, 50vw, 220px); height: clamp(160px, 50vw, 220px); border-radius: 50%; overflow: hidden; box-shadow: 0 15px 40px rgba(15,23,42,0.15); border: 5px solid #fff; background: #E2E8F0; flex-shrink: 0; }
.avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
.interstitial h2 { font-size: clamp(20px, 6vw, 26px); font-weight: 800; color: var(--c-navy); }
.interstitial p { font-size: clamp(14px, 4vw, 16px); color: var(--c-slate); line-height: 1.5; max-width: 280px; }

/* Animations */
@keyframes float { 50% { transform: translateY(-15px) scale(1.1); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } }
</style>
</head>
<body>
<div class="stage"><div class="phone"><div class="screen" id="screen">
  
  <header>
    <button class="icon-btn" id="exitBtn">✕</button>
    <div class="progress-bar" id="progress">
      <span class="active"></span><span></span><span></span>
    </div>
    <button class="icon-btn" id="langBtn" style="font-size:12px;">ع</button>
  </header>

  <main id="main"></main>

</div></div></div>

<script>
/* ============================================================
   ⚠️⚠️⚠️ مكان الصور بتاعتك (التسقيفة والتشجيع) ⚠️⚠️⚠️
============================================================ */
const AVATAR_IMAGES = {
  adult: {
    clap: ['الكبار تسقيفه 1.jpg', 'الكبار تسقيفه 2.jpg'], // 👈 صور التسقيفة للكبار
    encourage: ['الكبير جاب اقل من 50.jpg', 'الكبير جاب اقل من 50.jpg'] // 👈 صور التشجيع/الزعل للكبار
  },
  kid: {
    clap: ['اطفال تسقيفه 1.jpg', 'اطفال تسقيفه مقفوله.jpg'], // 👈 صور التسقيفة للأطفال
    encourage: ['الصغير جاب اقل من 50.jpg', 'الصغير جاب اقل من 50.jpg'] // 👈 صور التشجيع/الزعل للأطفال
  }
};
/* ============================================================ */

const I18N = {
  en: {
    startTitle: "Attention Challenge",
    startDesc: "Test your focus through 3 quick interactive games.",
    startBtn: "Start Challenge",
    
    g1Intro: "Catch the glowing fireflies, avoid the red ones!",
    g1End: "Time's up!",
    
    g2Intro: "Grab the gifts, avoid the bombs!",
    g2End: "Belt stopped!",
    
    g3Intro: "Tap the color of the text, NOT the word!",
    g3End: "Last one done!",
    
    finTitle: "Challenge Complete",
    next: "Next Challenge",
    exitMsg: "Exit? Progress will be lost.",
    
    transGreat: "Great Job!",
    transGreatDesc: "You did really well on this challenge. Keep it up!",
    transEncourage: "Good Effort!",
    transEncourageDesc: "Every practice makes you stronger. Let's continue!"
  },
  ar: {
    startTitle: "تحدي الانتباه",
    startDesc: "اختبر تركيزك من خلال 3 ألعاب تفاعلية سريعة.",
    startBtn: "ابدأ التحدي",
    
    g1Intro: "اصطاد اليراعات المضيئة، وابعد عن الحمرا!",
    g1End: "خلص الوقت!",
    
    g2Intro: "جمع الهدايا، وابعد عن القنابل!",
    g2End: "السير وقف!",
    
    g3Intro: "دوس على لون الكلام، مش الكلمة نفسها!",
    g3End: "خلصت آخر لعبة!",
    
    finTitle: "خلصت التحدي",
    next: "التحدي الجاي",
    exitMsg: "هل تريد الخروج؟ ستفقد تقدمك.",
    
    transGreat: "شغل عالي!",
    transGreatDesc: "أداءك كان ممتاز في التحدي ده. استمر!",
    transEncourage: "محاولة جيدة!",
    transEncourageDesc: "كل تدريب بيخليك أقوى. يلا نكمل!"
  }
};

let lang = localStorage.getItem('omega_lang') === 'ar' ? 'ar' : 'en';
const $ = id => document.getElementById(id);
const COLORS_MAP = {
  RED: '#EF4444', BLUE: '#3B82F6', GREEN: '#22C55E', YELLOW: '#FBBF24'
};
const COLOR_NAMES = { en: { RED: 'Red', BLUE: 'Blue', GREEN: 'Green', YELLOW: 'Yellow' }, ar: { RED: 'أحمر', BLUE: 'أزرق', GREEN: 'أخضر', YELLOW: 'أصفر' } };

let round = 1;
let totalScore = 0;
let gameInterval = null;

function updateProgress() {
  document.querySelectorAll('.progress-bar span').forEach((el, i) => {
    el.className = i + 1 < round ? 'done' : (i + 1 === round ? 'active' : '');
  });
}

function updateLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  $('langBtn').textContent = lang === 'ar' ? 'EN' : 'ع';
}

/* --- Start --- */
function startGame() {
  updateLang(); updateProgress();
  $('main').innerHTML = `
    <div class="interstitial">
      <div style="font-size:80px; animation: float 3s infinite;">🎯</div>
      <h2>${I18N[lang].startTitle}</h2>
      <p>${I18N[lang].startDesc}</p>
      <button class="btn" id="startBtn">${I18N[lang].startBtn}</button>
    </div>
  `;
  $('startBtn').onclick = game1_Fireflies;
}

/* ============================================
   GAME 1: FIREFLIES
============================================ */
function game1_Fireflies() {
  round = 1; updateProgress();
  let score = 0;
  let timeLeft = 15;
  
  $('main').innerHTML = `
    <div class="instruction-box"><h2>${I18N[lang].g1Intro}</h2></div>
    <div class="timer-bar"><i id="timer1"></i></div>
    <div class="firefly-area" id="ffArea"></div>
  `;

  const area = $('ffArea');
  const timer = $('timer1');
  
  // Spawner
  gameInterval = setInterval(() => {
    const isTarget = Math.random() > 0.4;
    const bug = document.createElement('div');
    bug.className = 'bug ' + (isTarget ? 'target' : 'distractor');
    
    // Random position (keep away from edges)
    const maxX = area.clientWidth - 50;
    const maxY = area.clientHeight - 50;
    bug.style.left = Math.max(10, Math.random() * maxX) + 'px';
    bug.style.top = Math.max(10, Math.random() * maxY) + 'px';
    
    // Click logic
    bug.onclick = (e) => {
      e.stopPropagation();
      if (isTarget) {
        score += 1;
        bug.style.transform = 'scale(2)';
        bug.style.opacity = '0';
        setTimeout(() => bug.remove(), 200);
      } else {
        score -= 1; // Penalty
        bug.style.transform = 'scale(0.5)';
        bug.style.opacity = '0';
        setTimeout(() => bug.remove(), 200);
      }
    };
    
    area.appendChild(bug);
    
    // Auto remove after 1.2s
    setTimeout(() => {
      if (bug.parentNode) {
        bug.style.opacity = '0';
        setTimeout(() => bug.remove(), 300);
      }
    }, 1200);
    
  }, 600);

  // Timer
  const tick = setInterval(() => {
    timeLeft -= 0.1;
    timer.style.width = (timeLeft / 15 * 100) + '%';
    if (timeLeft <= 3) timer.classList.add('warning');
    
    if (timeLeft <= 0) {
      clearInterval(tick);
      clearInterval(gameInterval);
      area.innerHTML = `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:800;">${I18N[lang].g1End}</div>`;
      totalScore += Math.max(0, score);
      setTimeout(game2_Conveyor, 1500);
    }
  }, 100);
}

/* ============================================
   GAME 2: CONVEYOR BELT
============================================ */
function game2_Conveyor() {
  round = 2; updateProgress();
  let score = 0;
  let timeLeft = 15;
  
  $('main').innerHTML = `
    <div class="instruction-box"><h2>${I18N[lang].g2Intro}</h2></div>
    <div class="timer-bar"><i id="timer2"></i></div>
    <div class="conveyor-area" id="convArea">
      <div class="belt"></div>
    </div>
  `;

  const area = $('convArea');
  const timer = $('timer2');
  
  // Spawner
  gameInterval = setInterval(() => {
    const isGift = Math.random() > 0.4;
    const item = document.createElement('div');
    item.className = 'conveyor-item';
    item.textContent = isGift ? '🎁' : '💣';
    
    item.onclick = () => {
      if (isGift) score += 1;
      else score -= 1;
      item.style.opacity = '0';
      item.style.transform = 'translateY(-50%) scale(1.5)';
      setTimeout(() => item.remove(), 200);
    };
    
    area.appendChild(item);
    
    // Auto remove if not clicked (Missed)
    setTimeout(() => {
      if (item.parentNode) item.remove();
    }, 2500);
    
  }, 800);

  // Timer
  const tick = setInterval(() => {
    timeLeft -= 0.1;
    timer.style.width = (timeLeft / 15 * 100) + '%';
    if (timeLeft <= 3) timer.classList.add('warning');
    
    if (timeLeft <= 0) {
      clearInterval(tick);
      clearInterval(gameInterval);
      area.innerHTML = `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:800;z-index:10;">${I18N[lang].g2End}</div>`;
      totalScore += Math.max(0, score);
      setTimeout(game3_Stroop, 1500);
    }
  }, 100);
}

/* ============================================
   GAME 3: STROOP (COLOR MATCH)
============================================ */
function game3_Stroop() {
  round = 3; updateProgress();
  let qIndex = 0;
  const totalQ = 5;
  let score = 0;
  const colorKeys = Object.keys(COLORS_MAP);
  
  function renderQ() {
    if (qIndex >= totalQ) {
      totalScore += score;
      setTimeout(showResults, 1000);
      return;
    }
    
    // Pick word and color (ensure they are different to avoid easy answers)
    const word = colorKeys[Math.floor(Math.random() * 4)];
    let color = colorKeys[Math.floor(Math.random() * 4)];
    while (color === word) color = colorKeys[Math.floor(Math.random() * 4)];
    
    $('main').innerHTML = `
      <div class="instruction-box">
        <h2>${I18N[lang].g3Intro}</h2>
        <span style="font-size:12px;color:var(--c-slate);margin-top:5px;">(${qIndex+1} / ${totalQ})</span>
      </div>
      <div class="stroop-container">
        <div class="stroop-word" style="color: ${COLORS_MAP[color]};">${COLOR_NAMES[lang][word]}</div>
        <div class="color-grid" id="colorGrid">
          ${colorKeys.map(c => `<button class="color-btn" data-c="${c}" style="background: ${COLORS_MAP[c]};"></button>`).join('')}
        </div>
      </div>
    `;
    
    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.onclick = () => {
        const picked = btn.dataset.c;
        // Flash feedback
        if (picked === color) {
          score++;
          btn.style.boxShadow = '0 0 0 6px #22C55E';
        } else {
          btn.style.boxShadow = '0 0 0 6px #EF4444';
        }
        
        setTimeout(() => {
          qIndex++;
          renderQ();
        }, 400);
      };
    });
  }
  
  renderQ();
}

/* ============================================
   RESULTS & TRANSITION (Final Interstitial)
============================================ */
function showResults() {
  // Total score: Game 1 + Game 2 + Game 3. Max estimated points ~ 50.
  const maxScore = 50; 
  const accuracy = Math.min(100, Math.round((totalScore / 25) * 100)); // Adjusted scale
  
  localStorage.setItem('omega_attention_result', JSON.stringify({ accuracy, timestamp: Date.now() }));

  round = 4; updateProgress(); // Fill progress bar

  // Determine if passed (>= 50%)
  const passed = accuracy >= 50;
  
  // Get user age to pick avatar
  let age = parseInt(localStorage.getItem('omega_user_age') || localStorage.getItem('omega_age')) || 0;
  const avatarType = (age > 0 && age <= 12) ? 'kid' : 'adult';
  
  // Setup Interstitial UI
  $('main').innerHTML = `
    <div class="interstitial">
      <div class="avatar-circle" id="avatarBox">
        <img id="avatarImg" src="" alt="Avatar">
      </div>
      <h2 id="transTitle"></h2>
      <p id="transDesc"></p>
      <button class="btn" id="nextBtn" style="opacity:0; pointer-events:none;">${I18N[lang].next}</button>
    </div>
  `;

  let imgIndex = 0;
  let interval = null;
  const imgEl = $('avatarImg');

  if (passed) {
    $('transTitle').textContent = I18N[lang].transGreat;
    $('transDesc').textContent = `${I18N[lang].transGreatDesc} (${accuracy}%)`;
    
    const clapImgs = AVATAR_IMAGES[avatarType].clap;
    imgEl.src = clapImgs[0];
    interval = setInterval(() => {
      imgIndex = (imgIndex + 1) % 2;
      imgEl.src = clapImgs[imgIndex];
    }, 250);
    
  } else {
    $('transTitle').textContent = I18N[lang].transEncourage;
    $('transDesc').textContent = `${I18N[lang].transEncourageDesc} (${accuracy}%)`;
    
    const encourageImgs = AVATAR_IMAGES[avatarType].encourage;
    imgEl.src = encourageImgs[0];
    interval = setInterval(() => {
      imgIndex = (imgIndex + 1) % 2;
      imgEl.src = encourageImgs[imgIndex];
    }, 800);
  }

  // Show button after 3 seconds with smooth transition
  setTimeout(() => {
    if(interval) clearInterval(interval);
    imgEl.src = passed ? AVATAR_IMAGES[avatarType].clap[0] : AVATAR_IMAGES[avatarType].encourage[0];
    
    const nextBtn = $('nextBtn');
    nextBtn.style.transition = 'opacity 0.4s';
    nextBtn.style.opacity = '1';
    nextBtn.style.pointerEvents = 'auto';
    
    nextBtn.onclick = () => {
      window.location.href = 'assessment-problem.html';
    };
  }, 3000);
}

/* --- EVENTS --- */
$('langBtn').onclick = () => { lang = lang === 'ar' ? 'en' : 'ar'; startGame(); };
$('exitBtn').onclick = () => { if (confirm(I18N[lang].exitMsg)) window.location.href = 'assessment-intro.html'; };

startGame();
</script>
</body>
</html>

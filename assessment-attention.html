<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F8FAFC" />
<title>Omega — Attention Assessment</title>

<!-- ✅ سكريبت اللغة قبل أي رسم -->
<script>
  (function () {
    try {
      var lang = localStorage.getItem('omega_lang') || 'en';
      var html = document.documentElement;
      html.lang = lang;
      html.dir  = lang === 'ar' ? 'rtl' : 'ltr';
    } catch (e) {}
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --c-primary: #0E9487; --c-light: #2EC4B6; --c-blue: #3B82F6;
  --c-success: #22C55E; --c-error: #EF4444; --c-warning: #FBBF24;
  --c-navy: #0F172A; --c-slate: #64748B; --c-bg: #F8FAFC;
  --g-brand: linear-gradient(135deg, #0E9487 0%, #2EC4B6 45%, #3B82F6 100%);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%; font-family: 'Poppins', sans-serif; background: #E2E8F0; overflow: hidden;
  user-select: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
html[lang="ar"] body { font-family: 'Cairo', sans-serif; }

button {
  font-family: inherit; cursor: pointer; border: 0; background: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}

/* Phone Frame */
.stage { height: 100vh; height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 20px; background: #E2E8F0; }
.phone { position: relative; width: 375px; height: 812px; max-height: calc(100dvh - 40px); border-radius: 44px; overflow: hidden; background: var(--c-bg); box-shadow: 0 0 0 10px #1a1a1a, 0 0 0 12px #2a2a2a, 0 40px 80px rgba(0,0,0,.35); }
@media (max-width: 480px) {
  body { background: var(--c-bg); }
  .stage { padding: 0; background: var(--c-bg); }
  .phone { width: 100vw; height: 100dvh; max-height: 100dvh; border-radius: 0; box-shadow: none; }
}

/* Screen Layout */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: linear-gradient(180deg, #F8FAFC 0%, #E2E8F0 100%); overflow: hidden; }

/* Header */
header { position: relative; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 52px 24px 10px; flex-shrink: 0; }
@media (max-width: 480px) { header { padding-top: max(20px, env(safe-area-inset-top)); } }

.icon-btn { width: 44px; height: 44px; border-radius: 50%; background: #fff; border: 1px solid #E2E8F0; display: flex; align-items: center; justify-content: center; color: var(--c-slate); font-weight: 700; font-size: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
.icon-btn:active { transform: scale(0.95); }

.progress-bar { display: flex; gap: 6px; }
.progress-bar span { width: 24px; height: 8px; border-radius: 10px; background: #CBD5E1; transition: all 0.3s; }
.progress-bar span.active { background: var(--c-primary); width: 32px; }
.progress-bar span.done { background: var(--c-blue); }

/* Main Content (Flex + Scroll + Safe Area padding at bottom) */
main { 
  position: relative; z-index: 5; flex: 1; 
  display: flex; flex-direction: column; align-items: center; justify-content: center; 
  padding: 10px 20px 100px; /* 100px لتجنب الزرار */
  min-height: 0; overflow-y: auto; scrollbar-width: none; 
}
main::-webkit-scrollbar { display: none; }

/* Fixed Footer */
.footer { 
  position: absolute; bottom: 0; left: 0; width: 100%; z-index: 20; 
  padding: 16px 24px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 20px)); 
  background: linear-gradient(to top, var(--c-bg) 80%, rgba(248,250,252,0)); 
  display: flex; flex-direction: column; gap: 10px; 
}

/* Text Instructions */
.instruction-box { text-align: center; margin-bottom: 15px; min-height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 10px; flex-shrink: 0; }
.instruction-box h2 { font-size: clamp(16px, 5vw, 20px); font-weight: 800; color: var(--c-navy); line-height: 1.4; }

/* Buttons */
.btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 54px; padding: 16px; border-radius: 16px; background: var(--g-brand); color: #fff; font-weight: 700; font-size: 16px; box-shadow: 0 10px 24px rgba(14, 148, 135, 0.3); transition: transform 0.2s; }
.btn:active { transform: scale(0.97); }
.btn:disabled { background: #CBD5E1; box-shadow: none; cursor: not-allowed; }

/* Timer bar */
.timer-bar { width: 100%; height: 6px; background: #E2E8F0; border-radius: 10px; overflow: hidden; margin-bottom: 10px; flex-shrink: 0; }
.timer-bar i { display: block; height: 100%; width: 100%; background: var(--c-primary); transition: width 0.1s linear; }
.timer-bar i.warning { background: var(--c-error); }

/* ============================================ */
/* GAME 1: FIREFLIES */
/* ============================================ */
.firefly-area { position: relative; width: 100%; max-width: 320px; height: 280px; background: linear-gradient(180deg, #0F172A, #1E1B4B); border-radius: 24px; overflow: hidden; box-shadow: inset 0 0 40px rgba(0,0,0,0.8); flex-shrink: 0; margin: 0 auto; touch-action: none; }
.bug { position: absolute; display: flex; align-items: center; justify-content: center; border-radius: 50%; cursor: pointer; transition: transform 0.1s; touch-action: manipulation; }
.bug.target { width: 44px; height: 44px; background: radial-gradient(circle, #FEF08A, #EAB308); box-shadow: 0 0 20px #FDE047, 0 0 40px #EAB308; animation: float 2s infinite ease-in-out alternate; }
.bug.distractor { width: 40px; height: 40px; background: radial-gradient(circle, #F87171, #B91C1C); box-shadow: 0 0 15px #EF4444; animation: float 1.5s infinite ease-in-out alternate-reverse; }
.bug:active { transform: scale(0.8); }

/* ============================================ */
/* GAME 2: CONVEYOR BELT */
/* ============================================ */
.conveyor-area { position: relative; width: 100%; max-width: 320px; height: 280px; background: #475569; border-radius: 24px; overflow: hidden; box-shadow: inset 0 4px 10px rgba(0,0,0,0.3); flex-shrink: 0; display: flex; flex-direction: column; margin: 0 auto; touch-action: none; }
.belt { position: absolute; top: 50%; left: 0; right: 0; height: 60px; background: repeating-linear-gradient(90deg, #334155, #334155 20px, #1E293B 20px, #1E293B 40px); border-top: 3px solid #94A3B8; border-bottom: 3px solid #94A3B8; transform: translateY(-50%); animation: beltMove 1s linear infinite; }
.conveyor-item { position: absolute; top: 50%; transform: translateY(-50%); width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 36px; cursor: pointer; animation: slideLeft 2.5s linear forwards; z-index: 2; touch-action: manipulation; }
.conveyor-item:active { transform: translateY(-50%) scale(0.8); }
@keyframes beltMove { to { background-position: 40px 0; } }
@keyframes slideLeft { from { left: 100%; } to { left: -20%; } }

/* ============================================ */
/* GAME 3: COLOR MATCH (STROOP) */
/* ============================================ */
.stroop-container { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; gap: 30px; }
.stroop-word { font-size: 48px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; padding: 20px 40px; background: #fff; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
.color-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; width: 100%; max-width: 280px; }
.color-btn { aspect-ratio: 1; border-radius: 50%; box-shadow: 0 8px 0 rgba(0,0,0,0.2), 0 10px 20px rgba(0,0,0,0.1); transition: all 0.1s; touch-action: manipulation; }
.color-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 rgba(0,0,0,0.2); }

/* ============================================ */
/* TRAINING GAMES */
/* ============================================ */
.reaction-box { width: 100%; max-width: 320px; height: 280px; border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; color: #fff; text-align: center; transition: background 0.2s; margin: 0 auto; }
.search-grid { display: grid; gap: 10px; width: 100%; max-width: 320px; margin: 0 auto; }
.search-tile { aspect-ratio: 1; background: #fff; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 32px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); touch-action: manipulation; }
.math-box { text-align: center; }
.math-seq { font-size: 36px; font-weight: 800; color: var(--c-primary); letter-spacing: 4px; margin-bottom: 30px; }

/* Interstitial */
.interstitial { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 20px; width: 100%; animation: fadeUp 0.5s; padding: 0 10px; }
.avatar-circle { width: clamp(160px, 50vw, 220px); height: clamp(160px, 50vw, 220px); border-radius: 50%; overflow: hidden; box-shadow: 0 15px 40px rgba(15,23,42,0.15); border: 5px solid #fff; background: #E2E8F0; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 60px; }
.avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
.interstitial h2 { font-size: clamp(20px, 6vw, 26px); font-weight: 800; color: var(--c-navy); }
.interstitial p { font-size: clamp(14px, 4vw, 16px); color: var(--c-slate); line-height: 1.5; max-width: 280px; }

@keyframes float { 50% { transform: translateY(-15px) scale(1.1); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } }
</style>
</head>
<body>

<div class="stage">
  <div class="phone">
    <div class="screen">
      
      <header>
        <button class="icon-btn" id="exitBtn" type="button" aria-label="Exit">✕</button>
        <div class="progress-bar" id="progress">
          <span class="active"></span><span></span><span></span>
        </div>
        <button class="icon-btn" id="langBtn" type="button" style="font-size:13px; color:var(--c-primary);">ع</button>
      </header>

      <main id="main"></main>

      <div class="footer" id="footer"></div>

    </div>
  </div>
</div>

<script>
/* ============================================================
   ⚠️ مكان الصور بتاعتك
============================================================ */
const AVATAR_IMAGES = {
  adult: {
    clap: ['الكبار تسقيفه 1.jpg', 'الكبار تسقيفه 2.jpg'], 
    encourage: ['الكبير جاب اقل من 50.jpg', 'الكبير جاب اقل من 50.jpg'] 
  },
  kid: {
    clap: ['اطفال تسقيفه 1.jpg', 'اطفال تسقيفه مقفوله.jpg'], 
    encourage: ['الصغير جاب اقل من 50.jpg', 'الصغير جاب اقل من 50.jpg'] 
  }
};

const I18N = {
  en: {
    startTitle: "Attention Challenge",
    startDesc: "Test your focus through quick interactive games.",
    startBtn: "Start",
    
    // Assessment
    g1Intro: "Catch the glowing fireflies, avoid the red ones!",
    g1End: "Time's up!",
    g2Intro: "Grab the gifts, avoid the bombs!",
    g2End: "Belt stopped!",
    g3Intro: "Tap the color of the text, NOT the word!",
    g3End: "Last one done!",
    
    // Training
    trainReact: "Wait for GREEN, then tap as fast as you can!",
    trainSearch: "Find the different emoji!",
    trainMath: "Solve the math sequence:",
    
    finTitle: "Challenge Complete",
    next: "Next Challenge",
    exitMsg: "Exit? Progress will be lost.",
    
    transGreat: "Great Job!",
    transGreatDesc: "You did really well on this challenge.",
    transEncourage: "Good Effort!",
    transEncourageDesc: "Every practice makes you stronger.",
    
    trainWin: "Level Up!",
    trainWinDesc: "Your attention is getting sharper.",
    trainLose: "Try Again!",
    trainLoseDesc: "Almost there."
  },
  ar: {
    startTitle: "تحدي الانتباه",
    startDesc: "اختبر تركيزك من خلال ألعاب تفاعلية سريعة.",
    startBtn: "ابدأ",
    
    // Assessment
    g1Intro: "اصطاد اليراعات المضيئة، وابعد عن الحمرا!",
    g1End: "خلص الوقت!",
    g2Intro: "جمع الهدايا، وابعد عن القنابل!",
    g2End: "السير وقف!",
    g3Intro: "دوس على لون الكلام، مش الكلمة نفسها!",
    g3End: "خلصت آخر لعبة!",
    
    // Training
    trainReact: "استنى لحد ما تبقى خضرا، وبعدين دوس بأسرع ما يمكن!",
    trainSearch: "لاقي الإيموجي المختلف!",
    trainMath: "حل تسلسل الأرقام:",
    
    finTitle: "خلصت التحدي",
    next: "التالي",
    exitMsg: "هل تريد الخروج؟ ستفقد تقدمك.",
    
    transGreat: "شغل عالي!",
    transGreatDesc: "أداءك كان ممتاز في التحدي ده.",
    transEncourage: "محاولة جيدة!",
    transEncourageDesc: "كل تدريب بيخليك أقوى.",
    
    trainWin: "عدّيت المستوى!",
    trainWinDesc: "تركيزك بيتحسن.",
    trainLose: "حاول تاني!",
    trainLoseDesc: "قربت جداً."
  }
};

let lang = localStorage.getItem('omega_lang') === 'ar' ? 'ar' : 'en';
const $ = id => document.getElementById(id);
const main = $('main');

// Mode logic: 'assessment' or 'train'
let MODE = localStorage.getItem('omega_attention_mode') || 'assessment';

let round = 1;
let totalScore = 0;
let gameInterval = null;
let currentLvl = 1;

const COLORS_MAP = {
  RED: '#EF4444', BLUE: '#3B82F6', GREEN: '#22C55E', YELLOW: '#FBBF24'
};
const COLOR_NAMES = { 
  en: { RED: 'Red', BLUE: 'Blue', GREEN: 'Green', YELLOW: 'Yellow' }, 
  ar: { RED: 'أحمر', BLUE: 'أزرق', GREEN: 'أخضر', YELLOW: 'أصفر' } 
};

function updateProgress() {
  const pBar = $('progress');
  if (MODE === 'train') { pBar.style.display = 'none'; return; }
  pBar.style.display = 'flex';
  
  pBar.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    let span = document.createElement('span');
    if (i + 1 < round) span.className = 'done';
    else if (i + 1 === round) span.className = 'active';
    pBar.appendChild(span);
  }
}

function updateLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  $('langBtn').textContent = lang === 'ar' ? 'EN' : 'ع';
}

/* ============================================
   INIT & ROUTING
============================================ */
function startGame() {
  updateLang(); 
  updateProgress();
  $('footer').innerHTML = '';
  
  if (MODE === 'train') {
    currentLvl = parseInt(localStorage.getItem('omega_attention_train_level') || '1');
    $('main').innerHTML = `
      <div class="interstitial">
        <div style="font-size:80px; animation: float 3s infinite;">🎯</div>
        <h2>${I18N[lang].startTitle} (Lvl ${currentLvl})</h2>
        <p>${I18N[lang].startDesc}</p>
      </div>
    `;
    $('footer').innerHTML = `<button class="btn" id="startBtn">${I18N[lang].startBtn}</button>`;
    $('startBtn').onclick = () => {
      totalScore = 0;
      startTrainingRound();
    };
  } else {
    round = 1;
    $('main').innerHTML = `
      <div class="interstitial">
        <div style="font-size:80px; animation: float 3s infinite;">🎯</div>
        <h2>${I18N[lang].startTitle}</h2>
        <p>${I18N[lang].startDesc}</p>
      </div>
    `;
    $('footer').innerHTML = `<button class="btn" id="startBtn">${I18N[lang].startBtn}</button>`;
    $('startBtn').onclick = () => {
      totalScore = 0;
      game1_Fireflies();
    };
  }
}

/* ============================================
   ASSESSMENT GAMES (Your Exact 3 Games)
============================================ */

// 1. FIREFLIES
function game1_Fireflies() {
  round = 1; updateProgress();
  $('footer').innerHTML = '';
  let score = 0;
  let timeLeft = 15;
  
  $('main').innerHTML = `
    <div class="instruction-box"><h2>${I18N[lang].g1Intro}</h2></div>
    <div class="timer-bar"><i id="timer1"></i></div>
    <div class="firefly-area" id="ffArea"></div>
  `;

  const area = $('ffArea');
  const timer = $('timer1');
  
  gameInterval = setInterval(() => {
    const isTarget = Math.random() > 0.4;
    const bug = document.createElement('div');
    bug.className = 'bug ' + (isTarget ? 'target' : 'distractor');
    
    const maxX = area.clientWidth - 50;
    const maxY = area.clientHeight - 50;
    bug.style.left = Math.max(10, Math.random() * maxX) + 'px';
    bug.style.top = Math.max(10, Math.random() * maxY) + 'px';
    
    // ✅ iOS Fix: pointerdown
    bug.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (isTarget) {
        score += 1;
        bug.style.transform = 'scale(2)';
        bug.style.opacity = '0';
        setTimeout(() => bug.remove(), 200);
      } else {
        score -= 1;
        bug.style.transform = 'scale(0.5)';
        bug.style.opacity = '0';
        setTimeout(() => bug.remove(), 200);
      }
    });
    
    area.appendChild(bug);
    
    setTimeout(() => {
      if (bug.parentNode) {
        bug.style.opacity = '0';
        setTimeout(() => bug.remove(), 300);
      }
    }, 1200);
    
  }, 600);

  const tick = setInterval(() => {
    timeLeft -= 0.1;
    timer.style.width = (timeLeft / 15 * 100) + '%';
    if (timeLeft <= 3) timer.classList.add('warning');
    
    if (timeLeft <= 0) {
      clearInterval(tick);
      clearInterval(gameInterval);
      area.innerHTML = `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:800;">${I18N[lang].g1End}</div>`;
      totalScore += Math.max(0, score);
      setTimeout(game2_Conveyor, 1500);
    }
  }, 100);
}

// 2. CONVEYOR BELT
function game2_Conveyor() {
  round = 2; updateProgress();
  $('footer').innerHTML = '';
  let score = 0;
  let timeLeft = 15;
  
  $('main').innerHTML = `
    <div class="instruction-box"><h2>${I18N[lang].g2Intro}</h2></div>
    <div class="timer-bar"><i id="timer2"></i></div>
    <div class="conveyor-area" id="convArea">
      <div class="belt"></div>
    </div>
  `;

  const area = $('convArea');
  const timer = $('timer2');
  
  gameInterval = setInterval(() => {
    const isGift = Math.random() > 0.4;
    const item = document.createElement('div');
    item.className = 'conveyor-item';
    item.textContent = isGift ? '🎁' : '💣';
    
    // ✅ iOS Fix: pointerdown
    item.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (isGift) score += 1;
      else score -= 1;
      item.style.opacity = '0';
      item.style.transform = 'translateY(-50%) scale(1.5)';
      setTimeout(() => item.remove(), 200);
    });
    
    area.appendChild(item);
    
    setTimeout(() => {
      if (item.parentNode) item.remove();
    }, 2500);
    
  }, 800);

  const tick = setInterval(() => {
    timeLeft -= 0.1;
    timer.style.width = (timeLeft / 15 * 100) + '%';
    if (timeLeft <= 3) timer.classList.add('warning');
    
    if (timeLeft <= 0) {
      clearInterval(tick);
      clearInterval(gameInterval);
      area.innerHTML = `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:800;z-index:10;">${I18N[lang].g2End}</div>`;
      totalScore += Math.max(0, score);
      setTimeout(game3_Stroop, 1500);
    }
  }, 100);
}

// 3. STROOP
function game3_Stroop() {
  round = 3; updateProgress();
  $('footer').innerHTML = '';
  let qIndex = 0;
  const totalQ = 5;
  let score = 0;
  const colorKeys = Object.keys(COLORS_MAP);
  
  function renderQ() {
    if (qIndex >= totalQ) {
      totalScore += score;
      setTimeout(showResults, 1000);
      return;
    }
    
    const word = colorKeys[Math.floor(Math.random() * 4)];
    let color = colorKeys[Math.floor(Math.random() * 4)];
    while (color === word) color = colorKeys[Math.floor(Math.random() * 4)];
    
    $('main').innerHTML = `
      <div class="instruction-box">
        <h2>${I18N[lang].g3Intro}</h2>
        <span style="font-size:12px;color:var(--c-slate);margin-top:5px;">(${qIndex+1} / ${totalQ})</span>
      </div>
      <div class="stroop-container">
        <div class="stroop-word" style="color: ${COLORS_MAP[color]};">${COLOR_NAMES[lang][word]}</div>
        <div class="color-grid" id="colorGrid">
          ${colorKeys.map(c => `<button class="color-btn" type="button" data-c="${c}" style="background: ${COLORS_MAP[c]};"></button>`).join('')}
        </div>
      </div>
    `;
    
    document.querySelectorAll('.color-btn').forEach(btn => {
      // ✅ iOS Fix: pointerdown
      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        const picked = btn.dataset.c;
        if (picked === color) {
          score++;
          btn.style.boxShadow = '0 0 0 6px #22C55E';
        } else {
          btn.style.boxShadow = '0 0 0 6px #EF4444';
        }
        
        setTimeout(() => {
          qIndex++;
          renderQ();
        }, 400);
      });
    });
  }
  
  renderQ();
}

/* ============================================
   RESULTS (For Assessment)
============================================ */
function showResults() {
  updateProgress();
  round = 4;
  
  const accuracy = Math.min(100, Math.round((totalScore / 25) * 100));
  localStorage.setItem('omega_attention_result', JSON.stringify({ accuracy, timestamp: Date.now() }));

  const passed = accuracy >= 50;
  let age = parseInt(localStorage.getItem('omega_user_age') || localStorage.getItem('omega_age')) || 0;
  const avatarType = (age > 0 && age <= 12) ? 'kid' : 'adult';
  
  $('main').innerHTML = `
    <div class="interstitial">
      <div class="avatar-circle" id="avatarBox">
        <span id="avatarEmoji">${passed ? '👏' : '💜'}</span>
        <img id="avatarImg" src="" alt="Avatar" style="display:none;" onerror="this.style.display='none'; document.getElementById('avatarEmoji').style.display='block';">
      </div>
      <h2 id="transTitle"></h2>
      <p id="transDesc"></p>
    </div>
  `;

  let imgIndex = 0;
  let interval = null;
  const imgEl = $('avatarImg');
  const emojiEl = $('avatarEmoji');

  if (passed) {
    $('transTitle').textContent = I18N[lang].transGreat;
    $('transDesc').textContent = `${I18N[lang].transGreatDesc} (${accuracy}%)`;
    
    const clapImgs = AVATAR_IMAGES[avatarType].clap;
    imgEl.src = clapImgs[0];
    imgEl.style.display = 'block'; emojiEl.style.display = 'none';
    interval = setInterval(() => {
      imgIndex = (imgIndex + 1) % 2;
      imgEl.src = clapImgs[imgIndex];
    }, 250);
  } else {
    $('transTitle').textContent = I18N[lang].transEncourage;
    $('transDesc').textContent = `${I18N[lang].transEncourageDesc} (${accuracy}%)`;
    
    const encourageImgs = AVATAR_IMAGES[avatarType].encourage;
    imgEl.src = encourageImgs[0];
    imgEl.style.display = 'block'; emojiEl.style.display = 'none';
    interval = setInterval(() => {
      imgIndex = (imgIndex + 1) % 2;
      imgEl.src = encourageImgs[imgIndex];
    }, 800);
  }

  setTimeout(() => {
    if(interval) clearInterval(interval);
    imgEl.src = passed ? AVATAR_IMAGES[avatarType].clap[0] : AVATAR_IMAGES[avatarType].encourage[0];
    
    $('footer').innerHTML = `<button class="btn" id="nextBtn" type="button">${I18N[lang].next}</button>`;
    $('nextBtn').onclick = () => {
      window.location.href = 'assessment-problem.html';
    };
  }, 2500);
}

/* ============================================
   TRAINING MODE (New Games)
============================================ */
function startTrainingRound() {
  main.innerHTML = '';
  $('footer').innerHTML = '';
  const games = [trainReaction, trainVisualSearch, trainMath];
  const selectedGame = games[Math.floor(Math.random() * games.length)];
  selectedGame();
}

// 1. Reaction Time
function trainReaction() {
  main.innerHTML = `
    <div class="instruction-box"><h2>${I18N[lang].trainReact}</h2></div>
    <div class="reaction-box" id="reactBox" style="background:#CBD5E1;">...</div>
  `;
  
  const box = $('reactBox');
  const delay = 2000 + Math.random() * 3000;
  let tapped = false;
  let startTime = 0;
  
  setTimeout(() => {
    if (tapped) return;
    box.style.background = 'var(--c-success)';
    box.textContent = 'TAP NOW!';
    startTime = Date.now();
    
    const handleTap = (e) => {
      e.preventDefault();
      if (tapped) return;
      tapped = true;
      box.removeEventListener('pointerdown', handleTap);
      
      const rt = Date.now() - startTime;
      let age = parseInt(localStorage.getItem('omega_user_age') || localStorage.getItem('omega_age')) || 0;
      let avatarType = (age > 0 && age <= 12) ? 'kid' : 'adult';
      
      const passed = rt < 600;
      if (passed) {
        currentLvl++;
        localStorage.setItem('omega_attention_train_level', currentLvl);
      }
      
      showTrainingResult(passed, passed ? `${I18N[lang].trainWinDesc} (${rt}ms)` : `${I18N[lang].trainLoseDesc} (${rt}ms)`, avatarType);
    };
    box.addEventListener('pointerdown', handleTap);
  }, delay);
  
  setTimeout(() => {
    if (!tapped) {
      tapped = true;
      let age = parseInt(localStorage.getItem('omega_user_age') || localStorage.getItem('omega_age')) || 0;
      let avatarType = (age > 0 && age <= 12) ? 'kid' : 'adult';
      showTrainingResult(false, 'Too slow!', avatarType);
    }
  }, delay + 2000);
}

// 2. Visual Search
function trainVisualSearch() {
  const size = currentLvl < 3 ? 3 : 4;
  const target = '🍏';
  const base = '🍎';
  
  main.innerHTML = `
    <div class="instruction-box"><h2>${I18N[lang].trainSearch}</h2></div>
    <div class="search-grid" id="sGrid" style="grid-template-columns: repeat(${size}, 1fr);"></div>
  `;
  
  const grid = $('sGrid');
  const total = size * size;
  const targetIdx = Math.floor(Math.random() * total);
  
  for (let i = 0; i < total; i++) {
    let t = document.createElement('div');
    t.className = 'search-tile';
    t.textContent = i === targetIdx ? target : base;
    
    t.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      let age = parseInt(localStorage.getItem('omega_user_age') || localStorage.getItem('omega_age')) || 0;
      let avatarType = (age > 0 && age <= 12) ? 'kid' : 'adult';
      
      if (i === targetIdx) {
        currentLvl++;
        localStorage.setItem('omega_attention_train_level', currentLvl);
        showTrainingResult(true, I18N[lang].trainWinDesc, avatarType);
      } else {
        t.style.background = '#FEE2E2';
        setTimeout(() => showTrainingResult(false, I18N[lang].trainLoseDesc, avatarType), 300);
      }
    });
    grid.appendChild(t);
  }
}

// 3. Math Sequence
function trainMath() {
  const a = Math.floor(Math.random() * 10) + 2;
  const d = Math.floor(Math.random() * 5) + 2;
  const seq = [a, a+d, a+2*d, a+3*d];
  const ans = a + 4*d;
  
  main.innerHTML = `
    <div class="instruction-box"><h2>${I18N[lang].trainMath}</h2></div>
    <div class="math-box">
      <div class="math-seq">${seq.join(', ')}, ?</div>
      <div class="search-grid" style="grid-template-columns: 1fr 1fr; max-width:280px;">
        <button class="btn" style="background:#fff; color:var(--c-navy); box-shadow:0 4px 10px rgba(0,0,0,0.05);" onclick="checkMath(${ans}, ${ans})">${ans}</button>
        <button class="btn" style="background:#fff; color:var(--c-navy); box-shadow:0 4px 10px rgba(0,0,0,0.05);" onclick="checkMath(${ans + d}, ${ans})">${ans + d}</button>
        <button class="btn" style="background:#fff; color:var(--c-navy); box-shadow:0 4px 10px rgba(0,0,0,0.05);" onclick="checkMath(${ans - 2}, ${ans})">${ans - 2}</button>
        <button class="btn" style="background:#fff; color:var(--c-navy); box-shadow:0 4px 10px rgba(0,0,0,0.05);" onclick="checkMath(${a + 3*d}, ${ans})">${a + 3*d}</button>
      </div>
    </div>
  `;
}

window.checkMath = (selected, correct) => {
  let age = parseInt(localStorage.getItem('omega_user_age') || localStorage.getItem('omega_age')) || 0;
  let avatarType = (age > 0 && age <= 12) ? 'kid' : 'adult';
  
  if (selected === correct) {
    currentLvl++;
    localStorage.setItem('omega_attention_train_level', currentLvl);
    showTrainingResult(true, I18N[lang].trainWinDesc, avatarType);
  } else {
    showTrainingResult(false, I18N[lang].trainLoseDesc, avatarType);
  }
};

function showTrainingResult(passed, desc, avatarType) {
  $('main').innerHTML = `
    <div class="interstitial">
      <div class="avatar-circle" id="avatarBox">
        <span id="avatarEmoji">${passed ? '👏' : '💜'}</span>
        <img id="avatarImg" src="" alt="Avatar" style="display:none;" onerror="this.style.display='none'; document.getElementById('avatarEmoji').style.display='block';">
      </div>
      <h2>${passed ? I18N[lang].trainWin : I18N[lang].trainLose}</h2>
      <p>${desc}</p>
    </div>
  `;
  $('footer').innerHTML = `<button class="btn" id="nextBtn" type="button">${I18N[lang].next}</button>`;
  
  const imgEl = $('avatarImg');
  const emojiEl = $('avatarEmoji');
  const imgs = passed ? AVATAR_IMAGES[avatarType].clap : AVATAR_IMAGES[avatarType].encourage;
  
  imgEl.src = imgs[0];
  imgEl.style.display = 'block'; emojiEl.style.display = 'none';
  
  let idx = 0;
  let intv = setInterval(() => {
    idx = (idx + 1) % 2;
    imgEl.src = imgs[idx];
  }, passed ? 250 : 800);
  
  $('nextBtn').onclick = () => {
    clearInterval(intv);
    startTrainingRound();
  };
}

/* --- EVENTS --- */
$('langBtn').onclick = () => { 
  lang = lang === 'ar' ? 'en' : 'ar'; 
  localStorage.setItem('omega_lang', lang);
  startGame(); 
};

$('exitBtn').onclick = () => { 
  if (confirm(I18N[lang].exitMsg)) {
    if (MODE === 'assessment') {
      window.location.href = 'assessment-intro.html';
    } else {
      window.location.href = 'home.html';
    }
  }
};

// Boot
startGame();
</script>

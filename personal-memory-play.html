<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FFFBF5">
<title>Omega — Companion Session</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--c-primary:#0E9487;--c-light:#2EC4B6;--c-dark:#076B5F;--c-success:#22C55E;--c-warning:#FBBF24;--c-navy:#0F172A;--c-slate:#64748B;--c-border:#E2E8F0;--g:linear-gradient(135deg,#0E9487 0%,#2EC4B6 45%,#3B82F6 100%)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Poppins',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#E2E8F0;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent}
html[lang=ar] body{font-family:'Cairo',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer;border:0;background:none}
input{font-family:inherit}
.stage{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 20% 20%,rgba(139,92,246,.12),transparent 50%),radial-gradient(circle at 80% 80%,rgba(14,148,135,.10),transparent 50%),#E2E8F0}
.phone{position:relative;width:375px;height:812px;max-height:calc(100vh - 40px);background:#FFFBF5;border-radius:44px;overflow:hidden;box-shadow:0 0 0 10px #1a1a1a,0 0 0 12px #2a2a2a,0 40px 80px rgba(0,0,0,.35)}
.phone::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:130px;height:26px;background:#1a1a1a;border-radius:0 0 18px 18px;z-index:100}
@media(max-width:480px){body,.stage{background:#FFFBF5}.stage{padding:0}.phone{width:100vw;height:100vh;max-height:100vh;border-radius:0;box-shadow:none}.phone::before{display:none}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(circle at 25% 15%,rgba(255,220,180,.22),transparent 55%),radial-gradient(circle at 80% 85%,rgba(200,180,255,.12),transparent 55%),linear-gradient(180deg,#FFFBF5 0%,#FFF8F0 40%,#FEF5EB 70%,#FFF9F2 100%)}

/* top bar */
.topbar{position:relative;z-index:10;display:flex;align-items:center;gap:10px;padding:52px 18px 0;flex-shrink:0}
.round-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.9);border:1px solid rgba(14,148,135,.15);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(15,23,42,.05);flex-shrink:0;transition:.25s}
.round-btn:hover{background:#fff;transform:rotate(90deg)}
.round-btn svg{width:14px;height:14px;stroke:var(--c-slate);stroke-width:2.4;fill:none;stroke-linecap:round}
.persona-btn{flex:1;min-width:0;display:inline-flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:999px;background:rgba(255,255,255,.92);border:1px solid var(--c-border);font-size:12.5px;font-weight:600;color:var(--c-navy);box-shadow:0 4px 12px rgba(15,23,42,.05)}
html[lang=ar] .persona-btn{padding:5px 5px 5px 14px;font-size:13px}
.persona-btn .mini{width:30px;height:30px;border-radius:50%;overflow:hidden;background:#E0F7F4;flex-shrink:0}
.persona-btn .mini img{width:100%;height:100%;object-fit:cover}
.persona-btn .lbl{flex:1;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:5px;align-items:center;padding:8px;background:rgba(255,255,255,.9);border-radius:999px;border:1px solid var(--c-border);flex-shrink:0}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(14,148,135,.2);transition:.3s}
.dot.done{background:var(--c-primary)}.dot.cur{width:18px;border-radius:999px;background:var(--g)}

/* main */
.main-call{position:relative;z-index:5;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 20px 0;text-align:center;overflow-y:auto;scrollbar-width:none}
.main-call::-webkit-scrollbar{display:none}
.companion{width:180px;height:180px;flex-shrink:0;border-radius:50%;overflow:hidden;box-shadow:0 12px 30px rgba(15,23,42,0.1);background:#fff;border:4px solid #fff;transition:box-shadow .3s}
.companion img{width:100%;height:100%;object-fit:cover}
.companion.speaking{box-shadow:0 0 0 6px rgba(46,196,182,.3),0 12px 30px rgba(14,148,135,0.2)}
.call-name{font-size:18px;font-weight:800;color:var(--c-navy);line-height:1.2;margin-top:4px}
html[lang=ar] .call-name{font-size:17px}
.status{font-size:12px;font-weight:500;color:var(--c-slate);min-height:16px}
html[lang=ar] .status{font-size:13px}
.pulse{height:10px;opacity:0;transition:opacity .3s}.pulse.on{opacity:1}
.pulse i{display:block;width:6px;height:6px;border-radius:50%;background:var(--c-light);box-shadow:0 0 8px rgba(46,196,182,.6);animation:pb 1.4s ease-in-out infinite}
@keyframes pb{50%{transform:scale(2);opacity:.4}}

/* question card */
.qcard{width:100%;max-width:320px;display:none;flex-direction:column;background:#fff;border-radius:20px;padding:12px;border:2px solid var(--c-border);box-shadow:0 12px 30px rgba(15,23,42,.08);transition:border-color .4s,box-shadow .4s;flex-shrink:0}
.qcard.show{display:flex;animation:cardIn .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.94)}}
.qcard.correct{border-color:var(--c-success);box-shadow:0 0 0 4px rgba(34,197,94,.18),0 12px 30px rgba(34,197,94,.2)}
.qcard.revealed{border-color:var(--c-warning);box-shadow:0 0 0 4px rgba(251,191,36,.18),0 12px 30px rgba(251,191,36,.2)}
.q-photo{position:relative;width:100%;border-radius:14px;overflow:hidden;background:var(--g);display:flex;align-items:center;justify-content:center;font-size:72px;color:#fff;font-weight:700;height:170px}
.q-photo img{width:100%;height:100%;object-fit:cover;display:block}
.hint-badge{position:absolute;top:10px;left:10px;width:34px;height:34px;border-radius:50%;background:rgba(251,191,36,.95);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;box-shadow:0 4px 10px rgba(251,191,36,.4);animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
html[dir=rtl] .hint-badge{left:auto;right:10px}
@keyframes pop{from{transform:scale(0)}}
.q-name-area{opacity:0;max-height:0;overflow:hidden;padding:0 6px;transition:.4s}
.q-name-area.show{opacity:1;max-height:80px;padding:10px 6px 4px}
.q-name{font-size:19px;font-weight:800;color:var(--c-navy)}
.q-meta{font-size:12.5px;color:var(--c-slate);font-weight:500;margin-top:3px}
html[lang=ar] .q-name,html[lang=ar] .q-meta{font-family:'Cairo',sans-serif}

/* actions */
.actions{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 20px 34px;flex-shrink:0;min-height:96px}
.listen{display:none;align-items:center;gap:8px;padding:8px 18px;background:rgba(34,197,94,.1);border:1.5px solid rgba(34,197,94,.3);border-radius:999px;font-size:13px;font-weight:700;color:var(--c-success)}
.listen.show{display:inline-flex}
.listen i{width:8px;height:8px;border-radius:50%;background:var(--c-success);animation:dp 1.2s ease-in-out infinite}
@keyframes dp{50%{opacity:.5;transform:scale(.7)}}
.forgot{display:none;padding:12px 24px;border-radius:999px;background:#fff;border:1.5px solid var(--c-border);color:var(--c-slate);font-size:13.5px;font-weight:600;box-shadow:0 4px 12px rgba(15,23,42,.05);transition:.25s}
.forgot.show{display:inline-flex}.forgot:hover{border-color:var(--c-warning);color:#B45309;background:rgba(251,191,36,.08)}
html[lang=ar] .listen,html[lang=ar] .forgot{font-family:'Cairo',sans-serif;font-size:14px}
.tin{width:100%;max-width:320px;display:none;align-items:center;gap:8px;padding:6px 6px 6px 16px;background:#fff;border:1.5px solid rgba(14,148,135,.2);border-radius:999px;box-shadow:0 8px 20px rgba(15,23,42,.08)}
.tin.show{display:flex}
.tin input{flex:1;border:0;outline:0;background:transparent;font-size:14px;font-weight:500;color:var(--c-navy);padding:8px 0;user-select:text}
.tin button{width:38px;height:38px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(14,148,135,.3)}
.tin svg{width:16px;height:16px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
html[dir=rtl] .tin svg{transform:scaleX(-1)}

/* sheet */
.ov{position:absolute;inset:0;background:rgba(15,23,42,.4);backdrop-filter:blur(6px);z-index:40;opacity:0;pointer-events:none;transition:opacity .35s}
.ov.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:28px 28px 0 0;max-height:74%;display:flex;flex-direction:column;z-index:50;transform:translateY(100%);transition:transform .45s cubic-bezier(.34,1.2,.64,1);box-shadow:0 -20px 60px rgba(15,23,42,.18);overflow:hidden}
.sheet.show{transform:none}
.handle{width:44px;height:5px;background:var(--c-border);border-radius:999px;margin:12px auto 6px;flex-shrink:0}
.sh-head{padding:4px 22px 12px;border-bottom:1px solid var(--c-border);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sh-title{font-size:15px;font-weight:800;color:var(--c-navy)}.sh-sub{font-size:11.5px;color:var(--c-slate);font-weight:500}
html[lang=ar] .sh-title{font-size:16px}html[lang=ar] .sh-sub{font-size:12.5px}
.pgrid{overflow-y:auto;scrollbar-width:none;padding:16px 18px 24px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.pcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 10px 12px;background:#FFFBF5;border:2px solid var(--c-border);border-radius:18px;transition:.3s;overflow:hidden}
.pcard:hover{border-color:rgba(14,148,135,.35);transform:translateY(-2px)}
.pcard.active{background:linear-gradient(#FFFBF5,#FFFBF5) padding-box,var(--g) border-box;border:2px solid transparent;box-shadow:0 10px 26px rgba(14,148,135,.2)}
.persona-card-avatar{width:84px;height:84px;border-radius:50%;overflow:hidden;background:#E0F7F4;flex-shrink:0}
.persona-card-avatar img{width:100%;height:100%;object-fit:cover}
.pname{font-size:13.5px;font-weight:700;color:var(--c-navy)}html[lang=ar] .pname{font-size:14.5px}
.plabel{font-size:10.5px;font-weight:600;color:var(--c-slate);padding:2px 9px;background:rgba(14,148,135,.08);border-radius:999px}
.pcard.active .plabel{background:var(--g);color:#fff}
.pcheck{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--c-success);display:none;align-items:center;justify-content:center}
html[dir=rtl] .pcheck{right:auto;left:8px}.pcard.active .pcheck{display:flex}
.pcheck svg{width:13px;height:13px;stroke:#fff;stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* end overlay */
.end{position:absolute;inset:0;background:rgba(15,23,42,.35);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:100;padding:30px}
.end.show{display:flex;animation:fi .3s}@keyframes fi{from{opacity:0}}
.end-card{background:#fff;border-radius:24px;padding:26px 22px 20px;max-width:320px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(15,23,42,.25);animation:cp .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes cp{0%{transform:scale(.85);opacity:0}100%{transform:scale(1)}}
.end-icon{width:64px;height:64px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center;margin:0 auto;box-shadow:0 12px 30px rgba(14,148,135,.35)}
.end-icon svg{width:30px;height:30px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.end-title{font-size:19px;font-weight:800;color:var(--c-navy)}.end-desc{font-size:12.5px;color:var(--c-slate);line-height:1.55;font-weight:500}
html[lang=ar] .end-title{font-size:18px}html[lang=ar] .end-desc{font-size:13.5px}
.stats{display:flex;gap:8px}.stat{flex:1;padding:12px 8px;background:#F8FAFC;border:1.5px solid var(--c-border);border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:3px}
.stat b{font-size:18px;font-weight:800;color:var(--c-primary);line-height:1}.stat span{font-size:10px;font-weight:700;color:var(--c-slate)}
.end-btn{width:100%;padding:14px;background:var(--g);color:#fff;font-size:14.5px;font-weight:700;border-radius:14px;box-shadow:0 10px 24px rgba(14,148,135,.3)}
html[lang=ar] .end-btn{font-size:15.5px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="stage"><div class="phone"><div class="screen">

  <div class="topbar">
    <button class="round-btn" id="closeBtn" aria-label="Close"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    <button class="persona-btn" id="personaBtn" aria-label="Change companion"><span class="mini" id="personaMini"></span><span class="lbl" id="personaLabel"></span></button>
    <div class="dots" id="dots"></div>
  </div>

  <div class="main-call">
    <div class="companion" id="avatarWrap"></div>
    <div class="call-name" id="callName"></div>
    <div class="status" id="statusText">…</div>
    <div class="pulse" id="pulse"><i></i></div>
    <div class="qcard" id="qcard">
      <div class="q-photo" id="qPhoto"></div>
      <div class="q-name-area" id="qNameArea"><div class="q-name" id="qName"></div><div class="q-meta" id="qMeta"></div></div>
    </div>
  </div>

  <div class="actions">
    <div class="listen" id="listen"><i></i><span id="listenText"></span></div>
    <button class="forgot" id="forgotBtn"></button>
    <div class="tin" id="tin"><input type="text" id="tinput"><button id="tsend" aria-label="Send"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button></div>
  </div>

  <div class="ov" id="pov"></div>
  <div class="sheet" id="psheet">
    <div class="handle"></div>
    <div class="sh-head"><div><div class="sh-title" id="shTitle"></div><div class="sh-sub" id="shSub"></div></div>
      <button class="round-btn" id="pclose" style="width:30px;height:30px"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="pgrid" id="pgrid"></div>
  </div>

  <div class="end" id="end"><div class="end-card">
    <div class="end-icon"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
    <div class="end-title" id="endTitle"></div><div class="end-desc" id="endDesc"></div>
    <div class="stats"><div class="stat"><b id="statTime">0:00</b><span id="lblTime"></span></div><div class="stat"><b id="statRec">0</b><span id="lblRec"></span></div></div>
    <button class="end-btn" id="endBtn"></button>
  </div></div>

</div></div></div>

<script>
/* ============================================================
   ⚠️⚠️⚠️ مكان الصور بتاعتك (الصور الجديدة اللي طلبتيها) ⚠️⚠️⚠️
============================================================ */
const AVATAR_IMAGES = {
  // 👨 الأفاتار الكبير
  adult: {
    listen: 'الافاتار الكبير واليوزر بيتكلم .jpg',
    speak: [
      'image.png',
      'image copy.png',
      'photo_2026-11-15_01-53-33.jpg'
    ],
    // 👇 [حطي هنا صورتين الأفاتار الكبير للتسقيفة]
    clap: [
      'الكبار تسقيفه 1.jpg', // 👈 (صورة الأفاتار الكبير وإيدها مقفولة)
      'الكبار تسقيفه 2.jpg'    // 👈 (صورة الأفاتار الكبير وإيدها مفتوحة)
    ],
    // 👇 [حطي هنا صورة الأفاتار الكبير لما يجاوب غلط]
    sad: 'الكبار جاوب غلط.jpg' 
  },
  // 👧 أفاتار الطفل/الطفلة
  kid: {
    listen: 'الصغير واليوزر بيتكلم.jpg',
    speak: [
      'اول بيتكلم.jpg',
      'ثاني بتتكلم.jpg',
      'ثالث بيتكلم.jpg'
    ],
    // 👇 [حطي هنا صورتين أفاتار الطفل للتسقيفة]
    clap: [
      'اطفال تسقيفه مقفوله.jpg', // 👈 (صورة الطفل وإيدها مقفولة)
      'اطفال تسقيفه 1.jpg'    // 👈 (صورة الطفل وإيدها مفتوحة)
    ],
    // 👇 [حطي هنا صورة الطفل لما يجاوب غلط]
    sad: 'الصغير جاوب غبط.jpg' 
  }
};
/* ============================================================ */

const I18N={
en:{connecting:'One moment…',speaking:'Talking with you',yourTurn:'Your turn — say the name',listening:'Listening…',forgot:"I don't remember",
 placeholder:'Type your answer…',endTitle:'Well done!',endDesc:'Your memory worked nicely today. See you soon.',time:'Time',rec:'Remembered',home:'Back to Home',
 typeBelow:'Type your answer below',pTitle:'Change companion',pSub:'Pick who you want to talk with today',kid:'Child',adult:'Adult',
 greetM:'Good morning',greetE:'Good evening',
 intro:"{g}, {name}! I'm {ai}, and I'll be with you today. Let's remember the people and places you love, together.",
 empty:'Your Memory Bank is still empty. Add your first person and I will be right here.',
 qWho:'Do you remember who this is?',qPlace:'Do you remember this place? What is it called?',qEvent:'Do you remember this moment? What is it?',
 good:['Well done! Yes, this is {n}.',"That's right! This is {n}. Your memory is working well."],
 hint:'Try once more, take your time. The name starts with "{h}".',unsure:'No problem at all, take your time. The name starts with "{h}".',
 reveal:'This is {n}. That is okay, we will remember together next time.',skip:"That's okay, we'll come back to it together.",
 bye:'That was a lovely time with you, {name}. See you later.',friend:'friend',hello:'Hi!'},
ar:{connecting:'لحظة…',speaking:'بكلمك دلوقتي',yourTurn:'دورك — قول الاسم',listening:'سامعك…',forgot:'مش فاكر',
 placeholder:'اكتب ردك هنا…',endTitle:'برافو عليك!',endDesc:'ذاكرتك اشتغلت حلو النهاردة. أشوفك قريب.',time:'المدة',rec:'افتكرت',home:'رجوع للرئيسية',
 typeBelow:'اكتب ردك تحت',pTitle:'غيّر صاحبك',pSub:'اختار اللي تحب تكلمه النهاردة',kid:'طفل',adult:'بالغ',
 greetM:'صباح الخير',greetE:'مساء الخير',
 intro:'{g} يا {name}! أنا {ai}، وهكون معاك النهاردة. تعالى نفتكر سوا الناس والأماكن اللي بتحبها.',
 empty:'بنك الذكريات لسه فاضي. ضيف أول شخص وأنا معاك.',
 qWho:'فاكر دي مين؟',qPlace:'فاكر المكان ده؟ اسمه إيه؟',qEvent:'فاكر اللحظة دي؟ إيه هي؟',
 good:['برافو عليك! فعلًا ده {n}.','صح! ده {n}. ذاكرتك شغالة حلو.'],
 hint:'جرب تاني، خد وقتك. الاسم بيبدأ بحرف «{h}».',unsure:'مفيش مشكلة خالص، خد وقتك. الاسم بيبدأ بحرف «{h}».',
 reveal:'ده {n}. مش مشكلة، هنفتكره سوا المرة الجاية.',skip:'مفيش مشكلة، هنرجعله مع بعض.',
 bye:'كان وقت حلو معاك يا {name}. نكمل بعدين.',friend:'يا صديقي',hello:'أهلاً!'}
};
const $=id=>document.getElementById(id);
let lang=localStorage.getItem('omega_lang')==='ar'?'ar':'en';

const S={listening:false,speaking:false,start:Date.now(),turns:0,items:[],used:new Set(),ended:false,sr:false,rec:null,q:null,recalled:0,maxQ:5,persona:'adult',age:0};

const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=(s,v)=>s.replace(/\{(\w+)\}/g,(_,k)=>v[k]==null?'':v[k]);
const norm=s=>String(s||'').toLowerCase().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
const UNSURE=/(مش فاكر|مش عارف|معرفش|ما اعرفش|نسيت|مش متاكد|dont know|don t know|do not know|not sure|no idea|forgot|cant remember|can t remember)/;
const userName=()=>localStorage.getItem('omega_user_name')||I18N[lang].friend;

/* ---------- Avatar Image Logic (المنطق الجديد للتفاعل) ---------- */
let speakInterval = null;
let speakIndex = 0;

let isReacting = false;
let reactInterval = null;
let reactTimeout = null;

function updateAvatarImage(state, index = 0) {
  const imgs = AVATAR_IMAGES[S.persona];
  const imgEl = document.getElementById('mainAvatarImg');
  if (!imgEl) return;

  if (state === 'speaking') {
    imgEl.src = imgs.speak[index];
  } else if (state === 'happy') {
    imgEl.src = imgs.clap[index];
  } else if (state === 'sad') {
    imgEl.src = imgs.sad;
  } else {
    imgEl.src = imgs.listen;
  }
}

function startTalkingAnimation() {
  if (speakInterval) clearInterval(speakInterval);
  if (isReacting) return; // لو في تسقيفة أو زعل شغال، الكلام ميقطعوش
  speakIndex = 0;
  speakInterval = setInterval(() => {
    speakIndex = (speakIndex + 1) % 3;
    updateAvatarImage('speaking', speakIndex);
  }, 1000); // سرعة الكلام (ثانية كاملة)
}

function stopTalkingAnimation() {
  if (speakInterval) clearInterval(speakInterval);
  speakInterval = null;
  if (!isReacting) {
    updateAvatarImage('listen');
  }
}

function triggerReaction(type, duration = 2500) {
  // إيقاف أي رياكشن شغال حالياً
  if (reactInterval) clearInterval(reactInterval);
  if (reactTimeout) clearTimeout(reactTimeout);
  
  isReacting = true;
  const imgs = AVATAR_IMAGES[S.persona];
  
  if (type === 'happy') {
    let idx = 0;
    updateAvatarImage('happy', idx);
    // التبديل بين إيد مقفولة وإيد مفتوحة كل 250 مللي ثانية
    reactInterval = setInterval(() => {
      idx = (idx + 1) % 2;
      updateAvatarImage('happy', idx);
    }, 250); 
  } else if (type === 'sad') {
    updateAvatarImage('sad');
  }
  
  // إنهاء الرياكشن والرجوع لصورة السكون
  reactTimeout = setTimeout(() => {
    if (reactInterval) clearInterval(reactInterval);
    isReacting = false;
    if (!S.speaking) {
      updateAvatarImage('listen');
    }
  }, duration);
}

function setPersona(key, save) {
  S.persona = key;
  $('avatarWrap').innerHTML = `<img src="${AVATAR_IMAGES[key].listen}" id="mainAvatarImg" alt="Avatar">`;
  $('personaMini').innerHTML = `<img src="${AVATAR_IMAGES[key].listen}" alt="Mini">`;
  
  const name = 'Omega';
  $('callName').textContent = name;
  $('personaLabel').textContent = name;
  
  if (save) {
    try { localStorage.setItem('omega_avatar_persona', key); } catch(e) {}
  }
}

function pickPersona() {
  let age = 0;
  if (localStorage.getItem('omega_account_type') === 'caregiver') {
    try {
      const arr = JSON.parse(localStorage.getItem('omega_care_persons') || '[]');
      const id = localStorage.getItem('omega_current_person_id');
      const p = arr.find(x => String(x.id) === String(id)) || arr[0] || {};
      age = parseInt(p.age) || 0;
    } catch(e) {}
  } else {
    age = parseInt(localStorage.getItem('omega_user_age') || localStorage.getItem('omega_age')) || 0;
  }
  S.age = age;

  const saved = localStorage.getItem('omega_avatar_persona');
  if (saved === 'kid' || saved === 'adult') return saved;

  return (age > 0 && age <= 12) ? 'kid' : 'adult';
}

function renderGrid() {
  const g = $('pgrid'), t = I18N[lang];
  g.innerHTML = '';
  
  ['adult', 'kid'].forEach(k => {
    const isActive = k === S.persona;
    const name = 'Omega';
    const label = k === 'kid' ? t.kid : t.adult;
    
    const c = document.createElement('button');
    c.className = 'pcard' + (isActive ? ' active' : '');
    c.innerHTML = `
      <div class="persona-card-avatar"><img src="${AVATAR_IMAGES[k].listen}" alt=""></div>
      <div class="pname">${name}</div>
      <div class="plabel">${label}</div>
      <div class="pcheck"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
    `;
    c.onclick = () => { setPersona(k, true); closeSheet(); };
    g.appendChild(c);
  });
}

/* ---------- memory bank ---------- */
function loadBank(){
  const get=c=>{try{const a=JSON.parse(localStorage.getItem('omega_bank_'+c)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}};
  S.items=[...get('people').map(p=>({...p,type:'person'})),...get('places').map(p=>({...p,type:'place'})),...get('events').map(p=>({...p,type:'event'}))].filter(x=>x&&x.name);
}
function nextItem(){
  let pool=S.items.filter((_,i)=>!S.used.has(i));
  if(!pool.length){S.used.clear();pool=S.items}
  const it=pool[Math.floor(Math.random()*pool.length)];S.used.add(S.items.indexOf(it));return it;
}

/* ---------- speech out ---------- */
function setSpeakingUI(on){
  S.speaking=on;
  $('avatarWrap').classList.toggle('speaking',on);
  $('pulse').classList.toggle('on',on);
  
  if(on){
    startTalkingAnimation();
    $('avatarWrap').classList.remove('listening');
    $('statusText').textContent=I18N[lang].speaking;
    $('listen').classList.remove('show');
    $('forgotBtn').classList.remove('show');
  } else {
    stopTalkingAnimation();
  }
}

function speak(text,cb){
  if(!('speechSynthesis' in window)){
    setSpeakingUI(true);
    setTimeout(()=>{setSpeakingUI(false);cb&&cb()},Math.max(1200,text.length*45));return;
  }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=lang==='ar'?'ar-EG':'en-US';
  u.rate=(S.age>=60?.88:1); u.pitch=S.persona==='kid'?1.5:1.1;
  
  setSpeakingUI(true);
  const done=()=>{setSpeakingUI(false);cb&&cb()};
  u.onend=done;u.onerror=done;
  speechSynthesis.speak(u);
}

/* ---------- speech in ---------- */
function setListeningUI(on){
  $('avatarWrap').classList.toggle('listening',on);
  $('pulse').classList.toggle('on',on);
  $('listen').classList.toggle('show',on);
  $('forgotBtn').classList.toggle('show',on);
  
  if(on){
    $('avatarWrap').classList.remove('speaking');
    $('statusText').textContent=I18N[lang].listening;
  }
  else if(S.q&&!S.speaking)$('statusText').textContent=I18N[lang].yourTurn;
}

function initRec(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){S.sr=false;$('tin').classList.add('show');return}
  S.sr=true;const r=new SR();r.continuous=false;r.interimResults=false;
  r.onresult=e=>{const t=e.results[0][0].transcript.trim();if(t){S.listening=false;setListeningUI(false);answer(t)}};
  r.onerror=e=>{
    S.listening=false;setListeningUI(false);
    if((e.error==='no-speech'||e.error==='aborted')&&S.q&&!S.ended)setTimeout(()=>{if(S.q&&!S.listening&&!S.speaking&&!S.ended)listen()},1000);
  };
  r.onend=()=>{S.listening=false;setListeningUI(false)};
  S.rec=r;
}

function listen(){
  if(!S.sr||S.listening||S.speaking||S.ended||!S.q)return;
  try{S.rec.lang=lang==='ar'?'ar-EG':'en-US';S.rec.start();S.listening=true;setListeningUI(true)}
  catch(e){setTimeout(()=>{if(S.q&&!S.listening&&!S.ended){try{S.rec.start();S.listening=true;setListeningUI(true)}catch(x){}}},800)}
}

function stopListen(){if(S.rec&&S.listening){try{S.rec.stop()}catch(e){}S.listening=false;setListeningUI(false)}}
const autoListen=()=>{if(S.sr&&S.q&&!S.ended)setTimeout(()=>{if(S.q&&!S.listening&&!S.speaking&&!S.ended)listen()},500)};

/* ---------- UI Actions ---------- */
const openSheet=()=>{renderGrid();$('pov').classList.add('show');setTimeout(()=>$('psheet').classList.add('show'),50)};
const closeSheet=()=>{$('psheet').classList.remove('show');$('pov').classList.remove('show')};

function showCard(item,reveal,hint){
  const ph=$('qPhoto');$('qcard').classList.remove('correct','revealed');ph.innerHTML='';
  if(item.photo){const im=new Image();im.src=item.photo;im.alt='';ph.appendChild(im)}
  else ph.textContent={person:'👤',place:'📍',event:'🎉'}[item.type]||'👤';
  if(hint&&!reveal){const b=document.createElement('div');b.className='hint-badge';b.textContent=item.name.charAt(0);ph.appendChild(b)}
  $('qName').textContent=item.name;$('qMeta').textContent=item.meta||'';
  $('qNameArea').classList.toggle('show',!!reveal);
  $('qcard').classList.add('show');
}
const markCard=c=>{$('qcard').classList.remove('correct','revealed');$('qcard').classList.add(c)};

function renderDots(){
  const d=$('dots');d.innerHTML='';
  for(let i=0;i<S.maxQ;i++){const s=document.createElement('span');s.className='dot'+(i<S.turns-1?' done':i===S.turns-1?' cur':'');d.appendChild(s)}
}

/* ---------- conversation ---------- */
function say(text,cb){speak(text,cb)}

function startConversation(){
  const t=I18N[lang];
  if(!S.items.length){say(t.empty,()=>setTimeout(endCall,800));return}
  S.maxQ=Math.min(5,S.items.length);renderDots();
  
  const name = 'Omega'; 
  say(fmt(t.intro,{g:new Date().getHours()<12?t.greetM:t.greetE,name:userName(),ai:name}),()=>setTimeout(askNext,600));
}

function askNext(){
  if(S.ended)return;
  if(S.turns>=S.maxQ){finish();return}
  const t=I18N[lang],item=nextItem();
  const text=item.type==='place'?t.qPlace:item.type==='event'?t.qEvent:t.qWho;
  S.q={item,tries:0};S.turns++;renderDots();showCard(item,false,false);
  
  setTimeout(()=>say(text,autoListen),500);
}

function answer(text){
  if(S.ended||!S.q)return;
  S.listening=false;setListeningUI(false);
  const q=S.q;S.q=null;
  const t=I18N[lang],item=q.item,a=norm(text),v={n:item.name,h:[...item.name][0]};
  const unsure=UNSURE.test(a)||a.length<2;
  const ok=!unsure&&norm(item.name).split(' ').filter(x=>x.length>1).some(k=>a.includes(k));
  let reply,next=true;
  
  if(ok){
    S.recalled++;
    showCard(item,true,false);
    markCard('correct');
    triggerReaction('happy', 2500); // 👈 تفعيل التسقيفة
    reply=fmt(pick(t.good),v);
  }
  else if(q.tries<1){
    q.tries++;S.q=q;
    showCard(item,false,true);
    reply=fmt(unsure?t.unsure:t.hint,v);
    next=false;
  }
  else{
    showCard(item,true,false);
    markCard('revealed');
    triggerReaction('sad', 2500); // 👈 تفعيل الزعل
    reply=fmt(t.reveal,v);
  }
  
  setTimeout(()=>say(reply,()=>next?setTimeout(askNext,800):autoListen()),500);
}

function forgot(){
  if(S.ended||!S.q)return;
  stopListen();const item=S.q.item;S.q=null;
  showCard(item,true,false);markCard('revealed');
  triggerReaction('sad', 2500); // 👈 ممكن تفعليها هنا كمان لو حبيتي
  setTimeout(()=>say(I18N[lang].skip,()=>setTimeout(askNext,800)),500);
}

function finish(){
  say(fmt(I18N[lang].bye,{name:userName()}),()=>setTimeout(endCall,700))
}

function endCall(){
  if(S.ended)return;S.ended=true;
  if(window.speechSynthesis)speechSynthesis.cancel();
  stopListen();
  stopTalkingAnimation();
  if (reactInterval) clearInterval(reactInterval);
  if (reactTimeout) clearTimeout(reactTimeout);
  
  const d=Math.floor((Date.now()-S.start)/1000);
  $('statTime').textContent=Math.floor(d/60)+':'+String(d%60).padStart(2,'0');
  $('statRec').textContent=S.recalled+'/'+S.turns;
  $('end').classList.add('show');
  try{localStorage.setItem('omega_personal_memory_result',JSON.stringify({duration:d,turns:S.turns,accuracy:S.turns?Math.round(100*S.recalled/S.turns):0,timestamp:Date.now()}))}catch(e){}
}

/* ---------- language ---------- */
function applyLang(){
  const t=I18N[lang];
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  $('forgotBtn').textContent=t.forgot;$('tinput').placeholder=t.placeholder;
  $('shTitle').textContent=t.pTitle;$('shSub').textContent=t.pSub;
  $('endTitle').textContent=t.endTitle;$('endDesc').textContent=t.endDesc;$('lblTime').textContent=t.time;$('lblRec').textContent=t.rec;$('endBtn').textContent=t.home;
  $('listenText').textContent=t.listening;
  
  const name = 'Omega'; 
  $('callName').textContent=name; $('personaLabel').textContent=name;
  $('statusText').textContent=S.speaking?t.speaking:S.listening?t.listening:S.q?t.yourTurn:t.connecting;
}

/* ---------- events + init ---------- */
$('closeBtn').onclick=endCall;
$('endBtn').onclick=()=>{location.href='home.html'};
$('forgotBtn').onclick=forgot;
$('personaBtn').onclick=openSheet;$('pclose').onclick=closeSheet;$('pov').onclick=closeSheet;
$('tsend').onclick=()=>{const v=$('tinput').value.trim();if(v){answer(v);$('tinput').value=''}};
$('tinput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('tsend').click()}});
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>{};
window.addEventListener('beforeunload',()=>{if(window.speechSynthesis)speechSynthesis.cancel();stopListen();stopTalkingAnimation()});

setPersona(pickPersona(),false);
applyLang();loadBank();initRec();
if(!S.sr)setTimeout(()=>{$('statusText').textContent=I18N[lang].typeBelow},500);
setTimeout(startConversation,900);
</script>
</body>

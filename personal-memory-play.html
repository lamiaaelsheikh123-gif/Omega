<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#FFFBF5" />
<title>Omega — Companion Session</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ============================================
   DESIGN TOKENS
============================================ */
:root {
  --c-primary:       #0E9487;
  --c-primary-light: #2EC4B6;
  --c-primary-dark:  #076B5F;
  --c-blue:          #3B82F6;
  --c-purple:        #8B5CF6;
  --c-success: #22C55E;
  --c-warning: #FBBF24;
  --c-error:   #EF4444;
  --c-navy:   #0F172A;
  --c-slate:  #64748B;
  --c-bg:     #F8FAFC;
  --c-card:   #FFFFFF;
  --c-border: #E2E8F0;
  --g-brand: linear-gradient(135deg, #0E9487 0%, #2EC4B6 45%, #3B82F6 100%);
  --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --r-xl: 24px; --r-pill: 999px;
  --f-en: 'Poppins', system-ui, sans-serif;
  --f-ar: 'Cairo', system-ui, sans-serif;
  --phone-w: 375px;
  --phone-h: 812px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--f-en);
  -webkit-font-smoothing: antialiased;
  background: #E2E8F0;
  overflow: hidden;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

html[lang="ar"] body { font-family: var(--f-ar); }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input { font-family: inherit; }

/* PHONE FRAME */
.stage {
  width: 100vw; height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background:
    radial-gradient(circle at 20% 20%, rgba(139, 92, 246, 0.12), transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(14, 148, 135, 0.10), transparent 50%),
    #E2E8F0;
}

.phone {
  position: relative;
  width: var(--phone-w); height: var(--phone-h);
  max-height: calc(100vh - 40px);
  background: #FFFBF5;
  border-radius: 44px;
  overflow: hidden;
  box-shadow: 0 0 0 10px #1a1a1a, 0 0 0 12px #2a2a2a,
    0 40px 80px rgba(0, 0, 0, 0.35), 0 20px 40px rgba(0, 0, 0, 0.15);
}

.phone::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 130px; height: 26px;
  background: #1a1a1a;
  border-radius: 0 0 18px 18px;
  z-index: 100;
}

@media (max-width: 480px) {
  body { background: #FFFBF5; }
  .stage { padding: 0; background: #FFFBF5; }
  .phone { width: 100vw; height: 100vh; max-height: 100vh; border-radius: 0; box-shadow: none; }
  .phone::before { display: none; }
}

/* SCREEN — Warm cream background (not tech-y) */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(circle at 25% 15%, rgba(255, 220, 180, 0.20) 0%, transparent 55%),
    radial-gradient(circle at 80% 85%, rgba(200, 180, 255, 0.10) 0%, transparent 55%),
    linear-gradient(180deg, #FFFBF5 0%, #FFF8F0 40%, #FEF5EB 70%, #FFF9F2 100%);
  overflow: hidden;
}

.screen::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 30% 20%, rgba(46, 196, 182, 0.06) 0%, transparent 50%),
    radial-gradient(circle at 75% 80%, rgba(139, 92, 246, 0.05) 0%, transparent 55%);
  pointer-events: none;
  z-index: 0;
}

/* TOP BAR */
.topbar {
  position: relative;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 52px 18px 0;
  flex-shrink: 0;
}

.close-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.85);
  border: 1px solid rgba(14, 148, 135, 0.15);
  display: inline-flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
  transition: all 0.25s ease;
  flex-shrink: 0;
}

.close-btn:hover { background: #fff; transform: rotate(90deg); }
.close-btn svg { width: 14px; height: 14px; stroke: var(--c-slate); stroke-width: 2.4; fill: none; stroke-linecap: round; }

.persona-btn {
  flex: 1;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 5px 14px 5px 5px;
  border-radius: var(--r-pill);
  background: rgba(255, 255, 255, 0.9);
  border: 1px solid var(--c-border);
  font-size: 12.5px; font-weight: 600;
  color: var(--c-navy);
  box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
  transition: all 0.2s ease;
  min-width: 0;
}

.persona-btn:hover { border-color: rgba(14, 148, 135, 0.3); }

html[lang="ar"] .persona-btn {
  font-family: var(--f-ar);
  font-size: 13px;
  padding: 5px 5px 5px 14px;
}

.persona-btn .mini {
  width: 30px; height: 30px;
  border-radius: 50%;
  overflow: hidden;
  background: #E0F7F4;
  flex-shrink: 0;
}

.persona-btn .mini svg { width: 100%; height: 100%; display: block; }

.persona-btn .label {
  flex: 1;
  text-align: start;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: flex;
  align-items: center;
  gap: 4px;
}

.persona-btn .label svg {
  width: 12px; height: 12px;
  stroke: currentColor; stroke-width: 2.4; fill: none;
  opacity: 0.5;
  flex-shrink: 0;
}

/* PROGRESS DOTS */
.progress-dots {
  display: flex;
  gap: 5px;
  align-items: center;
  flex-shrink: 0;
  padding: 8px;
  background: rgba(255, 255, 255, 0.85);
  border-radius: var(--r-pill);
  border: 1px solid var(--c-border);
  box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
}

.progress-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: rgba(14, 148, 135, 0.2);
  transition: all 0.3s ease;
}

.progress-dot.done {
  background: var(--c-primary);
  box-shadow: 0 0 6px rgba(14, 148, 135, 0.5);
}

.progress-dot.current {
  width: 18px;
  border-radius: var(--r-pill);
  background: var(--g-brand);
  box-shadow: 0 0 8px rgba(14, 148, 135, 0.4);
}

/* MAIN */
.main-call {
  position: relative;
  z-index: 5;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 10px;
  padding: 16px 22px 0;
  min-height: 0;
  text-align: center;
  overflow-y: auto;
  scrollbar-width: none;
}

.main-call::-webkit-scrollbar { display: none; }

/* AVATAR */
.companion {
  position: relative;
  width: 170px; height: 170px;
  border-radius: 50%;
  flex-shrink: 0;
  overflow: hidden;
  background: radial-gradient(circle at 50% 35%, #fff, #DFF7F2 72%);
  box-shadow: 0 18px 40px rgba(14, 148, 135, 0.16), 0 0 0 6px rgba(255, 255, 255, 0.75);
  transition: box-shadow 0.4s ease;
}

.companion.speaking {
  box-shadow: 0 18px 40px rgba(14, 148, 135, 0.26), 0 0 0 6px rgba(46, 196, 182, 0.4), 0 0 0 15px rgba(46, 196, 182, 0.12);
}

.companion > svg {
  width: 100%; height: 100%;
  display: block;
  animation: breathe 4.5s ease-in-out infinite;
}

@keyframes breathe {
  50% { transform: translateY(3px) scale(1.012); }
}

.eyes {
  transform-box: fill-box;
  transform-origin: center;
  animation: blink 5s infinite;
}

@keyframes blink {
  0%, 94%, 100% { transform: scaleY(1); }
  96.5% { transform: scaleY(0.08); }
}

.m-open {
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
}

.companion.speaking .m-open {
  opacity: 1;
  animation: talk 0.34s ease-in-out infinite alternate;
}

.companion.speaking .m-smile { opacity: 0; }

@keyframes talk {
  from { transform: scale(0.8, 0.3); }
  to { transform: scale(1, 1); }
}

/* NAME + STATUS */
.call-name {
  font-size: 20px;
  font-weight: 800;
  color: var(--c-navy);
  letter-spacing: -0.3px;
  line-height: 1.2;
  margin-top: 6px;
}

html[lang="ar"] .call-name {
  font-family: var(--f-ar);
  font-size: 19px;
  letter-spacing: 0;
}

.call-status-text {
  font-size: 12.5px;
  font-weight: 500;
  color: var(--c-slate);
  letter-spacing: 0.2px;
  min-height: 18px;
  margin-top: 2px;
}

html[lang="ar"] .call-status-text {
  font-family: var(--f-ar);
  font-size: 13.5px;
}

/* SINGLE PULSE (replaces waveform) */
.pulse {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 20px;
  margin-top: 4px;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.pulse.active { opacity: 1; }

.pulse-inner {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: linear-gradient(135deg, #0E9487, #2EC4B6);
  box-shadow: 0 0 8px rgba(46, 196, 182, 0.6);
  animation: pulseBreath 1.4s ease-in-out infinite;
}

@keyframes pulseBreath {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(2); opacity: 0.4; }
}

/* CAPTION (main speech area) */
.caption {
  min-height: 76px;
  max-width: 310px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 16.5px;
  line-height: 1.55;
  font-weight: 600;
  color: var(--c-navy);
  padding: 4px 0;
}

html[lang="ar"] .caption {
  font-family: var(--f-ar);
  font-size: 17.5px;
}

.caption.me {
  color: var(--c-primary-dark);
  font-weight: 500;
  font-size: 15px;
}

/* MEMORY CARD */
.mem-card {
  display: none;
  align-items: center;
  gap: 14px;
  padding: 12px 18px 12px 12px;
  background: #fff;
  border-radius: 20px;
  border: 1.5px solid var(--c-border);
  box-shadow: 0 10px 26px rgba(15, 23, 42, 0.08);
  max-width: 310px;
  transition: all 0.3s ease;
}

html[lang="ar"] .mem-card {
  padding: 12px 12px 12px 18px;
}

.mem-card.show {
  display: flex;
  animation: cardIn 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2);
}

.mem-card.correct {
  border-color: var(--c-success);
  box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.15), 0 10px 26px rgba(34, 197, 94, 0.2);
}

.mem-card.revealed {
  border-color: var(--c-warning);
  box-shadow: 0 0 0 4px rgba(251, 191, 36, 0.15), 0 10px 26px rgba(251, 191, 36, 0.2);
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(14px) scale(0.92); }
}

.mem-photo {
  width: 110px; height: 110px;
  border-radius: 16px;
  overflow: hidden;
  background: var(--g-brand);
  color: #fff;
  font-weight: 700;
  font-size: 44px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  position: relative;
}

.mem-photo img {
  width: 100%; height: 100%;
  object-fit: cover;
}

.mem-photo.hidden {
  background: linear-gradient(135deg, #E2E8F0, #CBD5E1);
  color: rgba(100, 116, 139, 0.5);
}

.mem-photo .hint-letter {
  position: absolute;
  bottom: 4px; right: 4px;
  background: rgba(14, 148, 135, 0.9);
  color: #fff;
  font-size: 12px;
  padding: 2px 7px;
  border-radius: 8px;
  font-weight: 800;
  letter-spacing: 0;
}

.mem-info {
  text-align: start;
  min-width: 60px;
  flex: 1;
}

.mem-name {
  font-weight: 700;
  color: var(--c-navy);
  font-size: 17px;
  letter-spacing: -0.2px;
}

.mem-meta {
  font-size: 12.5px;
  color: var(--c-slate);
  margin-top: 3px;
  line-height: 1.4;
}

html[lang="ar"] .mem-name,
html[lang="ar"] .mem-meta {
  font-family: var(--f-ar);
}

/* ACTION ROW */
.action-area {
  position: relative;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 14px 22px 40px;
  flex-shrink: 0;
}

.action-row {
  display: flex;
  gap: 10px;
  justify-content: center;
  align-items: center;
  width: 100%;
  max-width: 320px;
}

.talk-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 28px;
  background: var(--g-brand);
  color: #fff;
  border-radius: var(--r-pill);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.2px;
  box-shadow: 0 10px 24px rgba(14, 148, 135, 0.35);
  transition: all 0.25s ease;
  flex: 1;
  position: relative;
  overflow: hidden;
}

.talk-btn::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
  transition: left 0.7s ease;
}

.talk-btn:hover::before { left: 100%; }

.talk-btn:hover:not(.disabled) {
  transform: translateY(-2px);
  box-shadow: 0 14px 30px rgba(14, 148, 135, 0.45);
}

.talk-btn:active:not(.disabled) { transform: scale(0.97); }

.talk-btn svg {
  width: 18px; height: 18px;
  stroke: #fff; stroke-width: 2.2; fill: none;
  stroke-linecap: round; stroke-linejoin: round;
  flex-shrink: 0;
}

.talk-btn.disabled {
  opacity: 0.45;
  pointer-events: none;
}

.talk-btn.listening {
  background: linear-gradient(135deg, #EF4444, #F87171);
  box-shadow: 0 10px 24px rgba(239, 68, 68, 0.4);
  animation: talkPulse 1.4s ease-in-out infinite;
}

@keyframes talkPulse {
  0%, 100% { box-shadow: 0 10px 24px rgba(239, 68, 68, 0.4), 0 0 0 0 rgba(239, 68, 68, 0.5); }
  50% { box-shadow: 0 10px 24px rgba(239, 68, 68, 0.5), 0 0 0 12px rgba(239, 68, 68, 0); }
}

html[lang="ar"] .talk-btn { font-family: var(--f-ar); font-size: 15.5px; }

.forgot-btn {
  padding: 13px 20px;
  border-radius: var(--r-pill);
  background: rgba(255, 255, 255, 0.9);
  border: 1.5px solid var(--c-border);
  color: var(--c-slate);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.1px;
  transition: all 0.25s ease;
  flex-shrink: 0;
  white-space: nowrap;
}

.forgot-btn:hover {
  border-color: var(--c-warning);
  color: #B45309;
  background: rgba(251, 191, 36, 0.08);
}

.forgot-btn:active { transform: scale(0.96); }

.forgot-btn.hidden { display: none; }

html[lang="ar"] .forgot-btn { font-family: var(--f-ar); font-size: 13.5px; }

/* TRANSCRIPT LINK */
.transcript-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  background: transparent;
  color: var(--c-slate);
  font-size: 12px;
  font-weight: 500;
  border-radius: var(--r-pill);
  transition: all 0.2s ease;
}

.transcript-btn:hover {
  color: var(--c-primary);
  background: rgba(14, 148, 135, 0.06);
}

.transcript-btn svg {
  width: 13px; height: 13px;
  stroke: currentColor;
  stroke-width: 2.2; fill: none;
  stroke-linecap: round; stroke-linejoin: round;
}

html[lang="ar"] .transcript-btn { font-family: var(--f-ar); font-size: 12.5px; }

/* TEXT INPUT (fallback for no speech) */
.text-input-wrap {
  width: 100%;
  max-width: 320px;
  display: none;
  align-items: center;
  gap: 8px;
  padding: 6px 6px 6px 16px;
  background: #fff;
  border: 1.5px solid rgba(14, 148, 135, 0.2);
  border-radius: var(--r-pill);
  box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
}

.text-input-wrap.show { display: flex; }

.text-input-wrap input {
  flex: 1;
  border: none;
  outline: none;
  background: transparent;
  font-size: 14px;
  font-weight: 500;
  color: var(--c-navy);
  padding: 8px 0;
}

.text-input-wrap input::placeholder { color: #94A3B8; font-weight: 400; }

html[lang="ar"] .text-input-wrap input {
  font-family: var(--f-ar);
  font-size: 15px;
}

.text-send {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: var(--g-brand);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 6px 16px rgba(14, 148, 135, 0.3);
  transition: transform 0.2s ease;
}

.text-send:hover { transform: scale(1.08); }
.text-send:active { transform: scale(0.94); }

.text-send svg {
  width: 16px; height: 16px;
  stroke: #fff; stroke-width: 2.4; fill: none;
  stroke-linecap: round; stroke-linejoin: round;
}

html[dir="rtl"] .text-send svg { transform: scaleX(-1); }

/* SHEET (shared style for transcript + persona) */
.sheet-overlay {
  position: absolute;
  inset: 0;
  background: rgba(15, 23, 42, 0.4);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 40;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease;
}

.sheet-overlay.show {
  opacity: 1;
  pointer-events: auto;
}

.sheet {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  background: #fff;
  border-radius: 28px 28px 0 0;
  max-height: 70%;
  display: flex;
  flex-direction: column;
  z-index: 50;
  transform: translateY(100%);
  transition: transform 0.45s cubic-bezier(0.34, 1.2, 0.64, 1);
  box-shadow: 0 -20px 60px rgba(15, 23, 42, 0.18);
  overflow: hidden;
}

.sheet.show { transform: translateY(0); }

.sheet-handle {
  width: 44px; height: 5px;
  background: var(--c-border);
  border-radius: var(--r-pill);
  margin: 12px auto 6px;
  flex-shrink: 0;
}

.sheet-header {
  padding: 4px 22px 12px;
  border-bottom: 1px solid var(--c-border);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  flex-shrink: 0;
}

.sheet-title-wrap {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
}

.sheet-title {
  font-size: 15px;
  font-weight: 800;
  color: var(--c-navy);
  letter-spacing: -0.3px;
}

html[lang="ar"] .sheet-title {
  font-family: var(--f-ar);
  font-size: 16px;
  letter-spacing: 0;
}

.sheet-sub {
  font-size: 11.5px;
  color: var(--c-slate);
  font-weight: 500;
}

html[lang="ar"] .sheet-sub {
  font-family: var(--f-ar);
  font-size: 12.5px;
}

.sheet-close {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: rgba(14, 148, 135, 0.08);
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s ease;
  flex-shrink: 0;
}

.sheet-close:hover {
  background: rgba(14, 148, 135, 0.15);
  transform: rotate(90deg);
}

.sheet-close svg {
  width: 13px; height: 13px;
  stroke: var(--c-slate); stroke-width: 2.4; fill: none;
  stroke-linecap: round;
}

/* TRANSCRIPT BODY */
.transcript-body {
  flex: 1;
  overflow-y: auto;
  scrollbar-width: none;
  padding: 14px 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 0;
}

.transcript-body::-webkit-scrollbar { display: none; }

.t-line {
  display: flex;
  gap: 8px;
  animation: lineIn 0.35s ease;
}

@keyframes lineIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.t-line.ai { align-items: flex-start; }
.t-line.me { align-items: flex-start; flex-direction: row-reverse; }

.t-bubble {
  max-width: 78%;
  padding: 10px 14px;
  border-radius: 16px;
  font-size: 13px;
  font-weight: 500;
  line-height: 1.5;
  letter-spacing: 0.1px;
}

html[lang="ar"] .t-bubble {
  font-family: var(--f-ar);
  font-size: 14px;
  letter-spacing: 0;
}

.t-line.ai .t-bubble {
  background: linear-gradient(135deg, rgba(14, 148, 135, 0.08), rgba(46, 196, 182, 0.06));
  border: 1px solid rgba(14, 148, 135, 0.15);
  color: var(--c-navy);
  border-top-left-radius: 4px;
}

.t-line.me .t-bubble {
  background: var(--g-brand);
  color: #fff;
  border-top-right-radius: 4px;
  box-shadow: 0 6px 16px rgba(14, 148, 135, 0.22);
}

/* PERSONA GRID */
.persona-grid {
  flex: 1;
  overflow-y: auto;
  scrollbar-width: none;
  padding: 16px 18px 24px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  min-height: 0;
}

.persona-grid::-webkit-scrollbar { display: none; }

.persona-card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 14px 10px 12px;
  background: #FFFBF5;
  border: 2px solid var(--c-border);
  border-radius: var(--r-lg);
  transition: all 0.3s cubic-bezier(0.65, 0, 0.35, 1);
  cursor: pointer;
  overflow: hidden;
}

.persona-card:hover {
  border-color: rgba(14, 148, 135, 0.35);
  transform: translateY(-2px);
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
}

.persona-card.active {
  border-color: transparent;
  background:
    linear-gradient(#FFFBF5, #FFFBF5) padding-box,
    var(--g-brand) border-box;
  border: 2px solid transparent;
  box-shadow: 0 10px 26px rgba(14, 148, 135, 0.2);
}

.persona-card-avatar {
  width: 76px; height: 76px;
  border-radius: 50%;
  overflow: hidden;
  background: radial-gradient(circle at 50% 35%, #fff, #DFF7F2 72%);
  flex-shrink: 0;
}

.persona-card-avatar svg { width: 100%; height: 100%; display: block; }

.persona-card.active .persona-card-avatar {
  box-shadow: 0 0 0 3px rgba(14, 148, 135, 0.25);
}

.persona-card-name {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--c-navy);
  letter-spacing: -0.1px;
}

html[lang="ar"] .persona-card-name {
  font-family: var(--f-ar);
  font-size: 14.5px;
  letter-spacing: 0;
}

.persona-card-label {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--c-slate);
  padding: 2px 9px;
  background: rgba(14, 148, 135, 0.08);
  border-radius: var(--r-pill);
}

.persona-card.active .persona-card-label {
  background: var(--g-brand);
  color: #fff;
}

html[lang="ar"] .persona-card-label {
  font-family: var(--f-ar);
  font-size: 11.5px;
}

.persona-card-check {
  position: absolute;
  top: 8px; right: 8px;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--c-success);
  display: none;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(34, 197, 94, 0.4);
  animation: checkPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

html[dir="rtl"] .persona-card-check {
  right: auto;
  left: 8px;
}

.persona-card.active .persona-card-check { display: flex; }

@keyframes checkPop {
  0% { transform: scale(0); }
  100% { transform: scale(1); }
}

.persona-card-check svg {
  width: 13px; height: 13px;
  stroke: #fff; stroke-width: 3.5; fill: none;
  stroke-linecap: round; stroke-linejoin: round;
}

/* END OVERLAY */
.end-overlay {
  position: absolute;
  inset: 0;
  background: rgba(15, 23, 42, 0.35);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 30px;
  animation: fadeIn 0.3s ease;
}

.end-overlay.show { display: flex; }

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.end-card {
  background: #fff;
  border-radius: var(--r-xl);
  padding: 26px 22px 20px;
  max-width: 320px;
  width: 100%;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 14px;
  animation: cardPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 20px 60px rgba(15, 23, 42, 0.25);
}

@keyframes cardPop {
  0% { transform: scale(0.85); opacity: 0; }
  60% { transform: scale(1.04); opacity: 1; }
  100% { transform: scale(1); }
}

.end-icon {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: linear-gradient(135deg, #0E9487, #2EC4B6);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto;
  box-shadow: 0 12px 30px rgba(14, 148, 135, 0.35);
}

.end-icon svg {
  width: 30px; height: 30px;
  stroke: #fff; stroke-width: 2.4; fill: none;
  stroke-linecap: round; stroke-linejoin: round;
}

.end-title {
  font-size: 19px;
  font-weight: 800;
  color: var(--c-navy);
  letter-spacing: -0.3px;
}

html[lang="ar"] .end-title {
  font-family: var(--f-ar);
  font-size: 18px;
  letter-spacing: 0;
}

.end-desc {
  font-size: 12.5px;
  color: var(--c-slate);
  line-height: 1.55;
  font-weight: 500;
}

html[lang="ar"] .end-desc {
  font-family: var(--f-ar);
  font-size: 13.5px;
}

.end-stats {
  display: flex;
  gap: 8px;
  justify-content: center;
}

.end-stat {
  flex: 1;
  padding: 12px 8px;
  background: #F8FAFC;
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-md);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  min-width: 0;
}

.end-stat-value {
  font-size: 18px;
  font-weight: 800;
  color: var(--c-primary);
  font-feature-settings: "tnum";
  letter-spacing: -0.4px;
  line-height: 1;
}

.end-stat-label {
  font-size: 9.5px;
  font-weight: 700;
  color: var(--c-slate);
  letter-spacing: 0.4px;
  text-transform: uppercase;
  text-align: center;
}

html[lang="ar"] .end-stat-label {
  font-family: var(--f-ar);
  text-transform: none;
  letter-spacing: 0;
  font-size: 10.5px;
}

.end-btn {
  width: 100%;
  padding: 14px;
  background: var(--g-brand);
  color: #fff;
  font-size: 14.5px;
  font-weight: 700;
  border-radius: var(--r-md);
  box-shadow: 0 10px 24px rgba(14, 148, 135, 0.3);
  transition: transform 0.2s ease, box-shadow 0.25s ease;
  display: flex; align-items: center; justify-content: center;
  gap: 8px;
}

.end-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 32px rgba(14, 148, 135, 0.4);
}

.end-btn:active { transform: scale(0.97); }

.end-btn svg {
  width: 15px; height: 15px;
  stroke: #fff; stroke-width: 2.4; fill: none;
  stroke-linecap: round; stroke-linejoin: round;
}

html[lang="ar"] .end-btn { font-family: var(--f-ar); font-size: 15.5px; }

/* REDUCED MOTION */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

<body>

<div class="stage">
  <div class="phone">

      <!-- END OVERLAY -->

          <div class="end-stats">

              <div class="end-stat-label" id="statDurationLabel">Time</div>

          <button class="end-btn" id="endDoneBtn">

          </button>
        </div>

    </div>
  </div>
</div>

<script>
/* ============================================
   TRANSLATIONS
============================================ */
const I18N = {

    endTitle: 'Well done!',
    endDesc: 'Your memory worked nicely today. See you soon.',
    durationLabel: 'Time',
    turnsLabel: 'Remembered',
    backHome: 'Back to Home',
    noSpeechSupport: 'Type your answer below',
    change: 'Change',
    personaSheetTitle: 'Change companion',
    personaSheetSub: 'Pick who you want to talk with today',
    labelKid: 'Child',
    labelAdult: 'Adult',
    labelElder: 'Older',
    greetM: 'Good morning',
    greetE: 'Good evening',
    intro: "{g}, {name}! I'm {ai}, and I'll be with you today. Let's remember the people and places you love, together.",
    noMemoryBank: 'Your Memory Bank is still empty. Add your first person and I will be right here.',

  },
  ar: {

    listening: 'سامعك…',
    tapToTalk: 'اتكلم',
    stopTalk: 'إيقاف',
    typeAnswer: 'اكتب ردك',
    forgot: 'مش فاكر',
    end: 'نكمل بعدين',
    transcriptLabel: 'شوف الكلام',
    sheetTitle: 'كلامنا',
    inputPlaceholder: 'اكتب ردك هنا…',
    endTitle: 'برافو عليك!',
    endDesc: 'ذاكرتك اشتغلت حلو النهاردة. أشوفك قريب.',
    durationLabel: 'المدة',
    turnsLabel: 'افتكرت',
    backHome: 'رجوع للرئيسية',
    noSpeechSupport: 'اكتب ردك تحت',
    change: 'تغيير',
    personaSheetTitle: 'غيّر صاحبك',
    personaSheetSub: 'اختار اللي تحب تكلمه النهاردة',
    labelKid: 'طفل',
    labelAdult: 'بالغ',
    labelElder: 'كبير',
    greetM: 'صباح الخير',
    greetE: 'مساء الخير',
    intro: '{g} يا {name}! أنا {ai}، وهكون معاك النهاردة. تعالى نفتكر سوا الناس والأماكن اللي بتحبها.',
    noMemoryBank: 'بنك الذكريات لسه فاضي. ضيف أول شخص وأنا معاك.',
    qWho: 'بص على الصورة دي. فاكر دي مين؟',
    qPlace: 'فاكر المكان ده؟ اسمه إيه؟',
    qEvent: 'فاكر اللحظة دي؟ إيه هي؟',
    good: ['برافو عليك! فعلًا ده {n}.', 'صح! ده {n}. ذاكرتك شغالة حلو.'],
    close: 'قريب جدًا! الاسم بيبدأ بحرف «{h}».',
    hint: 'جرب تاني، خد وقتك. الاسم بيبدأ بحرف «{h}».',
    unsure: 'مفيش مشكلة خالص، خد وقتك. الاسم بيبدأ بحرف «{h}».',
    reveal: 'ده {n}. مش مشكلة، هنفتكره سوا المرة الجاية.',
    nice: ['حلو أوي إنك فاكر. واضح إن {n} ليه مكان كبير عندك.', 'شكرًا إنك حكيتلي عن {n}.'],
    skip: 'مفيش مشكلة، هنرجعله مع بعض.',
    skipBtn: 'ولا يهمك، هنعدي دي دلوقتي.',
    bye: 'كان وقت حلو معاك يا {name}. نكمل بعدين.'
  }
};

/* ============================================
   LANGUAGE
============================================ */
const STORAGE_KEY = 'omega_lang';
let currentLang = localStorage.getItem(STORAGE_KEY) || 'en';
const htmlEl = document.documentElement;

/* ============================================
   STATE
============================================ */
const state = {
  isMuted: false,
  isListening: false,
  isAISpeaking: false,
  callStartTime: null,
  timerInterval: null,
  turns: 0,
  transcript: [],
  memoryItems: [],
  usedIndices: new Set(),
  isEnded: false,
  speechSupported: false,
  recognition: null,
  currentQuestion: null,
  recalled: 0,
  maxQ: 5,
  persona: null,
  userAge: 0
};

const $ = id => document.getElementById(id);

/* ============================================
   HELPERS
============================================ */
function getRandomUnused(items, key) {
  const available = items.filter((_, i) => !state.usedIndices.has(key + i));
  if (available.length === 0) {
    state.usedIndices.clear();
    return items[Math.floor(Math.random() * items.length)];
  }
  const idx = Math.floor(Math.random() * available.length);
  const picked = available[idx];
  const originalIdx = items.indexOf(picked);
  state.usedIndices.add(key + originalIdx);
  return picked;
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

/* ============================================
   LOAD MEMORY BANK
============================================ */
function loadMemoryBank() {
  function getItems(cat) {
    try {
      const arr = JSON.parse(localStorage.getItem('omega_bank_' + cat) || '[]');
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }
  const people = getItems('people').map(p => ({ ...p, type: 'person' }));
  const places = getItems('places').map(p => ({ ...p, type: 'place' }));
  const events = getItems('events').map(p => ({ ...p, type: 'event' }));

  state.memoryItems = [...people, ...places, ...events].filter(x => x && x.name);
}

/* ============================================
   TIMER (internal, not shown)
============================================ */
function startTimer() {
  state.callStartTime = Date.now();
}

function stopTimer() {
  return Math.floor((Date.now() - state.callStartTime) / 1000);
}

/* ============================================
   TRANSCRIPT
============================================ */
function addTranscriptLine(role, text) {
  state.transcript.push({ role, text, time: Date.now() });
  const body = $('transcriptBody');
  const line = document.createElement('div');
  line.className = `t-line ${role === 'ai' ? 'ai' : 'me'}`;
  line.innerHTML = `<div class="t-bubble">${escapeHtml(text)}</div>`;
  body.appendChild(line);
  body.scrollTop = body.scrollHeight;
  setCaption(role, text);
}

/* ============================================
   SPEECH SYNTHESIS
============================================ */
function speak(text, callback) {
  if (!('speechSynthesis' in window) || state.isMuted) {
    const delay = Math.max(1200, text.length * 45);
    state.isAISpeaking = true;
    setAISpeakingUI(true);
    setTimeout(() => {
      state.isAISpeaking = false;
      setAISpeakingUI(false);
      if (callback) callback();
    }, delay);
    return;
  }

  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = currentLang === 'ar' ? 'ar-EG' : 'en-US';
  const F = FACES[state.persona] || {};
  utter.rate = (F.rate || 0.95) * (state.userAge >= 60 ? 0.92 : 1);
  utter.pitch = F.pitch || 1;

  const voices = window.speechSynthesis.getVoices();
  const langVoices = voices.filter(v => v.lang.startsWith(currentLang === 'ar' ? 'ar' : 'en'));
  const gRe = F.g === 'f'
    ? /salma|hoda|zira|female|samantha|susan|sara|laila|amira|fiona|karen/i
    : /shakir|maged|tarik|david|mark|male|daniel|alex/i;
  utter.voice = langVoices.find(v => gRe.test(v.name)) || langVoices[0] || null;

  state.isAISpeaking = true;
  setAISpeakingUI(true);

  utter.onend = () => {
    state.isAISpeaking = false;
    setAISpeakingUI(false);
    if (callback) callback();
  };
  utter.onerror = () => {
    state.isAISpeaking = false;
    setAISpeakingUI(false);
    if (callback) callback();
  };

  window.speechSynthesis.speak(utter);
}

function setAISpeakingUI(isSpeaking) {
  const wrap = $('avatarWrap');
  const pulse = $('pulse');
  const status = $('statusText');

  if (isSpeaking) {
    wrap.classList.add('speaking');
    pulse.classList.add('active');
    status.textContent = I18N[currentLang].aiSpeaking;
    disableTalkBtn();
  } else {
    wrap.classList.remove('speaking');
    pulse.classList.remove('active');
  }
}

/* ============================================
   SPEECH RECOGNITION
============================================ */
function initSpeechRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    state.speechSupported = false;
    $('textInputWrap').classList.add('show');
    $('talkBtn').style.display = 'none';
    return;
  }

  state.speechSupported = true;
  const rec = new SR();
  rec.continuous = false;
  rec.interimResults = false;
  rec.lang = currentLang === 'ar' ? 'ar-EG' : 'en-US';

  rec.onresult = (e) => {
    const text = e.results[0][0].transcript.trim();
    if (text) handleUserAnswer(text);
  };

  rec.onerror = (e) => {
    console.warn('Speech error:', e.error);
    state.isListening = false;
    setListeningUI(false);
  };

  rec.onend = () => {
    state.isListening = false;
    setListeningUI(false);
  };

  state.recognition = rec;
}

function startListening() {
  if (!state.speechSupported || state.isListening || state.isAISpeaking || state.isEnded) return;
  if (!state.currentQuestion) return;

  try {
    state.recognition.lang = currentLang === 'ar' ? 'ar-EG' : 'en-US';
    state.recognition.start();
    state.isListening = true;
    setListeningUI(true);
  } catch (e) {
    console.warn(e);
  }
}

function stopListening() {
  if (state.recognition && state.isListening) {
    try { state.recognition.stop(); } catch (e) {}
    state.isListening = false;
    setListeningUI(false);
  }
}

function setListeningUI(isOn) {
  const btn = $('talkBtn');
  const pulse = $('pulse');
  const status = $('statusText');
  const wrap = $('avatarWrap');

  if (isOn) {
    btn.classList.add('listening');

    $('talkLabel').textContent = I18N[currentLang].stopTalk;

  } else {
    btn.classList.remove('listening');
    pulse.classList.remove('active');
    wrap.classList.remove('speaking');
    if (state.currentQuestion) status.textContent = I18N[currentLang].yourTurn;
    $('talkLabel').textContent = I18N[currentLang].tapToTalk;
    $('talkIcon').innerHTML = '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>';
  }
}

function enableTalkBtn() {

}

function disableTalkBtn() {

             <path d="M148 ${headY - 16} C150 ${headY - 30} 140 ${headY - 36} 130 ${headY - 34} C138 ${headY - 22} 140 ${headY - 10} 140 ${headY + 2}Z" fill="${f.hair}"/>`;

      <path d="M${100 - 10} ${mouthY + 18} q10 4 20 0" stroke="#A9795A" stroke-width="1.2" fill="none" opacity=".3" stroke-linecap="round"/>

    <path d="M${100 + eyeX - 10} ${eyeY - 14}Q${100 + eyeX} ${eyeY - 20} ${100 + eyeX + 10} ${eyeY - 14}" stroke="${browColor(f)}" stroke-width="${isKid ? 2.5 : 3}" fill="none" stroke-linecap="round"/>
    <g class="eyes">
      <circle cx="${100 - eyeX}" cy="${eyeY}" r="${eyeR}" fill="#1F2937"/>

function pickPersona() {
  let age = 0, g = '';
  if (localStorage.getItem('omega_account_type') === 'caregiver') {
    try {
      const arr = JSON.parse(localStorage.getItem('omega_care_persons') || '[]');
      const id = localStorage.getItem('omega_current_person_id');
      const p = arr.find(x => String(x.id) === String(id)) || arr[0] || {};
      age = parseInt(p.age) || 0;
      g = String(p.gender || '');
    } catch (e) {}
  } else {
    age = parseInt(localStorage.getItem('omega_user_age') || localStorage.getItem('omega_age')) || 0;
    g = localStorage.getItem('omega_gender') || localStorage.getItem('omega_user_gender') || '';
  }
  state.userAge = age;
  const saved = localStorage.getItem('omega_avatar_persona');
  if (FACES[saved]) return saved;

  // Kids get a kid-like friend; everyone else a warm adult
  const gender = g.toLowerCase().startsWith('m') ? 'm' : 'f';
  return (age && age < 13 ? 'kid_' : 'adult_') + gender;
}

function setPersona(key, save) {
  state.persona = key;
  const f = FACES[key];
  $('avatarWrap').innerHTML = buildFace(f);
  $('personaMini').innerHTML = buildFace(f);
  $('callName').textContent = f.n[currentLang];
  $('personaLabel').textContent = f.n[currentLang];
  if (save) {
    try { localStorage.setItem('omega_avatar_persona', key); } catch (e) {}
  }
}

}

/* ============================================
   MEMORY CARD
============================================ */
function showCard(item, reveal, hint) {
  const hide = !reveal;
  const ph = $('memPhoto');
  ph.innerHTML = '';
  ph.classList.toggle('hidden', hide);

  const typeIcon = { person: '؟', place: '📍', event: '🎉' }[item.type] || '?';

  if (item.photo && !hide) {
    const img = new Image();
    img.src = item.photo;
    img.alt = '';
    ph.appendChild(img);
  } else if (item.photo && hide) {
    // Show a blurred/darkened photo for hidden person
    const img = new Image();
    img.src = item.photo;
    img.alt = '';
    img.style.filter = 'blur(8px) brightness(0.6)';
    ph.appendChild(img);
    if (hint) {
      const h = document.createElement('div');
      h.className = 'hint-letter';
      h.textContent = item.name.charAt(0);
      ph.appendChild(h);
    }
  } else {
    ph.textContent = hide ? typeIcon : (item.name || '?').charAt(0);
    if (hide && hint) {
      const h = document.createElement('div');
      h.className = 'hint-letter';
      h.textContent = item.name.charAt(0);
      ph.appendChild(h);
    }
  }

  $('memName').textContent = hide ? '?' : item.name;
  $('memMeta').textContent = hide ? '' : (item.meta || '');
  $('memCard').classList.add('show');
  $('memCard').classList.remove('correct', 'revealed');
}

function markCardCorrect() {
  $('memCard').classList.remove('revealed');
  $('memCard').classList.add('correct');
}

function markCardRevealed() {
  $('memCard').classList.remove('correct');
  $('memCard').classList.add('revealed');
}

/* ============================================
   PROGRESS DOTS
============================================ */
function renderProgress() {
  const container = $('progressDots');
  container.innerHTML = '';
  for (let i = 0; i < state.maxQ; i++) {
    const dot = document.createElement('span');
    dot.className = 'progress-dot';
    if (i < state.turns - 1) dot.classList.add('done');
    else if (i === state.turns - 1) dot.classList.add('current');
    container.appendChild(dot);
  }
}

/* ============================================
   CONVERSATION FLOW
============================================ */
const norm = s => String(s || '').toLowerCase()
  .replace(/[\u064B-\u0652\u0640]/g, '')
  .replace(/[أإآ]/g, 'ا')
  .replace(/ى/g, 'ي')
  .replace(/ة/g, 'ه')
  .replace(/[^\p{L}\p{N}\s]/gu, ' ')
  .replace(/\s+/g, ' ')
  .trim();

const UNSURE = /(مش فاكر|مش عارف|معرفش|ما اعرفش|نسيت|مش متاكد|dont know|don t know|do not know|not sure|no idea|forgot|cant remember|can t remember)/;

const fmt = (str, v) => str.replace(/\{(\w+)\}/g, (_, k) => (v[k] == null ? '' : v[k]));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function say(text, cb) {
  addTranscriptLine('ai', text);
  speak(text, cb);
}

function openMic() {
  if (state.isEnded) return;
  enableTalkBtn();
  $('forgotBtn').classList.remove('hidden');
  $('statusText').textContent = I18N[currentLang].yourTurn;
}

function closeMic() {
  disableTalkBtn();
  $('forgotBtn').classList.add('hidden');
}

function startConversation() {
  const t = I18N[currentLang];
  const userName = localStorage.getItem('omega_user_name')
    || (currentLang === 'ar' ? 'يا صديقي' : 'friend');

  if (state.memoryItems.length === 0) {
    say(t.noMemoryBank, () => setTimeout(endCall, 800));
    return;
  }

  state.maxQ = Math.min(5, state.memoryItems.length);
  const g = new Date().getHours() < 12 ? t.greetM : t.greetE;
  say(fmt(t.intro, { g, name: userName, ai: FACES[state.persona].n[currentLang] }), () => {
    setTimeout(askNextQuestion, 600);
  });
}

function askNextQuestion() {
  if (state.isEnded) return;
  if (state.turns >= state.maxQ) {
    finishSession();
    return;
  }

  const t = I18N[currentLang];
  const item = getRandomUnused(state.memoryItems, 'item');

  // Build question text based on type — ALL test name recall
  let text;
  if (item.type === 'person') text = t.qWho;
  else if (item.type === 'place') text = t.qPlace;
  else if (item.type === 'event') text = t.qEvent;
  else text = t.qWho;

  state.currentQuestion = { text, item, tries: 0 };
  state.turns++;
  renderProgress();
  showCard(item, false, false);
  closeMic();

  say(text, () => {
    openMic();
    if (state.speechSupported && !state.isMuted) {
      setTimeout(startListening, 400);
    }
  });
}

function handleUserAnswer(text) {
  if (state.isEnded || !state.currentQuestion) return;
  state.isListening = false;
  setListeningUI(false);

  const q = state.currentQuestion;
  state.currentQuestion = null;
  addTranscriptLine('me', text);
  closeMic();

  const t = I18N[currentLang];
  const item = q.item;
  const a = norm(text);
  const v = { n: item.name, h: [...item.name][0] };

  const unsure = UNSURE.test(a) || a.length < 2;

  // Split name into tokens for matching
  const nameTokens = norm(item.name).split(' ').filter(x => x.length > 1);
  const ok = nameTokens.some(k => a.includes(k));

  let reply, next = true;

  if (unsure) {
    if (q.tries < 1) {
      q.tries++;
      state.currentQuestion = q;
      showCard(item, false, true);
      reply = fmt(t.unsure, v);
      next = false;
    } else {
      showCard(item, true, false);
      markCardRevealed();
      reply = fmt(t.reveal, v);
    }
  } else if (ok) {
    state.recalled++;
    showCard(item, true, false);
    markCardCorrect();
    reply = fmt(pick(t.good), v);
  } else {
    if (q.tries < 1) {
      q.tries++;
      state.currentQuestion = q;
      showCard(item, false, true);
      reply = fmt(t.hint, v);
      next = false;
    } else {
      showCard(item, true, false);
      markCardRevealed();
      reply = fmt(t.reveal, v);
    }
  }

  setTimeout(() => {
    say(reply, () => {
      if (next) setTimeout(askNextQuestion, 800);
      else openMic();
    });
  }, 500);
}

function handleForgot() {
  if (state.isEnded || !state.currentQuestion) return;
  stopListening();

  const q = state.currentQuestion;
  state.currentQuestion = null;
  const t = I18N[currentLang];
  const item = q.item;

  closeMic();
  addTranscriptLine('me', t.forgot);
  showCard(item, true, false);
  markCardRevealed();

  setTimeout(() => {
    say(t.skip, () => setTimeout(askNextQuestion, 800));
  }, 500);
}

function finishSession() {
  const name = localStorage.getItem('omega_user_name')
    || (currentLang === 'ar' ? 'يا صديقي' : 'friend');
  say(fmt(I18N[currentLang].bye, { name }), () => setTimeout(endCall, 700));
}

/* ============================================
   END CALL
============================================ */
function endCall() {
  if (state.isEnded) return;
  state.isEnded = true;

  if (window.speechSynthesis) window.speechSynthesis.cancel();
  stopListening();

  const duration = stopTimer();
  $('statDuration').textContent = formatTime(duration);
  $('statTurns').textContent = state.recalled + '/' + state.turns;

  $('endOverlay').classList.add('show');

  try {
    const result = {
      duration,
      turns: state.turns,
      accuracy: state.turns ? Math.round(100 * state.recalled / state.turns) : 0,
      timestamp: Date.now()
    };
    localStorage.setItem('omega_personal_memory_result', JSON.stringify(result));
  } catch (e) {}
}

============================================ */
function applyLanguage(lang) {
  currentLang = lang;
  localStorage.setItem(STORAGE_KEY, lang);
  htmlEl.lang = lang;
  htmlEl.dir = lang === 'ar' ? 'rtl' : 'ltr';

  const t = I18N[lang];
  $('talkLabel').textContent = t.tapToTalk;
  $('forgotLabel').textContent = t.forgot;
  $('personaSheetTitle').textContent = t.personaSheetTitle;
  $('personaSheetSub').textContent = t.personaSheetSub;
  $('transcriptLabel').textContent = t.transcriptLabel;
  $('sheetTitle').textContent = t.sheetTitle;
  $('textInput').placeholder = t.inputPlaceholder;
  $('endTitle').textContent = t.endTitle;
  $('endDesc').textContent = t.endDesc;
  $('statDurationLabel').textContent = t.durationLabel;
  $('statTurnsLabel').textContent = t.turnsLabel;
  $('endDoneLabel').textContent = t.backHome;

  if (state.persona) {
    $('callName').textContent = FACES[state.persona].n[lang];
    $('personaLabel').textContent = FACES[state.persona].n[lang];
  }

  if (!state.isEnded) {
    if (state.isAISpeaking) $('statusText').textContent = t.aiSpeaking;
    else if (state.isListening) $('statusText').textContent = t.listening;
    else if (state.currentQuestion) $('statusText').textContent = t.yourTurn;
    else $('statusText').textContent = t.connecting;
  }

  // Rebuild persona grid if open
  if ($('personaSheet').classList.contains('show')) {
    renderPersonaGrid();
  }
}

/* ============================================
   PERSONA GRID
============================================ */
function renderPersonaGrid() {
  const grid = $('personaGrid');
  grid.innerHTML = '';
  const t = I18N[currentLang];

  ORDER.forEach(key => {
    const f = FACES[key];
    const card = document.createElement('button');
    card.className = 'persona-card' + (key === state.persona ? ' active' : '');
    card.dataset.key = key;

    card.innerHTML = `
      <div class="persona-card-avatar">${buildFace(f)}</div>
      <div class="persona-card-name">${f.n[currentLang]}</div>
      <div class="persona-card-label">${t[f.labelKey]}</div>
      <div class="persona-card-check">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>
    `;

    card.addEventListener('click', () => {
      setPersona(key, true);
      closePersonaSheet();
      // Re-render grid to update active state
      setTimeout(renderPersonaGrid, 200);
    });

    grid.appendChild(card);
  });
}

function openPersonaSheet() {
  renderPersonaGrid();
  $('personaOverlay').classList.add('show');
  setTimeout(() => $('personaSheet').classList.add('show'), 50);
}

function closePersonaSheet() {
  $('personaSheet').classList.remove('show');
  $('personaOverlay').classList.remove('show');
}

/* ============================================
   TRANSCRIPT SHEET
============================================ */
function openTranscriptSheet() {
  $('transcriptOverlay').classList.add('show');
  setTimeout(() => $('transcriptSheet').classList.add('show'), 50);
}

function closeTranscriptSheet() {
  $('transcriptSheet').classList.remove('show');
  $('transcriptOverlay').classList.remove('show');
}

/* ============================================
   EVENT BINDINGS
============================================ */
$('talkBtn').addEventListener('click', () => {
  if (state.isEnded) return;
  if (!state.currentQuestion) return;

  if (state.isListening) {
    stopListening();
  } else {
    startListening();
  }
});

$('forgotBtn').addEventListener('click', handleForgot);

$('closeBtn').addEventListener('click', endCall);

$('endDoneBtn').addEventListener('click', () => {
  window.location.href = 'home.html';
});

$('personaBtn').addEventListener('click', openPersonaSheet);
$('personaClose').addEventListener('click', closePersonaSheet);
$('personaOverlay').addEventListener('click', closePersonaSheet);

$('transcriptBtn').addEventListener('click', openTranscriptSheet);
$('sheetClose').addEventListener('click', closeTranscriptSheet);
$('transcriptOverlay').addEventListener('click', closeTranscriptSheet);

// Text input fallback
$('textSend').addEventListener('click', () => {
  const v = $('textInput').value.trim();
  if (v) {
    handleUserAnswer(v);
    $('textInput').value = '';
  }
});

$('textInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    $('textSend').click();
  }
});

/* ============================================
   VOICES LOADED
============================================ */
if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => {};
}

/* ============================================
   INIT
============================================ */
function init() {
  setPersona(pickPersona(), false);
  applyLanguage(currentLang);
  loadMemoryBank();
  initSpeechRecognition();
  startTimer();

  if (!state.speechSupported) {
    setTimeout(() => {
      $('statusText').textContent = I18N[currentLang].noSpeechSupport;
    }, 500);
  }

  setTimeout(startConversation, 900);
}

init();

window.addEventListener('beforeunload', () => {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  stopListening();
});
</script>

</body>
</html>

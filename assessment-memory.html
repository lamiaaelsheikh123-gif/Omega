<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Omega — Memory Assessment</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --c-primary: #0E9487; --c-light: #2EC4B6; --c-blue: #3B82F6;
  --c-success: #22C55E; --c-error: #EF4444;
  --c-navy: #0F172A; --c-slate: #64748B; --c-bg: #F8FAFC; --c-card: #FFF;
  --g-brand: linear-gradient(135deg, #0E9487 0%, #2EC4B6 45%, #3B82F6 100%);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'Poppins', sans-serif; background: #E2E8F0; overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent; }
html[lang="ar"] body { font-family: 'Cairo', sans-serif; }
button { font-family: inherit; cursor: pointer; border: 0; background: none; }

/* Phone Frame */
.stage { height: 100%; display: flex; align-items: center; justify-content: center; padding: 20px; }
.phone { position: relative; width: 375px; height: 812px; max-height: calc(100vh - 40px); border-radius: 44px; overflow: hidden; background: var(--c-bg); box-shadow: 0 0 0 10px #1a1a1a, 0 0 0 12px #2a2a2a, 0 40px 80px rgba(0,0,0,.35); }
@media (max-width: 480px) { .stage { padding: 0; } .phone { width: 100vw; height: 100vh; max-height: 100vh; border-radius: 0; box-shadow: none; } }

/* Screen Layout */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: linear-gradient(180deg, #F8FAFC 0%, #E2E8F0 100%); overflow: hidden; }

/* Header */
header { position: relative; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 52px 24px 10px; flex-shrink: 0; }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; background: #fff; border: 1px solid #E2E8F0; display: flex; align-items: center; justify-content: center; color: var(--c-slate); font-weight: 700; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
.progress-bar { display: flex; gap: 6px; }
.progress-bar span { width: 24px; height: 8px; border-radius: 10px; background: #CBD5E1; transition: all 0.3s; }
.progress-bar span.active { background: var(--c-primary); width: 32px; }
.progress-bar span.done { background: var(--c-blue); }

/* Main Content (responsive: scrolls instead of clipping on small screens) */
main { position: relative; z-index: 10; flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: safe center; padding: 0 24px 32px; overflow-y: auto; overflow-x: hidden; }
@media (max-height: 700px) { header { padding-top: 28px; } }

/* Text Instructions */
.instruction-box { text-align: center; margin-bottom: 24px; min-height: 60px; display: flex; align-items: center; justify-content: center; }
.instruction-box h2 { font-size: clamp(16px, 4.8vw, 20px); font-weight: 800; color: var(--c-navy); line-height: 1.4; }

/* Buttons */
.btn { display: flex; align-items: center; justify-content: center; text-align: center; width: 100%; max-width: 300px; padding: 16px 18px; border-radius: 16px; background: var(--g-brand); color: #fff; font-weight: 700; font-size: 16px; line-height: 1.3; box-shadow: 0 10px 24px rgba(14, 148, 135, 0.3); transition: transform 0.2s; margin-top: 20px; flex-shrink: 0; }
.btn:active { transform: scale(0.96); }
.btn:disabled { background: #CBD5E1; box-shadow: none; cursor: not-allowed; }

/* GAME 1: TABLE */
.table-area { position: relative; width: 100%; height: 220px; border-radius: 20px; background: linear-gradient(135deg, #EAB308, #CA8A04); box-shadow: inset 0 -8px 0 rgba(0,0,0,0.15), 0 12px 24px rgba(0,0,0,0.15); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 14px; padding: 20px; overflow: hidden; }
.table-item { font-size: 48px; filter: drop-shadow(0 8px 8px rgba(0,0,0,0.25)); animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) backwards; }
.cloth { position: absolute; inset: 0; background: repeating-linear-gradient(45deg, #0E9487, #0E9487 15px, #2EC4B6 15px, #2EC4B6 30px); transform: translateY(-101%); transition: transform 0.7s cubic-bezier(0.65, 0, 0.35, 1); display: flex; align-items: center; justify-content: center; }
.cloth.drop { transform: translateY(0); }
.timer-bar { width: 100%; height: 6px; background: #E2E8F0; border-radius: 10px; overflow: hidden; margin-top: 16px; }
.timer-bar i { display: block; height: 100%; width: 100%; background: var(--c-primary); animation: drain 5s linear forwards; }

/* OPTIONS GRID */
.options-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; margin-top: 10px; }
.opt-btn { aspect-ratio: 1; background: #fff; border: 2px solid #E2E8F0; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 34px; box-shadow: 0 4px 10px rgba(0,0,0,0.04); transition: all 0.2s; }
.opt-btn.selected { border-color: var(--c-primary); background: #F0FDFA; transform: scale(1.05); }
.opt-btn.correct { border-color: var(--c-success); background: #DCFCE7; }
.opt-btn.wrong { border-color: var(--c-error); background: #FEE2E2; }

/* GAME 2: LANTERNS */
.lanterns-grid { display: flex; gap: 16px; justify-content: center; width: 100%; margin-top: 10px; }
.lantern { width: 65px; height: 85px; border-radius: 40% 40% 20% 20%; display: flex; align-items: center; justify-content: center; font-size: 32px; box-shadow: 0 8px 0 rgba(0,0,0,0.15), 0 10px 20px rgba(0,0,0,0.1); transition: all 0.3s; }
.lantern.light-up { transform: translateY(-10px) scale(1.1); box-shadow: 0 0 30px currentColor, 0 0 60px currentColor; filter: brightness(1.3); }
.sequence-hint { font-size: 24px; letter-spacing: 8px; color: var(--c-primary); height: 30px; margin-top: 20px; font-weight: 800; text-align: center;}

/* GAME 3: PICK & PLACE (Put It Back) */
.shelf { width: min(100%, 300px, 40vh); background: #CBD5E1; padding: 8px; border-radius: 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.slot { aspect-ratio: 1; background: #fff; border: 2px solid #E2E8F0; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: clamp(24px, 7vh, 36px); transition: all 0.2s; }
.slot.empty { background: #F1F5F9; border-style: dashed; }
.slot.good { border-color: var(--c-success); background: #DCFCE7; }
.slot.reveal { border-color: #F59E0B; background: #FEF3C7; }
.tray { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: min(100%, 300px); min-height: 66px; margin-top: 14px; padding: 8px; border-radius: 16px; background: #fff; border: 2px solid #E2E8F0; }
.titem { width: 48px; height: 48px; border-radius: 12px; background: #F8FAFC; border: 2px solid #E2E8F0; display: flex; align-items: center; justify-content: center; font-size: 28px; cursor: grab; touch-action: none; }
.titem.sel { border-color: var(--c-primary); background: #F0FDFA; transform: scale(1.08); }
.slot .titem { width: 100%; height: 100%; border: 0; background: transparent; border-radius: 10px; }
.ghost { position: fixed; z-index: 90; pointer-events: none; font-size: 42px; transform: translate(-50%, -50%) scale(1.2); }

/* 🟢 INTERSTITIAL (Transition) — responsive */
.interstitial { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: clamp(10px, 2.5vh, 20px); width: 100%; animation: fadeUp 0.5s; }
.avatar-circle { width: min(200px, 28vh, 60vw); height: min(200px, 28vh, 60vw); border-radius: 50%; overflow: hidden; box-shadow: 0 15px 40px rgba(15,23,42,0.15); border: 5px solid #fff; background: #E2E8F0; flex-shrink: 0; }
.avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
.interstitial h2 { font-size: clamp(20px, 6vw, 26px); font-weight: 800; color: var(--c-navy); line-height: 1.3; }
.interstitial p { font-size: clamp(14px, 4vw, 16px); color: var(--c-slate); line-height: 1.5; max-width: 100%; width: 280px; }
.interstitial .btn { margin-top: 4px; }

/* Animations */
@keyframes float { 50% { transform: translateY(-10px); } }
@keyframes popIn { from { transform: scale(0); opacity: 0; } }
@keyframes drain { to { width: 0; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
</style>
</head>
<body>
<div class="stage"><div class="phone"><div class="screen" id="screen">
  
  <header>
    <button class="icon-btn" id="exitBtn">✕</button>
    <div class="progress-bar" id="progress">
      <span class="active"></span><span></span><span></span>
    </div>
    <button class="icon-btn" id="langBtn" style="font-size:12px;">ع</button>
  </header>

  <main id="main"></main>

</div></div></div>

<script>
/* ============================================================
   ⚠️⚠️⚠️ مكان الصور بتاعتك (للتسقيفة) ⚠️⚠️⚠️
   - clap: صور التسقيفة (بتتبدل كل 250 مللي ثانية)
   - encourage: الصور التشجيعية (بتتبدل كل 800 مللي ثانية)
============================================================ */
const AVATAR_IMAGES = {
  adult: {
    clap: ['الكبار تسقيفه 1.jpg', 'الكبار تسقيفه 2.jpg'],
    // 👇 [حطي هنا الصورتين التشجيعية للكبار]
    encourage: ['الكبير جاب اقل من 50.jpg', 'الكبير جاب اقل من 50.jpg'] 
  },
  kid: {
    clap: ['اطفال تسقيفه 1.jpg', 'اطفال تسقيفه مقفوله.jpg'],
    // 👇 [حطي هنا الصورتين التشجيعية للأطفال]
    encourage: ['الصغير جاب اقل من 50.jpg', 'الصغير جاب اقل من 50.jpg'] 
  }
};
/* ============================================================ */

const I18N = {
  en: {
    startTitle: "Memory Challenge",
    startDesc: "Test your visual memory through 3 quick interactive games.",
    startBtn: "Start Challenge",
    
    r1Look: "Study the table carefully...",
    r1Pick: "Select the 6 items that were on the table.",
    
    r2Look: "Watch the sequence of lanterns...",
    r2Pick: "Tap the lanterns in the exact same order.",
    
    r3Look: "Memorize where each item sits on the shelf...",
    r3Pick: "Put each item back in its place. Drag it, or tap it then tap the slot.",
    
    done: "Confirm",
    finTitle: "Challenge Complete",
    next: "Next Challenge",
    exitMsg: "Exit? Progress will be lost.",
    
    transGreat: "Great Job!",
    transGreatDesc: "You did really well on this challenge. Keep it up!",
    transEncourage: "Good Effort!",
    transEncourageDesc: "Every practice makes you stronger. Let's continue!"
  },
  ar: {
    startTitle: "تحدي الذاكرة",
    startDesc: "اختبر ذاكرتك البصرية من خلال 3 ألعاب تفاعلية سريعة.",
    startBtn: "ابدأ التحدي",
    
    r1Look: "بص على الطاولة كويس...",
    r1Pick: "اختار الـ6 حاجات اللي كانوا على الطاولة.",
    
    r2Look: "بص على ترتيب الفوانيس...",
    r2Pick: "دوس على الفوانيس بنفس الترتيب بالظبط.",
    
    r3Look: "احفظ مكان كل حاجة على الرف...",
    r3Pick: "رجّع كل حاجة لمكانها. اسحبها، أو دوس عليها وبعدين على الخانة.",
    
    done: "تأكيد",
    finTitle: "خلصت التحدي",
    next: "التحدي الجاي",
    exitMsg: "هل تريد الخروج؟ ستفقد تقدمك.",
    
    transGreat: "شغل عالي!",
    transGreatDesc: "أداءك كان ممتاز في التحدي ده. استمر!",
    transEncourage: "محاولة جيدة!",
    transEncourageDesc: "كل تدريب بيخليك أقوى. يلا نكمل!"
  }
};

let lang = localStorage.getItem('omega_lang') === 'ar' ? 'ar' : 'en';
const $ = id => document.getElementById(id);
const EMOJIS = ['🎂','🎈','🎁','🕯️','🧁','🍬','🍕','🥤','🎩','🍭','🍪','🧸'];
const COLORS = ['#EF4444', '#3B82F6', '#22C55E', '#FBBF24'];
const FREQS = [392, 494, 587, 659];
const SHELF_ITEMS = ['🥤','🍭','🧁','🍇','🍿','🍩','🥛','🍒','🍪','🧃','🍫','🍓'];

let round = 1, score = 0, total = 0;
let R1_ITEMS = [], R2_SEQ = [];
let audioCtx = null;
let token = 0;

const shuf = a => [...a].sort(() => Math.random() - 0.5);
const sample = (a, n) => shuf(a).slice(0, n);
const wait = ms => { const t = token; return new Promise((ok, no) => setTimeout(() => t === token ? ok() : no('cancel'), ms)); };
const click = el => new Promise(r => { el.onclick = () => r(); });

function updateProgress() {
  document.querySelectorAll('.progress-bar span').forEach((el, i) => {
    el.className = i + 1 < round ? 'done' : (i + 1 === round ? 'active' : '');
  });
}

function updateLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  $('langBtn').textContent = lang === 'ar' ? 'EN' : 'ع';
}

function playTone(freq) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
  } catch(e) {}
}

/* --- Start --- */
function startGame() {
  token++; round = 1; score = 0; total = 0;
  updateLang(); updateProgress();
  $('main').innerHTML = `
    <div class="interstitial">
      <div style="font-size:80px; animation: float 3s infinite;">🧠</div>
      <h2>${I18N[lang].startTitle}</h2>
      <p>${I18N[lang].startDesc}</p>
      <button class="btn" id="startBtn">${I18N[lang].startBtn}</button>
    </div>
  `;
  $('startBtn').onclick = round1_Table;
}

/* --- GAME 1: TABLE --- */
function round1_Table() {
  round = 1; updateProgress();
  R1_ITEMS = [...EMOJIS].sort(() => Math.random() - 0.5).slice(0, 6);
  
  $('main').innerHTML = `
    <div class="instruction-box"><h2>${I18N[lang].r1Look}</h2></div>
    <div class="table-area" id="table">
      ${R1_ITEMS.map((e, i) => `<span class="table-item" style="animation-delay:${i*0.1}s">${e}</span>`).join('')}
      <div class="cloth" id="cloth"></div>
    </div>
    <div class="timer-bar"><i></i></div>
  `;

  setTimeout(() => $('cloth').classList.add('drop'), 5000);

  setTimeout(() => {
    $('main').innerHTML = `
      <div class="instruction-box"><h2>${I18N[lang].r1Pick}</h2></div>
      <div class="options-grid" id="grid"></div>
      <button class="btn" id="doneBtn" disabled>${I18N[lang].done}</button>
    `;
    
    const distractors = EMOJIS.filter(e => !R1_ITEMS.includes(e)).sort(() => Math.random() - 0.5).slice(0, 6);
    const options = [...R1_ITEMS, ...distractors].sort(() => Math.random() - 0.5);
    const selected = new Set();

    $('grid').innerHTML = options.map(e => `<button class="opt-btn" data-e="${e}">${e}</button>`).join('');

    document.querySelectorAll('.opt-btn').forEach(btn => {
      btn.onclick = () => {
        const e = btn.dataset.e;
        if (selected.has(e)) { selected.delete(e); btn.classList.remove('selected'); }
        else if (selected.size < 6) { selected.add(e); btn.classList.add('selected'); }
        $('doneBtn').disabled = selected.size !== 6;
      };
    });

    $('doneBtn').onclick = () => {
      let correct = 0;
      document.querySelectorAll('.opt-btn').forEach(btn => {
        const e = btn.dataset.e; btn.disabled = true;
        if (R1_ITEMS.includes(e)) {
          btn.classList.add('correct');
          if (selected.has(e)) correct++;
        } else if (selected.has(e)) btn.classList.add('wrong');
      });
      score += correct; total += 6;
      $('doneBtn').style.display = 'none';
      setTimeout(round2_Lanterns, 2000);
    };
  }, 6000);
}

/* --- GAME 2: LANTERNS --- */
function round2_Lanterns() {
  round = 2; updateProgress();
  R2_SEQ = Array.from({length: 4}, () => Math.floor(Math.random() * 4));
  
  $('main').innerHTML = `
    <div class="instruction-box"><h2>${I18N[lang].r2Look}</h2></div>
    <div class="lanterns-grid" id="l-grid">
      ${COLORS.map((c, i) => `<div class="lantern" data-i="${i}" style="background: ${c}; color: ${c};">🏮</div>`).join('')}
    </div>
    <div class="sequence-hint" id="hint"></div>
  `;

  let step = 0;
  function playSeq() {
    if (step >= R2_SEQ.length) {
      setTimeout(() => {
        $('main').querySelector('.instruction-box h2').textContent = I18N[lang].r2Pick;
        enableInput();
      }, 500);
      return;
    }
    const idx = R2_SEQ[step];
    const el = document.querySelector(`.lantern[data-i="${idx}"]`);
    el.classList.add('light-up'); playTone(FREQS[idx]);
    setTimeout(() => {
      el.classList.remove('light-up');
      step++; setTimeout(playSeq, 300);
    }, 500);
  }
  setTimeout(playSeq, 1000);

  function enableInput() {
    let p = 0, correct = 0;
    $('hint').textContent = '○'.repeat(4);
    document.querySelectorAll('.lantern').forEach(el => {
      el.onclick = () => {
        if (p >= 4) return;
        const idx = +el.dataset.i;
        el.classList.add('light-up'); playTone(FREQS[idx]);
        setTimeout(() => el.classList.remove('light-up'), 300);

        if (idx === R2_SEQ[p]) correct++;
        p++; $('hint').textContent = '●'.repeat(p) + '○'.repeat(4 - p);

        if (p === 4) {
          score += correct; total += 4;
          document.querySelectorAll('.lantern').forEach(l => l.onclick = null);
          setTimeout(round3_PutBack, 2000); // نروح لتحدي Pick & Place
        }
      };
    });
  }
}

/* --- GAME 3: PICK & PLACE (Put It Back) --- */
async function round3_PutBack() {
  round = 3; updateProgress();
  const myToken = ++token;
  try {
    const n = 6, T = 8, total9 = 9;
    const items = sample(SHELF_ITEMS, n);
    const slotIdx = sample([...Array(total9).keys()], n);

    const shelfHTML = show => `<div class="shelf" id="shelf">${Array.from({length: total9}, (_, i) => {
      const k = slotIdx.indexOf(i);
      return `<div class="slot ${show ? '' : 'empty'}" data-i="${i}">${show && k >= 0 ? items[k] : ''}</div>`;
    }).join('')}</div>`;

    // Look phase
    $('main').innerHTML = `
      <div class="instruction-box"><h2>${I18N[lang].r3Look}</h2></div>
      ${shelfHTML(true)}
      <div class="timer-bar" style="width:min(100%,300px)"><i style="animation-duration:${T}s"></i></div>
    `;
    await wait(T * 1000);

    // Place phase
    $('main').innerHTML = `
      <div class="instruction-box" style="margin-bottom:14px"><h2>${I18N[lang].r3Pick}</h2></div>
      ${shelfHTML(false)}
      <div class="tray" id="tray">${shuf(items).map(e => `<div class="titem" data-e="${e}">${e}</div>`).join('')}</div>
      <button class="btn" id="dn" disabled>${I18N[lang].done}</button>
    `;

    const slots = [...document.querySelectorAll('.slot')], tray = $('tray');
    let sel = null;
    const refresh = () => { $('dn').disabled = tray.querySelectorAll('.titem').length > 0; };
    const put = (it, s) => {
      const old = s.querySelector('.titem');
      if (old && old !== it) tray.appendChild(old);
      s.appendChild(it); s.classList.remove('empty');
      slots.forEach(x => { if (!x.querySelector('.titem')) x.classList.add('empty'); });
      it.classList.remove('sel'); sel = null; refresh();
    };
    const wire = t => {
      t.onpointerdown = e => {
        e.preventDefault();
        const sx = e.clientX, sy = e.clientY; let ghost = null;
        try { t.setPointerCapture(e.pointerId); } catch (_) {}
        t.onpointermove = ev => {
          if (!ghost && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 8) {
            ghost = document.createElement('div'); ghost.className = 'ghost'; ghost.textContent = t.dataset.e;
            document.body.appendChild(ghost); t.style.opacity = .3;
          }
          if (ghost) { ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px'; }
        };
        t.onpointerup = ev => {
          t.onpointermove = null; t.onpointerup = null;
          if (ghost) {
            ghost.remove(); t.style.opacity = '';
            const el = document.elementFromPoint(ev.clientX, ev.clientY), s = el && el.closest('.slot');
            if (s) put(t, s);
          } else {
            document.querySelectorAll('.titem').forEach(x => x.classList.remove('sel'));
            sel = t; t.classList.add('sel');
          }
        };
      };
    };
    document.querySelectorAll('.titem').forEach(wire);
    slots.forEach(s => s.onclick = ev => {
      if (sel && ev.target.closest('.slot') === s && !ev.target.classList.contains('titem')) put(sel, s);
    });

    await click($('dn'));
    $('dn').style.display = 'none';
    let r = 0;
    slots.forEach(s => {
      const t = s.querySelector('.titem'); if (!t) return;
      t.onpointerdown = null;
      const k = items.indexOf(t.dataset.e);
      if (slotIdx[k] === +s.dataset.i) { r++; s.classList.add('good'); } else s.classList.add('reveal');
    });
    score += r; total += n;
    await wait(2000);
    showResults();
  } catch (e) { if (e !== 'cancel') console.error(e); }
}

/* --- RESULTS & TRANSITION (Interstitial) --- */
async function showResults() {
  const accuracy = Math.round((score / total) * 100);
  localStorage.setItem('omega_memory_result', JSON.stringify({ accuracy, timestamp: Date.now() }));

  round = 4; updateProgress(); // Fill progress bar

  // Determine if passed (>= 50%)
  const passed = accuracy >= 50;
  
  // Get user age to pick avatar
  let age = parseInt(localStorage.getItem('omega_user_age') || localStorage.getItem('omega_age')) || 0;
  const avatarType = (age > 0 && age <= 12) ? 'kid' : 'adult';
  
  // Setup Interstitial UI
  $('main').innerHTML = `
    <div class="interstitial">
      <div class="avatar-circle" id="avatarBox">
        <img id="avatarImg" src="" alt="Avatar">
      </div>
      <h2 id="transTitle"></h2>
      <p id="transDesc"></p>
      <button class="btn" id="nextBtn" style="display:none;">${I18N[lang].next}</button>
    </div>
  `;

  let imgIndex = 0;
  let interval = null;
  const imgEl = $('avatarImg');

  if (passed) {
    $('transTitle').textContent = I18N[lang].transGreat;
    $('transDesc').textContent = `${I18N[lang].transGreatDesc} (${accuracy}%)`;
    
    // Clapping Animation
    const clapImgs = AVATAR_IMAGES[avatarType].clap;
    imgEl.src = clapImgs[0];
    interval = setInterval(() => {
      imgIndex = (imgIndex + 1) % 2;
      imgEl.src = clapImgs[imgIndex];
    }, 250);
    
  } else {
    $('transTitle').textContent = I18N[lang].transEncourage;
    $('transDesc').textContent = `${I18N[lang].transEncourageDesc} (${accuracy}%)`;
    
    // Encouraging Animation (Placeholder)
    const encourageImgs = AVATAR_IMAGES[avatarType].encourage;
    imgEl.src = encourageImgs[0];
    interval = setInterval(() => {
      imgIndex = (imgIndex + 1) % 2;
      imgEl.src = encourageImgs[imgIndex];
    }, 800); // Slower transition for sad/encouraging
  }

  // Show button after 2.5 seconds
  setTimeout(() => {
    if(interval) clearInterval(interval);
    // Stop on last image
    imgEl.src = passed ? AVATAR_IMAGES[avatarType].clap[0] : AVATAR_IMAGES[avatarType].encourage[0];
    $('nextBtn').style.display = 'flex';
    $('nextBtn').onclick = () => window.location.href = 'assessment-attention.html';
  }, 2500);
}

/* --- EVENTS --- */
$('langBtn').onclick = () => { lang = lang === 'ar' ? 'en' : 'ar'; startGame(); };
$('exitBtn').onclick = () => { if (confirm(I18N[lang].exitMsg)) window.location.href = 'assessment-intro.html'; };

startGame();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Omega — Visual Assessment</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --c-primary: #0E9487; --c-light: #2EC4B6; --c-blue: #3B82F6;
  --c-success: #22C55E; --c-error: #EF4444; --c-warning: #FBBF24;
  --c-navy: #0F172A; --c-slate: #64748B; --c-bg: #F8FAFC;
  --g-brand: linear-gradient(135deg, #0E9487 0%, #2EC4B6 45%, #3B82F6 100%);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'Poppins', sans-serif; background: #E2E8F0; overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent; }
html[lang="ar"] body { font-family: 'Cairo', sans-serif; }
button { font-family: inherit; cursor: pointer; border: 0; background: none; }

/* Phone Frame */
.stage { height: 100%; display: flex; align-items: center; justify-content: center; padding: 20px; }
.phone { position: relative; width: 375px; height: 812px; max-height: calc(100vh - 40px); border-radius: 44px; overflow: hidden; background: var(--c-bg); box-shadow: 0 0 0 10px #1a1a1a, 0 0 0 12px #2a2a2a, 0 40px 80px rgba(0,0,0,.35); }
@media (max-width: 480px) { .stage { padding: 0; } .phone { width: 100vw; height: 100vh; max-height: 100vh; border-radius: 0; box-shadow: none; } }

/* Screen Layout */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: linear-gradient(180deg, #F8FAFC 0%, #E2E8F0 100%); overflow: hidden; }

/* Header */
header { position: relative; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 52px 20px 10px; flex-shrink: 0; }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; background: #fff; border: 1px solid #E2E8F0; display: flex; align-items: center; justify-content: center; color: var(--c-slate); font-weight: 700; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
.progress-bar { display: flex; gap: 6px; }
.progress-bar span { width: 24px; height: 8px; border-radius: 10px; background: #CBD5E1; transition: all 0.3s; }
.progress-bar span.active { background: var(--c-primary); width: 32px; }
.progress-bar span.done { background: var(--c-blue); }

/* Main Content */
main { position: relative; z-index: 10; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 16px 20px; min-height: 0; overflow-y: auto; scrollbar-width: none; }
main::-webkit-scrollbar { display: none; }

/* Common UI */
.instruction-box { text-align: center; margin-bottom: 15px; min-height: 40px; display: flex; align-items: center; justify-content: center; padding: 0 10px; flex-shrink: 0; }
.instruction-box h2 { font-size: clamp(16px, 5vw, 20px); font-weight: 800; color: var(--c-navy); line-height: 1.3; }
.btn { width: 100%; max-width: 300px; padding: 16px; border-radius: 16px; background: var(--g-brand); color: #fff; font-weight: 700; font-size: clamp(14px, 4vw, 16px); box-shadow: 0 10px 24px rgba(14, 148, 135, 0.3); transition: transform 0.2s; margin-top: 15px; flex-shrink: 0; }
.btn:active { transform: scale(0.96); }
.game-container { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 15px; animation: fadeUp 0.4s ease; }

/* 🟢 GAME 1: MEMORY MATCH */
.mem-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 300px; margin-top: 10px; }
.m-card { aspect-ratio: 3/4; position: relative; perspective: 800px; cursor: pointer; }
.m-card-inner { position: absolute; width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
.m-card.flipped .m-card-inner, .m-card.matched .m-card-inner { transform: rotateY(180deg); }
.m-front, .m-back { position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
.m-front { background: var(--g-brand); color: #fff; font-size: 24px; }
.m-back { background: #fff; border: 2px solid var(--c-primary); transform: rotateY(180deg); }
.m-card.matched { pointer-events: none; opacity: 0; transform: scale(0.8); transition: all 0.5s; }

/* 🟢 GAME 2: MISSING PIECE */
.missing-container { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
.pattern-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: #CBD5E1; padding: 6px; border-radius: 16px; width: 240px; height: 240px; }
.p-cell { border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
.p-cell.empty { border: 2px dashed #94A3B8; background: #F8FAFC; }
.options-grid { display: flex; gap: 12px; justify-content: center; }
.opt-piece { width: 60px; height: 60px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 34px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: all 0.2s; border: 2px solid transparent; }
.opt-piece:active { transform: scale(0.9); }
.opt-piece.wrong { animation: shake 0.3s; border-color: var(--c-error); }

/* 🟢 GAME 3: MIRROR IMAGE */
.mirror-container { display: flex; flex-direction: column; align-items: center; gap: 30px; width: 100%; }
.target-shape { width: 120px; height: 120px; background: #fff; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 80px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
.mirror-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; width: 100%; max-width: 240px; }
.m-opt { width: 100%; aspect-ratio: 1; background: #fff; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 50px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: all 0.2s; border: 2px solid transparent; }
.m-opt:active { transform: scale(0.9); }
.m-opt.wrong { animation: shake 0.3s; border-color: var(--c-error); }

/* 🟢 INTERSTITIAL (Final) */
.interstitial { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 15px; width: 100%; animation: fadeUp 0.5s; padding: 0 10px; }
.avatar-circle { width: clamp(160px, 50vw, 220px); height: clamp(160px, 50vw, 220px); border-radius: 50%; overflow: hidden; box-shadow: 0 15px 40px rgba(15,23,42,0.15); border: 5px solid #fff; background: #E2E8F0; flex-shrink: 0; }
.avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
.interstitial h2 { font-size: clamp(20px, 6vw, 26px); font-weight: 800; color: var(--c-navy); }
.interstitial p { font-size: clamp(14px, 4vw, 16px); color: var(--c-slate); line-height: 1.5; max-width: 280px; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
</style>
</head>
<body>
<div class="stage"><div class="phone"><div class="screen" id="screen">
  
  <header>
    <button class="icon-btn" id="exitBtn">✕</button>
    <div class="progress-bar" id="progress">
      <span class="active"></span><span></span><span></span>
    </div>
    <button class="icon-btn" id="langBtn" style="font-size:12px;">ع</button>
  </header>

  <main id="main"></main>

</div></div></div>

<script>
/* ============================================================
   ⚠️⚠️⚠️ مكان الصور بتاعتك (التسقيفة والتشجيع) ⚠️⚠️⚠️
============================================================ */
const AVATAR_IMAGES = {
  adult: {
    clap: ['الكبار تسقيفه 1.jpg', 'الكبار تسقيفه 2.jpg'], 
    encourage: ['adult_encourage_1.jpg', 'adult_encourage_2.jpg'] 
  },
  kid: {
    clap: ['اطفال تسقيفه 1.jpg', 'اطفال تسقيفه مقفوله.jpg'], 
    encourage: ['kid_encourage_1.jpg', 'kid_encourage_2.jpg'] 
  }
};
/* ============================================================ */

const I18N = {
  en: {
    startTitle: "Visual Challenge",
    startDesc: "Test your visual memory and spatial reasoning.",
    startBtn: "Start Challenge",
    nextBtn: "Next Game",
    
    g1Desc: "Find the matching pairs. Every match removes 2 cards!",
    g2Desc: "Which piece completes the pattern?",
    g3Desc: "Which one is the correct mirror image?",
    
    finTitle: "Assessment Complete",
    transGreat: "Sharp eyes!",
    transGreatDesc: "You have excellent visual perception!",
    transEncourage: "Good Effort!",
    transEncourageDesc: "Visual puzzles need practice. Let's keep going!"
  },
  ar: {
    startTitle: "التحدي البصري",
    startDesc: "اختبر ذاكرتك البصرية وقدرتك على التخيل.",
    startBtn: "ابدأ التحدي",
    nextBtn: "اللعبة التالية",
    
    g1Desc: "لاقي الكروت المتطابقة. كل تطابق بيشيل كارتين!",
    g2Desc: "أي قطعة بتكمل النمط؟",
    g3Desc: "أي واحدة هي الانعكاس الصحيح في المرآة؟",
    
    finTitle: "اكتمل التقييم",
    transGreat: "عيون حادة!",
    transGreatDesc: "إدراكك البصري ممتاز!",
    transEncourage: "محاولة جيدة!",
    transEncourageDesc: "الألغاز البصرية محتاجة تدريب. يلا نكمل!"
  }
};

let lang = localStorage.getItem('omega_lang') === 'ar' ? 'ar' : 'en';
let currentGameIndex = 0;
let totalScore = 0;

const $ = id => document.getElementById(id);

function updateProgress() {
  const container = $('progress');
  container.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const span = document.createElement('span');
    if (i < currentGameIndex) span.className = 'done';
    else if (i === currentGameIndex) span.className = 'active';
    container.appendChild(span);
  }
}

function updateLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  $('langBtn').textContent = lang === 'ar' ? 'EN' : 'ع';
}

function nextGame(score) {
  totalScore += (score || 0);
  currentGameIndex++;
  if (currentGameIndex < 3) {
    loadGame(currentGameIndex);
  } else {
    showResults();
  }
}

/* ============================================
   GAME DEFINITIONS
============================================ */
const GAMES = [
  // 1. MEMORY MATCH (Cards)
  {
    render: () => `
      <div class="instruction-box"><h2>${I18N[lang].g1Desc}</h2></div>
      <div class="game-container">
        <div class="mem-grid" id="memGrid"></div>
        <button class="btn" id="checkBtn" style="display:none; margin-top:20px;">${I18N[lang].nextBtn}</button>
      </div>
    `,
    init: () => {
      const emojis = ['🦊', '🐼', '🦁', '🐸', '🐧', '🦋']; // 6 pairs = 12 cards
      const deck = [...emojis, ...emojis].sort(() => Math.random() - 0.5);
      
      let flipped = [];
      let matched = 0;
      let lock = false;

      const grid = $('memGrid');
      grid.innerHTML = deck.map((e, i) => `
        <div class="m-card" data-i="${i}" data-e="${e}">
          <div class="m-card-inner">
            <div class="m-front">?</div>
            <div class="m-back">${e}</div>
          </div>
        </div>
      `).join('');

      grid.querySelectorAll('.m-card').forEach(card => {
        card.onclick = () => {
          if (lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;
          
          card.classList.add('flipped');
          flipped.push(card);

          if (flipped.length === 2) {
            lock = true;
            if (flipped[0].dataset.e === flipped[1].dataset.e) {
              // Match!
              setTimeout(() => {
                flipped[0].classList.add('matched');
                flipped[1].classList.add('matched');
                flipped = [];
                lock = false;
                matched++;
                if (matched === 6) {
                  $('checkBtn').style.display = 'inline-flex';
                  $('checkBtn').onclick = () => nextGame(1);
                }
              }, 500);
            } else {
              // Wrong
              setTimeout(() => {
                flipped[0].classList.remove('flipped');
                flipped[1].classList.remove('flipped');
                flipped = [];
                lock = false;
              }, 800);
            }
          }
        };
      });
    }
  },

  // 2. MISSING PIECE
  {
    render: () => `
      <div class="instruction-box"><h2>${I18N[lang].g2Desc}</h2></div>
      <div class="game-container missing-container">
        <div class="pattern-grid" id="patternGrid"></div>
        <div class="options-grid" id="optionsGrid"></div>
        <button class="btn" id="checkBtn" style="display:none; margin-top:20px;">${I18N[lang].nextBtn}</button>
      </div>
    `,
    init: () => {
      // Pattern: Rows have specific emojis
      // Row 1: 🍎 🍎 🍎
      // Row 2: 🍌 🍌 🍌
      // Row 3: 🍇 🍇 🍇 (Missing the last one)
      
      const grid = $('patternGrid');
      const optionsGrid = $('optionsGrid');
      
      const pattern = ['🍎','🍎','🍎', '🍌','🍌','🍌', '🍇','🍇','?'];
      const answer = '🍇';
      
      grid.innerHTML = pattern.map((p, i) => 
        `<div class="p-cell ${p === '?' ? 'empty' : ''}" id="cell-${i}">${p === '?' ? '' : p}</div>`
      ).join('');

      const opts = ['🍎', '🍌', '🍇', '🍓'].sort(() => Math.random() - 0.5);
      
      optionsGrid.innerHTML = opts.map(o => 
        `<div class="opt-piece" onclick="checkMissing('${o}', this)">${o}</div>`
      ).join('');

      window.checkMissing = (o, el) => {
        if (o === answer) {
          el.style.borderColor = 'var(--c-success)';
          $('cell-8').textContent = answer;
          $('cell-8').classList.remove('empty');
          $('cell-8').style.background = '#DCFCE7';
          
          setTimeout(() => {
            $('checkBtn').style.display = 'inline-flex';
            $('checkBtn').onclick = () => nextGame(1);
          }, 500);
        } else {
          el.classList.add('wrong');
          setTimeout(() => el.classList.remove('wrong'), 500);
        }
      };
    }
  },

  // 3. MIRROR IMAGE
  {
    render: () => `
      <div class="instruction-box"><h2>${I18N[lang].g3Desc}</h2></div>
      <div class="game-container mirror-container">
        <div class="target-shape" style="transform: rotate(-15deg);">🐕</div>
        <div class="mirror-options" id="mirrorOptions">
          <!-- Correct Answer: Mirrored -->
          <div class="m-opt" onclick="checkMirror('correct', this)">🐕</div>
          <!-- Wrong Answers -->
          <div class="m-opt" onclick="checkMirror('wrong', this)" style="transform: scaleX(-1);">🐕</div>
          <div class="m-opt" onclick="checkMirror('wrong', this)" style="transform: rotate(180deg);">🐕</div>
          <div class="m-opt" onclick="checkMirror('wrong', this)" style="transform: rotate(90deg);">🐕</div>
        </div>
        <button class="btn" id="checkBtn" style="display:none; margin-top:20px;">${I18N[lang].nextBtn}</button>
      </div>
    `,
    init: () => {
      // Wait, the logic here is slightly flawed. 
      // The target is tilted -15deg. The mirror image should be tilted +15deg.
      // Let's fix the target and options to make it obvious.
      // Actually, to make it simple, let's use an asymmetrical shape like "F".
      // But an emoji is nicer. Let's use an arrow pointing diagonally.
      
      // I will rewrite the render for Game 3 to be cleaner.
      const targetContainer = document.querySelector('.target-shape');
      targetContainer.innerHTML = '↗️';
      targetContainer.style.transform = 'none';
      targetContainer.style.fontSize = '80px';

      const opts = $('mirrorOptions');
      // Correct mirror of ↗️ is ↖️
      opts.innerHTML = `
        <div class="m-opt" onclick="checkMirror('wrong', this)">↗️</div>
        <div class="m-opt" onclick="checkMirror('correct', this)">↖️</div>
        <div class="m-opt" onclick="checkMirror('wrong', this)">↘️</div>
        <div class="m-opt" onclick="checkMirror('wrong', this)">↙️</div>
      `;
      
      window.checkMirror = (type, el) => {
        if (type === 'correct') {
          el.style.borderColor = 'var(--c-success)';
          setTimeout(() => {
            $('checkBtn').style.display = 'inline-flex';
            $('checkBtn').onclick = () => nextGame(1);
          }, 500);
        } else {
          el.classList.add('wrong');
          setTimeout(() => el.classList.remove('wrong'), 500);
        }
      };
    }
  }
];

/* ============================================
   CORE LOGIC
============================================ */
function loadGame(index) {
  updateProgress();
  const game = GAMES[index];
  $('main').innerHTML = game.render();
  game.init();
}

function startGame() {
  updateLang();
  currentGameIndex = 0;
  totalScore = 0;
  $('main').innerHTML = `
    <div class="interstitial">
      <div style="font-size:80px; animation: float 3s infinite;">👁️</div>
      <h2>${I18N[lang].startTitle}</h2>
      <p>${I18N[lang].startDesc}</p>
      <button class="btn" id="startBtn">${I18N[lang].startBtn}</button>
    </div>
  `;
  $('startBtn').onclick = () => loadGame(0);
}

function showResults() {
  updateProgress();
  
  const accuracy = 85; // Placeholder for passing
  localStorage.setItem('omega_visual_result', JSON.stringify({ accuracy, timestamp: Date.now() }));

  const passed = accuracy >= 50;
  let age = parseInt(localStorage.getItem('omega_user_age') || localStorage.getItem('omega_age')) || 0;
  const avatarType = (age > 0 && age <= 12) ? 'kid' : 'adult';
  
  $('main').innerHTML = `
    <div class="interstitial">
      <div class="avatar-circle" id="avatarBox">
        <img id="avatarImg" src="" alt="Avatar">
      </div>
      <h2 id="transTitle"></h2>
      <p id="transDesc"></p>
      <button class="btn" id="nextBtn" style="opacity:0; pointer-events:none;">${I18N[lang].nextBtn}</button>
    </div>
  `;

  let imgIndex = 0;
  let interval = null;
  const imgEl = $('avatarImg');

  if (passed) {
    $('transTitle').textContent = I18N[lang].transGreat;
    $('transDesc').textContent = I18N[lang].transGreatDesc;
    
    const clapImgs = AVATAR_IMAGES[avatarType].clap;
    imgEl.src = clapImgs[0];
    interval = setInterval(() => {
      imgIndex = (imgIndex + 1) % 2;
      imgEl.src = clapImgs[imgIndex];
    }, 250);
  } else {
    $('transTitle').textContent = I18N[lang].transEncourage;
    $('transDesc').textContent = I18N[lang].transEncourageDesc;
    
    const encourageImgs = AVATAR_IMAGES[avatarType].encourage;
    imgEl.src = encourageImgs[0];
    interval = setInterval(() => {
      imgIndex = (imgIndex + 1) % 2;
      imgEl.src = encourageImgs[imgIndex];
    }, 800);
  }

  setTimeout(() => {
    if(interval) clearInterval(interval);
    imgEl.src = passed ? AVATAR_IMAGES[avatarType].clap[0] : AVATAR_IMAGES[avatarType].encourage[0];
    
    const nextBtn = $('nextBtn');
    nextBtn.style.transition = 'opacity 0.4s';
    nextBtn.style.opacity = '1';
    nextBtn.style.pointerEvents = 'auto';
    
    nextBtn.onclick = () => {
      window.location.href = 'assessment-reasoning.html';
    };
  }, 2500);
}

/* --- EVENTS --- */
$('langBtn').onclick = () => { lang = lang === 'ar' ? 'en' : 'ar'; startGame(); };
$('exitBtn').onclick = () => { if (confirm("Exit? Progress will be lost.")) window.location.href = 'assessment-intro.html'; };

startGame();
</script>
</body>
</html>

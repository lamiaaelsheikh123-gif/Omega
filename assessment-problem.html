<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F8FAFC" />
<title>Omega — Problem Solving Assessment</title>

<!-- ✅ سكريبت اللغة قبل أي رسم -->
<script>
  (function () {
    try {
      var lang = localStorage.getItem('omega_lang') || 'en';
      var html = document.documentElement;
      html.lang = lang;
      html.dir  = lang === 'ar' ? 'rtl' : 'ltr';
    } catch (e) {}
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --c-primary: #0E9487; --c-light: #2EC4B6; --c-blue: #3B82F6;
  --c-success: #22C55E; --c-error: #EF4444; --c-warning: #FBBF24;
  --c-navy: #0F172A; --c-slate: #64748B; --c-bg: #F8FAFC;
  --g-brand: linear-gradient(135deg, #0E9487 0%, #2EC4B6 45%, #3B82F6 100%);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%; font-family: 'Poppins', sans-serif; background: #E2E8F0; overflow: hidden;
  user-select: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
html[lang="ar"] body { font-family: 'Cairo', sans-serif; }

button {
  font-family: inherit; cursor: pointer; border: 0; background: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}

/* Phone Frame */
.stage { height: 100vh; height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 20px; background: #E2E8F0; }
.phone { position: relative; width: 375px; height: 812px; max-height: calc(100dvh - 40px); border-radius: 44px; overflow: hidden; background: var(--c-bg); box-shadow: 0 0 0 10px #1a1a1a, 0 0 0 12px #2a2a2a, 0 40px 80px rgba(0,0,0,.35); }
@media (max-width: 480px) {
  body { background: var(--c-bg); }
  .stage { padding: 0; background: var(--c-bg); }
  .phone { width: 100vw; height: 100dvh; max-height: 100dvh; border-radius: 0; box-shadow: none; }
}

/* Screen Layout */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: linear-gradient(180deg, #F8FAFC 0%, #E2E8F0 100%); overflow: hidden; }

/* Header */
header { position: relative; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 52px 20px 10px; flex-shrink: 0; }
@media (max-width: 480px) { header { padding-top: max(20px, env(safe-area-inset-top)); } }

.icon-btn { width: 44px; height: 44px; border-radius: 50%; background: #fff; border: 1px solid #E2E8F0; display: flex; align-items: center; justify-content: center; color: var(--c-slate); font-weight: 700; font-size: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
.icon-btn:active { transform: scale(0.95); }

.progress-bar { display: flex; gap: 6px; }
.progress-bar span { width: 24px; height: 8px; border-radius: 10px; background: #CBD5E1; transition: all 0.3s; }
.progress-bar span.active { background: var(--c-primary); width: 32px; }
.progress-bar span.done { background: var(--c-blue); }

/* Main Content */
main { position: relative; z-index: 5; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 16px 100px; min-height: 0; overflow-y: auto; scrollbar-width: none; }
main::-webkit-scrollbar { display: none; }

/* Fixed Footer for Button */
.footer { position: absolute; bottom: 0; left: 0; width: 100%; z-index: 20; padding: 16px 20px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 20px)); background: linear-gradient(to top, var(--c-bg) 80%, rgba(248,250,252,0)); display: flex; flex-direction: column; gap: 10px; }

/* Common UI */
.instruction-box { text-align: center; margin-bottom: 12px; min-height: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 10px; flex-shrink: 0; gap: 6px; }
.instruction-box h2 { font-size: clamp(16px, 5vw, 20px); font-weight: 800; color: var(--c-navy); line-height: 1.3; }

.timer-text { font-size: 16px; font-weight: 800; color: var(--c-primary); background: rgba(14,148,135,0.1); padding: 4px 12px; border-radius: 20px; }
.timer-text.warning { color: var(--c-error); background: rgba(239,68,68,0.1); animation: pulse 1s infinite; }

.btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 54px; padding: 16px; border-radius: 16px; background: var(--g-brand); color: #fff; font-weight: 700; font-size: 16px; box-shadow: 0 10px 24px rgba(14, 148, 135, 0.3); transition: transform 0.2s; }
.btn:active { transform: scale(0.97); }

.game-container { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 15px; animation: fadeUp 0.4s ease; }

/* 🟢 GAME 1: LOCKED BOX */
.chest-wrap { position: relative; width: 200px; height: 140px; margin-bottom: 20px; }
.chest-body { position: absolute; bottom: 0; width: 100%; height: 90px; background: #B45309; border-radius: 10px; border: 4px solid #78350F; }
.chest-lid { position: absolute; top: 0; width: 100%; height: 60px; background: #D97706; border-radius: 10px 10px 0 0; border: 4px solid #78350F; border-bottom: none; transition: transform 0.5s; transform-origin: bottom; }
.chest-lid.open { transform: rotateX(-110deg); }
.chest-lock { position: absolute; top: 50px; left: 50%; transform: translateX(-50%); width: 40px; height: 40px; background: #FBBF24; border-radius: 8px; border: 3px solid #B45309; display: flex; align-items: center; justify-content: center; font-size: 20px; z-index: 2; }
.code-digits { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 3; }
.c-digit { width: 30px; height: 40px; background: #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; color: #78350F; }
.puzzle-box { background: #fff; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 300px; text-align: center; }
.puzzle-q { font-size: 22px; font-weight: 800; color: var(--c-navy); margin-bottom: 20px; }
.puzzle-opts { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
.p-opt { width: 60px; height: 60px; background: #F1F5F9; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: var(--c-navy); cursor: pointer; transition: all 0.2s; border: 2px solid transparent; touch-action: manipulation; }
.p-opt:active { transform: scale(0.9); }
.p-opt.correct { background: #DCFCE7; border-color: var(--c-success); color: var(--c-success); }
.p-opt.wrong { background: #FEE2E2; border-color: var(--c-error); color: var(--c-error); animation: shake 0.3s; }

/* 🟢 GAME 2: SLIDING PUZZLE (Original 3x3, 2 blanks) */
.slide-wrapper { position: relative; width: 280px; height: 280px; margin-bottom: 10px; }
.slide-grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 6px; background: #CBD5E1; padding: 6px; border-radius: 16px; }
.slide-tile { 
  border-radius: 12px; background: var(--g-brand); color: #fff; font-size: 28px; font-weight: 800; 
  display: flex; align-items: center; justify-content: center; cursor: grab; 
  box-shadow: inset 0 -4px 0 rgba(0,0,0,0.15), 0 4px 10px rgba(0,0,0,0.1); 
  transition: transform 0.1s; touch-action: none; position: relative; z-index: 2;
}
.slide-tile:active { cursor: grabbing; z-index: 10; transform: scale(1.05); }
.slide-tile.blank { background: transparent; box-shadow: none; cursor: default; pointer-events: none; }
.slide-tile.hidden-tile { opacity: 0; pointer-events: none; }

.move-counter { font-size: 14px; font-weight: 700; color: var(--c-slate); margin-top: 10px; }

/* 🟢 GAME 3: REACH THE NUMBER */
.reach-display { text-align: center; margin-bottom: 20px; }
.reach-current { font-size: 64px; font-weight: 800; color: var(--c-primary); line-height: 1; }
.reach-target { font-size: 16px; color: var(--c-slate); font-weight: 600; margin-top: 10px; }
.reach-target span { font-size: 24px; color: var(--c-blue); font-weight: 800; }
.reach-ops { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 300px; }
.reach-btn { padding: 16px; border-radius: 16px; background: #fff; border: 2px solid var(--c-primary); color: var(--c-primary); font-size: 20px; font-weight: 800; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: all 0.2s; touch-action: manipulation; }
.reach-btn:active { background: var(--c-primary); color: #fff; transform: scale(0.95); }

/* 🟢 INTERSTITIAL (Final) */
.interstitial { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 15px; width: 100%; animation: fadeUp 0.5s; padding: 0 10px; }
.avatar-circle { width: clamp(160px, 50vw, 220px); height: clamp(160px, 50vw, 220px); border-radius: 50%; overflow: hidden; box-shadow: 0 15px 40px rgba(15,23,42,0.15); border: 5px solid #fff; background: #E2E8F0; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 60px; }
.avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
.interstitial h2 { font-size: clamp(20px, 6vw, 26px); font-weight: 800; color: var(--c-navy); }
.interstitial p { font-size: clamp(14px, 4vw, 16px); color: var(--c-slate); line-height: 1.5; max-width: 280px; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
</style>
</head>
<body>

<div class="stage">
  <div class="phone">
    <div class="screen">
      
      <header>
        <button class="icon-btn" id="exitBtn" type="button" aria-label="Exit">✕</button>
        <div class="progress-bar" id="progress">
          <span class="active"></span><span></span><span></span>
        </div>
        <button class="icon-btn" id="langBtn" type="button" style="font-size:13px; color:var(--c-primary);">ع</button>
      </header>

      <main id="main"></main>

      <div class="footer" id="footer"></div>

    </div>
  </div>
</div>

<script>
/* ============================================================
   ⚠️ مكان الصور بتاعتك
============================================================ */
const AVATAR_IMAGES = {
  adult: {
    clap: ['الكبار تسقيفه 1.jpg', 'الكبار تسقيفه 2.jpg'], 
    encourage: ['الكبير جاب اقل من 50.jpg', 'الكبير جاب اقل من 50.jpg'] 
  },
  kid: {
    clap: ['اطفال تسقيفه 1.jpg', 'اطفال تسقيفه مقفوله.jpg'], 
    encourage: ['الصغير جاب اقل من 50.jpg', 'الصغير جاب اقل من 50.jpg'] 
  }
};

const I18N = {
  en: {
    startTitle: "Problem Solving",
    startDesc: "Test your logic and planning through 3 mini-puzzles.",
    startBtn: "Start Challenge",
    nextBtn: "Next Puzzle",
    
    g1Desc: "Solve the 3 puzzles to unlock the chest!",
    g1Q1: "What comes next? 1, 3, 5, ?",
    g1Q2: "Which is the odd one out?",
    g1Q3: "What comes next? 2, 4, 8, 16, ?",
    
    g2Desc: "Arrange numbers 1 to 7. (2 blanks to help you!)",
    
    g3Desc: "Reach the target number using the operations.",
    g3Target: "Target:",
    
    finTitle: "Assessment Complete",
    transGreat: "Brilliant!",
    transGreatDesc: "You solved the puzzles excellently!",
    transEncourage: "Good Effort!",
    transEncourageDesc: "Every puzzle makes you smarter. Keep practicing!",
    movesMsg: "You did it in {moves} moves. It could have been done in {optimal} clicks!",
    next: "Next"
  },
  ar: {
    startTitle: "حل المشكلات",
    startDesc: "اختبر منطقك وتخطيطك من خلال 3 ألعاب.",
    startBtn: "ابدأ التحدي",
    nextBtn: "اللعبة التالية",
    
    g1Desc: "حل الـ3 ألغاز عشان تفتح الصندوق!",
    g1Q1: "إيه اللي جاي؟ 1, 3, 5, ؟",
    g1Q2: "إيه الحاجة المختلفة؟",
    g1Q3: "إيه اللي جاي؟ 2, 4, 8, 16, ؟",
    
    g2Desc: "رتب الأرقام من 1 لـ 7. (في مربعين فاضيين لمساعدتك!)",
    
    g3Desc: "وصل للرقم الهدف باستخدام العمليات الحسابية.",
    g3Target: "الهدف:",
    
    finTitle: "اكتمل التقييم",
    transGreat: "عبقري!",
    transGreatDesc: "حليت الألعاب بامتياز!",
    transEncourage: "محاولة جيدة!",
    transEncourageDesc: "كل لعبة بتخليك أذكى. استمر في التدريب!",
    movesMsg: "حليتها في {moves} حركة. كان ممكن تتعمل في {optimal} كليك!",
    next: "التالي"
  }
};

let lang = localStorage.getItem('omega_lang') === 'ar' ? 'ar' : 'en';
let currentGameIndex = 0;
let totalScore = 0;
let slideTimerInterval = null;

const $ = id => document.getElementById(id);

function updateProgress() {
  const container = $('progress');
  container.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const span = document.createElement('span');
    if (i < currentGameIndex) span.className = 'done';
    else if (i === currentGameIndex) span.className = 'active';
    container.appendChild(span);
  }
}

function updateLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  $('langBtn').textContent = lang === 'ar' ? 'EN' : 'ع';
}

function nextGame(score) {
  if (slideTimerInterval) clearInterval(slideTimerInterval);
  totalScore += (score || 0);
  currentGameIndex++;
  
  $('footer').innerHTML = ''; 
  
  if (currentGameIndex < 3) {
    loadGame(currentGameIndex);
  } else {
    showResults();
  }
}

/* ============================================
   GAME DEFINITIONS
============================================ */
const GAMES = [
  // 1. LOCKED BOX
  {
    render: () => `
      <div class="instruction-box"><h2>${I18N[lang].g1Desc}</h2></div>
      <div class="game-container">
        <div class="chest-wrap">
          <div class="chest-lid" id="chestLid"></div>
          <div class="chest-body"></div>
          <div class="chest-lock" id="chestLock">🔒</div>
          <div class="code-digits">
            <div class="c-digit" id="d0">?</div>
            <div class="c-digit" id="d1">?</div>
            <div class="c-digit" id="d2">?</div>
          </div>
        </div>
        <div class="puzzle-box" id="puzzleBox"></div>
      </div>
    `,
    init: () => {
      let step = 0;
      const answers = ['7', '🥕', '32'];
      
      function renderPuzzle() {
        const box = $('puzzleBox');
        if (step === 0) {
          box.innerHTML = `
            <div class="puzzle-q">${I18N[lang].g1Q1}</div>
            <div class="puzzle-opts">
              <div class="p-opt" onclick="checkBox(6, this)">6</div>
              <div class="p-opt" onclick="checkBox(7, this)">7</div>
              <div class="p-opt" onclick="checkBox(8, this)">8</div>
            </div>
          `;
        } else if (step === 1) {
          box.innerHTML = `
            <div class="puzzle-q">${I18N[lang].g1Q2}</div>
            <div class="puzzle-opts">
              <div class="p-opt" onclick="checkBox('🍎', this)">🍎</div>
              <div class="p-opt" onclick="checkBox('🍌', this)">🍌</div>
              <div class="p-opt" onclick="checkBox('🥕', this)">🥕</div>
            </div>
          `;
        } else if (step === 2) {
          box.innerHTML = `
            <div class="puzzle-q">${I18N[lang].g1Q3}</div>
            <div class="puzzle-opts">
              <div class="p-opt" onclick="checkBox(24, this)">24</div>
              <div class="p-opt" onclick="checkBox(32, this)">32</div>
              <div class="p-opt" onclick="checkBox(20, this)">20</div>
            </div>
          `;
        }
      }

      window.checkBox = (val, el) => {
        if (String(val) === answers[step]) {
          el.classList.add('correct');
          $(`d${step}`).textContent = val;
          step++;
          if (step < 3) {
            setTimeout(renderPuzzle, 500);
          } else {
            $('chestLid').classList.add('open');
            $('chestLock').textContent = '🔓';
            $('puzzleBox').innerHTML = `<div class="puzzle-q" style="color:#22C55E">Success!</div>`;
            setTimeout(() => nextGame(1), 1000);
          }
        } else {
          el.classList.add('wrong');
          setTimeout(() => el.classList.remove('wrong'), 500);
        }
      };

      renderPuzzle();
    }
  },

  // 2. SLIDING PUZZLE (The exact 3x3 from original code)
  {
    render: () => `
      <div class="instruction-box">
        <h2>${I18N[lang].g2Desc}</h2>
        <div class="timer-text" id="slideTimer">60s</div>
      </div>
      <div class="game-container">
        <div class="slide-wrapper">
          <div class="slide-grid" id="slideGrid"></div>
        </div>
        <div class="move-counter">Moves: <span id="moveCount">0</span></div>
        <div id="penaltyMsg" style="color:var(--c-error); font-weight:700; font-size:13px; text-align:center; margin-top:5px; min-height:20px;"></div>
      </div>
    `,
    init: () => {
      const n = 3; 
      let T = [1, 2, 3, 4, 5, 6, 7, 0, 0]; // 7 tiles, 2 blanks
      let moves = 0;
      const optimalMoves = 25; 
      
      for (let i = 0; i < 30; i++) {
        const blanks = T.map((v, idx) => v === 0 ? idx : -1).filter(idx => idx !== -1);
        const b = blanks[Math.floor(Math.random() * blanks.length)];
        const x = b % n, y = Math.floor(b / n);
        const nb = [];
        if (x > 0) nb.push(b - 1);
        if (x < n - 1) nb.push(b + 1);
        if (y > 0) nb.push(b - n);
        if (y < n - 1) nb.push(b + n);
        const m = nb[Math.floor(Math.random() * nb.length)];
        T[b] = T[m];
        T[m] = 0;
      }

      let timeLeft = 60;
      const timerEl = $('slideTimer');
      if (slideTimerInterval) clearInterval(slideTimerInterval);
      
      slideTimerInterval = setInterval(() => {
        timeLeft--;
        timerEl.textContent = timeLeft + 's';
        if (timeLeft <= 10) timerEl.classList.add('warning');
        
        if (timeLeft <= 0) {
          clearInterval(slideTimerInterval);
          timerEl.textContent = "Time's up!";
          nextGame(0); 
        }
      }, 1000);

      const grid = $('slideGrid');
      let isDragging = false;
      
      function draw() {
        grid.innerHTML = T.map((v, i) => {
          if (v === 0) return `<div class="slide-tile blank"></div>`;
          return `<div class="slide-tile" data-i="${i}" data-val="${v}">${v}</div>`;
        }).join('');

        grid.querySelectorAll('.slide-tile:not(.blank)').forEach(t => {
          attachDrag(t);
        });
      }

      function attachDrag(el) {
        let startX, startY, currentIdx;
        
        el.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          el.setPointerCapture(e.pointerId);
          startX = e.clientX;
          startY = e.clientY;
          currentIdx = parseInt(el.dataset.i);
          isDragging = true;
          el.style.transition = 'none';
          el.style.zIndex = '10';
        });

        el.addEventListener('pointermove', (e) => {
          if (!isDragging) return;
          e.preventDefault();
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          el.style.transform = `translate(${dx}px, ${dy}px) scale(1.05)`;
        });

        el.addEventListener('pointerup', (e) => {
          if (!isDragging) return;
          e.preventDefault();
          isDragging = false;
          el.style.transition = 'all 0.2s ease';
          el.style.transform = '';
          el.style.zIndex = '2';

          const dx = e.clientX - startX;
          const dy = e.clientY - startY;

          let targetIdx = currentIdx;
          const x = currentIdx % n, y = Math.floor(currentIdx / n);
          const threshold = 20;

          if (Math.abs(dx) > Math.abs(dy)) {
            if (dx > threshold && x < n - 1) targetIdx = currentIdx + 1;
            else if (dx < -threshold && x > 0) targetIdx = currentIdx - 1;
          } else {
            if (dy > threshold && y < n - 1) targetIdx = currentIdx + n;
            else if (dy < -threshold && y > 0) targetIdx = currentIdx - n;
          }

          if (T[targetIdx] === 0) {
            T[targetIdx] = T[currentIdx];
            T[currentIdx] = 0;
            moves++;
            $('moveCount').textContent = moves;
            draw();
            checkWin();
          } else {
            draw();
          }
        });
      }

      function checkWin() {
        const isSolved = T.slice(0, 7).every((v, i) => v === i + 1);
        if (isSolved) {
          clearInterval(slideTimerInterval);
          $('slideGrid').style.boxShadow = '0 0 30px #22C55E';
          
          if (moves > optimalMoves) {
            $('penaltyMsg').textContent = I18N[lang].movesMsg.replace('{moves}', moves).replace('{optimal}', optimalMoves);
            setTimeout(() => nextGame(0.5), 2000);
          } else {
            setTimeout(() => nextGame(1), 500);
          }
        }
      }

      draw();
    }
  },

  // 3. REACH THE NUMBER
  {
    render: () => `
      <div class="instruction-box"><h2>${I18N[lang].g3Desc}</h2></div>
      <div class="game-container">
        <div class="reach-display">
          <div class="reach-current" id="reachCurrent">0</div>
          <div class="reach-target">${I18N[lang].g3Target} <span id="reachTarget">0</span></div>
        </div>
        <div class="reach-ops" id="reachOps"></div>
      </div>
    `,
    init: () => {
      let start = 4;
      let target = 24;
      let current = start;
      const ops = [
        { sym: '+', val: 4 },
        { sym: '×', val: 2 },
        { sym: '-', val: 2 }
      ];

      $('reachCurrent').textContent = current;
      $('reachTarget').textContent = target;

      const opsContainer = $('reachOps');
      opsContainer.innerHTML = ops.map((o, i) => 
        `<button class="reach-btn" type="button" data-i="${i}">${o.sym} ${o.val}</button>`
      ).join('');

      opsContainer.querySelectorAll('.reach-btn').forEach(btn => {
        btn.onclick = () => {
          const op = ops[parseInt(btn.dataset.i)];
          if (op.sym === '+') current += op.val;
          if (op.sym === '-') current -= op.val;
          if (op.sym === '×') current *= op.val;
          
          $('reachCurrent').textContent = current;

          if (current === target) {
            $('reachCurrent').style.color = '#22C55E';
            setTimeout(() => nextGame(1), 1000);
          } else if (current > target || current < 0) {
            $('reachCurrent').style.color = '#EF4444';
            setTimeout(() => {
              current = start;
              $('reachCurrent').textContent = current;
              $('reachCurrent').style.color = '#0E9487';
            }, 600);
          }
        };
      });
    }
  }
];

/* ============================================
   CORE LOGIC
============================================ */
function loadGame(index) {
  if (slideTimerInterval) clearInterval(slideTimerInterval);
  updateProgress();
  const game = GAMES[index];
  $('main').innerHTML = game.render();
  $('footer').innerHTML = ''; 
  game.init();
}

function startGame() {
  updateLang();
  currentGameIndex = 0;
  totalScore = 0;
  $('footer').innerHTML = ''; 
  
  $('main').innerHTML = `
    <div class="interstitial">
      <div style="font-size:80px; animation: float 3s infinite;">🧩</div>
      <h2>${I18N[lang].startTitle}</h2>
      <p>${I18N[lang].startDesc}</p>
    </div>
  `;
  $('footer').innerHTML = `<button class="btn" id="startBtn" type="button">${I18N[lang].startBtn}</button>`;
  $('startBtn').onclick = () => loadGame(0);
}

function showResults() {
  updateProgress();
  
  const accuracy = Math.round((totalScore / 3) * 100);
  localStorage.setItem('omega_problem_result', JSON.stringify({ accuracy, timestamp: Date.now() }));

  const passed = accuracy >= 50;
  let age = parseInt(localStorage.getItem('omega_user_age') || localStorage.getItem('omega_age')) || 0;
  const avatarType = (age > 0 && age <= 12) ? 'kid' : 'adult';
  
  $('main').innerHTML = `
    <div class="interstitial">
      <div class="avatar-circle" id="avatarBox">
        <img id="avatarImg" src="" alt="Avatar" onerror="this.style.display='none'; this.parentElement.innerHTML='${passed ? '👏' : '💜'}';">
      </div>
      <h2 id="transTitle"></h2>
      <p id="transDesc"></p>
    </div>
  `;

  let imgIndex = 0;
  let interval = null;
  const imgEl = $('avatarImg');

  if (passed) {
    $('transTitle').textContent = I18N[lang].transGreat;
    $('transDesc').textContent = `${I18N[lang].transGreatDesc} (${accuracy}%)`;
    
    const clapImgs = AVATAR_IMAGES[avatarType].clap;
    imgEl.src = clapImgs[0];
    imgEl.style.display = 'block';
    interval = setInterval(() => {
      imgIndex = (imgIndex + 1) % 2;
      imgEl.src = clapImgs[imgIndex];
    }, 250);
  } else {
    $('transTitle').textContent = I18N[lang].transEncourage;
    $('transDesc').textContent = `${I18N[lang].transEncourageDesc} (${accuracy}%)`;
    
    const encourageImgs = AVATAR_IMAGES[avatarType].encourage;
    imgEl.src = encourageImgs[0];
    imgEl.style.display = 'block';
    interval = setInterval(() => {
      imgIndex = (imgIndex + 1) % 2;
      imgEl.src = encourageImgs[imgIndex];
    }, 800);
  }

  setTimeout(() => {
    if(interval) clearInterval(interval);
    imgEl.src = passed ? AVATAR_IMAGES[avatarType].clap[0] : AVATAR_IMAGES[avatarType].encourage[0];
    
    $('footer').innerHTML = `<button class="btn" id="nextBtn" type="button">${I18N[lang].next}</button>`;
    
    $('nextBtn').onclick = () => {
      window.location.href = 'assessment-visual.html';
    };
  }, 2500);
}

/* --- EVENTS --- */
$('langBtn').onclick = () => { 
  lang = lang === 'ar' ? 'en' : 'ar'; 
  localStorage.setItem('omega_lang', lang);
  startGame(); 
};

$('exitBtn').onclick = () => { 
  if (confirm(I18N[lang].exitMsg || "Exit? Progress will be lost.")) {
    window.location.href = 'assessment-intro.html'; 
  }
};

// Boot
startGame();
</script>

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Omega — Reasoning Assessment</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --c-primary: #0E9487; --c-light: #2EC4B6; --c-blue: #3B82F6;
  --c-success: #22C55E; --c-error: #EF4444; --c-warning: #FBBF24;
  --c-navy: #0F172A; --c-slate: #64748B; --c-bg: #F8FAFC;
  --g-brand: linear-gradient(135deg, #0E9487 0%, #2EC4B6 45%, #3B82F6 100%);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'Poppins', sans-serif; background: #E2E8F0; overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent; }
html[lang="ar"] body { font-family: 'Cairo', sans-serif; }
button { font-family: inherit; cursor: pointer; border: 0; background: none; }

/* Phone Frame */
.stage { height: 100%; display: flex; align-items: center; justify-content: center; padding: 20px; }
.phone { position: relative; width: 375px; height: 812px; max-height: calc(100vh - 40px); border-radius: 44px; overflow: hidden; background: var(--c-bg); box-shadow: 0 0 0 10px #1a1a1a, 0 0 0 12px #2a2a2a, 0 40px 80px rgba(0,0,0,.35); }
@media (max-width: 480px) { .stage { padding: 0; } .phone { width: 100vw; height: 100vh; max-height: 100vh; border-radius: 0; box-shadow: none; } }

/* Screen Layout */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: linear-gradient(180deg, #F8FAFC 0%, #E2E8F0 100%); overflow: hidden; }

/* Header */
header { position: relative; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 52px 20px 10px; flex-shrink: 0; }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; background: #fff; border: 1px solid #E2E8F0; display: flex; align-items: center; justify-content: center; color: var(--c-slate); font-weight: 700; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
.progress-bar { display: flex; gap: 6px; }
.progress-bar span { width: 24px; height: 8px; border-radius: 10px; background: #CBD5E1; transition: all 0.3s; }
.progress-bar span.active { background: var(--c-primary); width: 32px; }
.progress-bar span.done { background: var(--c-blue); }

/* Main Content */
main { position: relative; z-index: 10; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 16px 20px; min-height: 0; overflow-y: auto; scrollbar-width: none; }
main::-webkit-scrollbar { display: none; }

/* Common UI */
.instruction-box { text-align: center; margin-bottom: 15px; min-height: 40px; display: flex; align-items: center; justify-content: center; padding: 0 10px; flex-shrink: 0; }
.instruction-box h2 { font-size: clamp(16px, 5vw, 20px); font-weight: 800; color: var(--c-navy); line-height: 1.3; }
.btn { width: 100%; max-width: 300px; padding: 16px; border-radius: 16px; background: var(--g-brand); color: #fff; font-weight: 700; font-size: clamp(14px, 4vw, 16px); box-shadow: 0 10px 24px rgba(14, 148, 135, 0.3); transition: transform 0.2s; margin-top: 15px; flex-shrink: 0; }
.btn:active { transform: scale(0.96); }
.game-container { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 15px; animation: fadeUp 0.4s ease; }

/* 🟢 GAME 1: DETECT THE LIE */
.suspects-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 320px; }
.suspect { background: #fff; border-radius: 16px; padding: 15px 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: all 0.2s; border: 2px solid transparent; }
.suspect:active { transform: scale(0.95); }
.suspect.wrong { border-color: var(--c-error); animation: shake 0.3s; }
.suspect-emoji { font-size: 40px; }
.suspect-item { font-size: 30px; }
.suspect-speech { background: #F1F5F9; border-radius: 10px; padding: 8px; font-size: 12px; font-weight: 700; color: var(--c-navy); text-align: center; width: 100%; }

/* 🟢 GAME 2: SYMBOL EQUATIONS */
.eq-board { background: #fff; border-radius: 20px; padding: 20px; width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
.eq-row { display: flex; justify-content: center; align-items: center; gap: 10px; font-size: 30px; font-weight: 800; color: var(--c-navy); }
.eq-row .op { font-size: 20px; color: var(--c-slate); }
.eq-row.highlight { background: #F0FDFA; padding: 10px; border-radius: 12px; border: 2px dashed var(--c-primary); }
.eq-opts { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
.eq-opt { width: 60px; height: 60px; background: #fff; border-radius: 12px; border: 2px solid #E2E8F0; font-size: 24px; font-weight: 800; color: var(--c-primary); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
.eq-opt.wrong { border-color: var(--c-error); color: var(--c-error); animation: shake 0.3s; }

/* 🟢 GAME 3: LOGIC TOWERS */
.towers-area { display: flex; align-items: flex-end; justify-content: center; gap: 20px; height: 200px; width: 100%; max-width: 300px; border-bottom: 4px solid #CBD5E1; padding-bottom: 5px; }
.tower { width: 60px; border-radius: 10px 10px 0 0; display: flex; justify-content: center; align-items: flex-start; padding-top: 10px; color: #fff; font-weight: 800; cursor: pointer; transition: all 0.2s; box-shadow: inset 0 4px 0 rgba(0,0,0,0.1); }
.tower:active { transform: scale(0.95); }
.tower.wrong { animation: shake 0.3s; opacity: 0.5; }
.clues-text { font-size: 16px; font-weight: 600; color: var(--c-navy); text-align: center; line-height: 1.6; margin-bottom: 15px; background: #fff; padding: 15px; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

/* 🟢 INTERSTITIAL (Final) */
.interstitial { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 15px; width: 100%; animation: fadeUp 0.5s; padding: 0 10px; }
.avatar-circle { width: clamp(160px, 50vw, 220px); height: clamp(160px, 50vw, 220px); border-radius: 50%; overflow: hidden; box-shadow: 0 15px 40px rgba(15,23,42,0.15); border: 5px solid #fff; background: #E2E8F0; flex-shrink: 0; }
.avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
.interstitial h2 { font-size: clamp(20px, 6vw, 26px); font-weight: 800; color: var(--c-navy); }
.interstitial p { font-size: clamp(14px, 4vw, 16px); color: var(--c-slate); line-height: 1.5; max-width: 280px; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
</style>
</head>
<body>
<div class="stage"><div class="phone"><div class="screen" id="screen">
  
  <header>
    <button class="icon-btn" id="exitBtn">✕</button>
    <div class="progress-bar" id="progress">
      <span class="active"></span><span></span><span></span>
    </div>
    <button class="icon-btn" id="langBtn" style="font-size:12px;">ع</button>
  </header>

  <main id="main"></main>

</div></div></div>

<script>
/* ============================================================
   ⚠️⚠️⚠️ مكان الصور بتاعتك (التسقيفة والتشجيع) ⚠️⚠️⚠️
============================================================ */
const AVATAR_IMAGES = {
  adult: {
    clap: ['الكبار تسقيفه 1.jpg', 'الكبار تسقيفه 2.jpg'], 
    encourage: ['adult_encourage_1.jpg', 'adult_encourage_2.jpg'] 
  },
  kid: {
    clap: ['اطفال تسقيفه 1.jpg', 'اطفال تسقيفه مقفوله.jpg'], 
    encourage: ['kid_encourage_1.jpg', 'kid_encourage_2.jpg'] 
  }
};
/* ============================================================ */

const I18N = {
  en: {
    startTitle: "Reasoning Challenge",
    startDesc: "Test your logic and deduction skills through 3 mini-puzzles.",
    startBtn: "Start Challenge",
    nextBtn: "Next Puzzle",
    
    // Game 1: Detect the Lie
    g1Desc: "Who is lying? Find the suspect whose statement is false.",
    g1Stmt1: "I have a red apple.",
    g1Stmt2: "I have a blue book.",
    g1Stmt3: "I have a red pencil.", // Wait, he has a green pencil. He lies.
    
    // Game 2: Symbol Equations
    g2Desc: "Find the value of the missing symbol.",
    
    // Game 3: Logic Towers
    g3Desc: "Based on the clues, which tower is the tallest?",
    g3Clue1: "The Red tower is taller than the Blue tower.",
    g3Clue2: "The Yellow tower is shorter than the Blue tower.",
    
    finTitle: "Assessment Complete",
    transGreat: "Brilliant!",
    transGreatDesc: "Your logic and deduction are excellent!",
    transEncourage: "Good Effort!",
    transEncourageDesc: "Reasoning takes practice. Keep going!"
  },
  ar: {
    startTitle: "تحدي الاستدلال",
    startDesc: "اختبر منطقك وقدرتك على الاستنتاج من خلال 3 ألعاب.",
    startBtn: "ابدأ التحدي",
    nextBtn: "اللعبة التالية",
    
    // Game 1: Detect the Lie
    g1Desc: "مين اللي بيكدب؟ لاقي الشخص اللي كلامه مش متطابق مع اللي ماسكه.",
    g1Stmt1: "أنا ماسك تفاحة حمرا.",
    g1Stmt2: "أنا ماسك كتاب أزرق.",
    g1Stmt3: "أنا ماسك قلم أحمر.",
    
    // Game 2: Symbol Equations
    g2Desc: "لاقي قيمة الرمز الناقص.",
    
    // Game 3: Logic Towers
    g3Desc: "بناءً على الأدلة، إيه هو أطول برج؟",
    g3Clue1: "البرج الأحمر أطول من البرج الأزرق.",
    g3Clue2: "البرج الأصفر أقصر من البرج الأزرق.",
    
    finTitle: "اكتمل التقييم",
    transGreat: "عبقري!",
    transGreatDesc: "استدلالك ومنطقك ممتازين!",
    transEncourage: "محاولة جيدة!",
    transEncourageDesc: "الاستدلال محتاج تدريب. يلا نكمل!"
  }
};

let lang = localStorage.getItem('omega_lang') === 'ar' ? 'ar' : 'en';
let currentGameIndex = 0;
let totalScore = 0;

const $ = id => document.getElementById(id);

function updateProgress() {
  const container = $('progress');
  container.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const span = document.createElement('span');
    if (i < currentGameIndex) span.className = 'done';
    else if (i === currentGameIndex) span.className = 'active';
    container.appendChild(span);
  }
}

function updateLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  $('langBtn').textContent = lang === 'ar' ? 'EN' : 'ع';
}

function nextGame(score) {
  totalScore += (score || 0);
  currentGameIndex++;
  if (currentGameIndex < 3) {
    loadGame(currentGameIndex);
  } else {
    showResults();
  }
}

/* ============================================
   GAME DEFINITIONS
============================================ */
const GAMES = [
  // 1. DETECT THE LIE
  {
    render: () => `
      <div class="instruction-box"><h2>${I18N[lang].g1Desc}</h2></div>
      <div class="game-container">
        <div class="suspects-grid">
          <!-- Suspect 1: Truth -->
          <div class="suspect" onclick="checkLie(false, this)">
            <div class="suspect-emoji">👩</div>
            <div class="suspect-item">🍎</div>
            <div class="suspect-speech">${I18N[lang].g1Stmt1}</div>
          </div>
          <!-- Suspect 2: Truth -->
          <div class="suspect" onclick="checkLie(false, this)">
            <div class="suspect-emoji">👨</div>
            <div class="suspect-item">📘</div>
            <div class="suspect-speech">${I18N[lang].g1Stmt2}</div>
          </div>
          <!-- Suspect 3: LIE (Has green pencil, says red) -->
          <div class="suspect" onclick="checkLie(true, this)">
            <div class="suspect-emoji">🧒</div>
            <div class="suspect-item">🖍️</div> <!-- Assuming green pencil emoji, or text -->
            <div class="suspect-speech">${I18N[lang].g1Stmt3}</div>
          </div>
        </div>
        <button class="btn" id="checkBtn" style="display:none; margin-top:20px;">${I18N[lang].nextBtn}</button>
      </div>
    `,
    init: () => {
      window.checkLie = (isCorrect, el) => {
        if (isCorrect) {
          el.style.borderColor = 'var(--c-success)';
          el.style.background = '#DCFCE7';
          setTimeout(() => nextGame(1), 1000);
        } else {
          el.classList.add('wrong');
          setTimeout(() => el.classList.remove('wrong'), 500);
        }
      };
    }
  },

  // 2. SYMBOL EQUATIONS
  {
    render: () => `
      <div class="instruction-box"><h2>${I18N[lang].g2Desc}</h2></div>
      <div class="game-container">
        <div class="eq-board">
          <div class="eq-row">
            <span>🍎</span> <span class="op">+</span> <span>🍎</span> <span class="op">=</span> <span>10</span>
          </div>
          <div class="eq-row">
            <span>🍎</span> <span class="op">+</span> <span>🍌</span> <span class="op">=</span> <span>8</span>
          </div>
          <div class="eq-row">
            <span>🍌</span> <span class="op">+</span> <span>🍇</span> <span class="op">=</span> <span>9</span>
          </div>
          <div class="eq-row highlight">
            <span>🍇</span> <span class="op">+</span> <span>🍎</span> <span class="op">=</span> <span>?</span>
          </div>
        </div>
        <div class="eq-opts">
          <div class="eq-opt" onclick="checkEq(11, this)">11</div>
          <div class="eq-opt" onclick="checkEq(10, this)">10</div>
          <div class="eq-opt" onclick="checkEq(12, this)">12</div>
        </div>
      </div>
    `,
    init: () => {
      window.checkEq = (val, el) => {
        if (val === 11) { // Grape (6) + Apple (5) = 11
          el.style.borderColor = 'var(--c-success)';
          el.style.color = 'var(--c-success)';
          setTimeout(() => nextGame(1), 1000);
        } else {
          el.classList.add('wrong');
          setTimeout(() => el.classList.remove('wrong'), 500);
        }
      };
    }
  },

  // 3. LOGIC TOWERS
  {
    render: () => `
      <div class="instruction-box"><h2>${I18N[lang].g3Desc}</h2></div>
      <div class="game-container">
        <div class="clues-text">
          ${I18N[lang].g3Clue1}<br>
          ${I18N[lang].g3Clue2}
        </div>
        <div class="towers-area">
          <!-- Heights: Red=150, Blue=110, Yellow=70 -->
          <div class="tower" onclick="checkTower('blue', this)" style="height: 110px; background: #3B82F6;">?</div>
          <div class="tower" onclick="checkTower('red', this)" style="height: 150px; background: #EF4444;">?</div>
          <div class="tower" onclick="checkTower('yellow', this)" style="height: 70px; background: #FBBF24;">?</div>
        </div>
      </div>
    `,
    init: () => {
      window.checkTower = (color, el) => {
        if (color === 'red') {
          el.style.boxShadow = '0 0 20px #EF4444';
          setTimeout(() => nextGame(1), 1000);
        } else {
          el.classList.add('wrong');
          setTimeout(() => el.classList.remove('wrong'), 500);
        }
      };
    }
  }
];

/* ============================================
   CORE LOGIC
============================================ */
function loadGame(index) {
  updateProgress();
  const game = GAMES[index];
  $('main').innerHTML = game.render();
  game.init();
}

function startGame() {
  updateLang();
  currentGameIndex = 0;
  totalScore = 0;
  $('main').innerHTML = `
    <div class="interstitial">
      <div style="font-size:80px; animation: float 3s infinite;">🧠</div>
      <h2>${I18N[lang].startTitle}</h2>
      <p>${I18N[lang].startDesc}</p>
      <button class="btn" id="startBtn">${I18N[lang].startBtn}</button>
    </div>
  `;
  $('startBtn').onclick = () => loadGame(0);
}

function showResults() {
  updateProgress();
  
  const accuracy = 85; // Placeholder for passing
  localStorage.setItem('omega_reasoning_result', JSON.stringify({ accuracy, timestamp: Date.now() }));

  const passed = accuracy >= 50;
  let age = parseInt(localStorage.getItem('omega_user_age') || localStorage.getItem('omega_age')) || 0;
  const avatarType = (age > 0 && age <= 12) ? 'kid' : 'adult';
  
  $('main').innerHTML = `
    <div class="interstitial">
      <div class="avatar-circle" id="avatarBox">
        <img id="avatarImg" src="" alt="Avatar">
      </div>
      <h2 id="transTitle"></h2>
      <p id="transDesc"></p>
      <button class="btn" id="nextBtn" style="opacity:0; pointer-events:none;">${I18N[lang].nextBtn}</button>
    </div>
  `;

  let imgIndex = 0;
  let interval = null;
  const imgEl = $('avatarImg');

  if (passed) {
    $('transTitle').textContent = I18N[lang].transGreat;
    $('transDesc').textContent = I18N[lang].transGreatDesc;
    
    const clapImgs = AVATAR_IMAGES[avatarType].clap;
    imgEl.src = clapImgs[0];
    interval = setInterval(() => {
      imgIndex = (imgIndex + 1) % 2;
      imgEl.src = clapImgs[imgIndex];
    }, 250);
  } else {
    $('transTitle').textContent = I18N[lang].transEncourage;
    $('transDesc').textContent = I18N[lang].transEncourageDesc;
    
    const encourageImgs = AVATAR_IMAGES[avatarType].encourage;
    imgEl.src = encourageImgs[0];
    interval = setInterval(() => {
      imgIndex = (imgIndex + 1) % 2;
      imgEl.src = encourageImgs[imgIndex];
    }, 800);
  }

  setTimeout(() => {
    if(interval) clearInterval(interval);
    imgEl.src = passed ? AVATAR_IMAGES[avatarType].clap[0] : AVATAR_IMAGES[avatarType].encourage[0];
    
    const nextBtn = $('nextBtn');
    nextBtn.style.transition = 'opacity 0.4s';
    nextBtn.style.opacity = '1';
    nextBtn.style.pointerEvents = 'auto';
    
    // This is the last assessment, so it redirects to the summary/complete page
    nextBtn.onclick = () => {
      window.location.href = 'assessment-complete.html';
    };
  }, 2500);
}

/* --- EVENTS --- */
$('langBtn').onclick = () => { lang = lang === 'ar' ? 'en' : 'ar'; startGame(); };
$('exitBtn').onclick = () => { if (confirm("Exit? Progress will be lost.")) window.location.href = 'assessment-intro.html'; };

startGame();
</script>
</body>
</html>
